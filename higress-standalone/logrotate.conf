# =============================================================================
# Rotation for the gateway access log.
#
# That file is the per-request record: one JSON line per request carrying
# consumer, request_id, model, tokens, status and duration. Vector tails it into
# ClickHouse, so the file on disk is a BUFFER, not the archive — ClickHouse holds
# the retained copy under its own TTL. Rotation here only has to stop the buffer
# growing without bound, which it did from the cutover until 2026-09-04.
#
# Run as smuser, not root: the log directory is mode 0777 and the file 0666, so
# no privilege is needed, and this deployment has no passwordless sudo. Driven
# from the user crontab — see ../qwen3.6-27b-2-A100/docs/OBSERVABILITY.md.
#
#   logrotate -s ~/.cache/logrotate-higress.state \
#             ~/inference-ops/higress-standalone/logrotate.conf
#
# NOT copytruncate, deliberately. It is the obvious choice for a file whose
# writer cannot be signalled, and it is wrong here for two reasons: it races —
# anything written between the copy and the truncate is lost — and Vector reads
# a truncated file as a new file and re-ingests it from byte zero, producing
# duplicate rows in the fact table. Envoy can be told to reopen instead, so it
# is told to.
# =============================================================================

/home/smuser/inference-ops/higress-standalone/compose/volumes/gateway/log/access.log {
    # Size-based, not daily. Volume here is driven by request rate, not by the
    # clock: ~850 bytes per request, so a quiet week is a few hundred KB and a
    # busy one is orders of magnitude more. A time trigger would rotate an empty
    # file every day and still let a burst run away between runs.
    size 64M

    # Two generations. ClickHouse is the archive; these exist only so that a
    # Vector outage of a few hours has something to catch up on.
    rotate 2

    compress
    delaycompress
    missingok
    notifempty

    # Do not recreate the file. Envoy holds the fd and is told to reopen below,
    # which recreates it with Envoy's own ownership and mode. A `create` here
    # would race with that and could leave a root-owned file that the next
    # rotation (running as smuser) cannot touch.
    nocreate

    sharedscripts
    postrotate
        # Envoy reopens every access log on this admin call. The admin API binds
        # 127.0.0.1 INSIDE the container, so this has to go through docker exec —
        # it is not reachable from the host or any network.
        #
        # `|| true`: a failed reopen must not abort logrotate. If this does fail,
        # Envoy keeps writing to the renamed inode and the symptom is a live
        # access.log.1 with a static access.log — which the Vector target-lag
        # check will surface.
        docker exec higress-gateway-1 \
            curl -s -XPOST http://127.0.0.1:15000/reopen_logs >/dev/null 2>&1 || true
    endscript
}
