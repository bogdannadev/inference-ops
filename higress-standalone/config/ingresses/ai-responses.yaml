# Billable path 3: OpenAI Responses API (POST /v1/responses), added 2026-09-17.
#
# Exact, and POST only in practice: the router also serves
# GET/DELETE /v1/responses/{id} and /cancel, but each replica stores responses
# in its own memory, so a retrieval can land on the replica that never saw it,
# and nothing checks that the caller owns the id. Only creation is offered.
# Clients should send `store: false`.
#
# Metered like chat: ai-quota and ai-statistics parse Responses usage
# (`response.usage` in the streamed `response.completed` event, top-level
# `usage` otherwise) — wasm-go pkg/tokenusage at the plugin's pinned commit.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-responses
  namespace: higress-system
  annotations:
    higress.io/destination: "qwen-router.dns:8000"
    higress.io/request-header-control-update: |
      Authorization Bearer ${SGLANG_API_KEY}
      x-request-id-labels {"consumer":"%REQ(X-MSE-CONSUMER)%"}
    higress.io/ignore-path-case: "false"
spec:
  ingressClassName: higress
  rules:
  - http:
      paths:
      - path: /v1/responses
        pathType: Exact
        backend:
          resource:
            apiGroup: networking.higress.io
            kind: McpBridge
            name: default
