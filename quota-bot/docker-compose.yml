# =============================================================================
# quota-bot — Telegram control surface for gateway access management.
#
# Deliberately its own compose project, not part of higress-standalone/. That
# tree tracks an upstream release and bin/update.sh re-extracts over it; adding
# a service there would put local work in the blast radius of an upgrade.
#
# No published ports. Telegram reaches the bot through Caddy over the `edge`
# network, so the only inbound surface is one already-public 443 that Caddy
# already terminates. Nothing new is exposed on the host.
# =============================================================================

services:
  quota-bot:
    build:
      context: .
    image: quota-bot:local
    container_name: quota-bot

    # Cores 48-55 are the observability/edge partition. r0 owns 0-27 and r1
    # owns 28-47; nothing here may compete with a replica.
    cpuset: "48-55"

    # Run as the host user that owns consumers.conf. The chiselled base defaults
    # to its own non-root uid, which cannot write a file owned by smuser — and
    # the bot's whole job includes rewriting that file.
    user: "1001:1001"

    restart: unless-stopped

    # Memory ceiling. Without one the .NET GC sizes itself against the WHOLE
    # machine — measured, it believed it could use 1,008 GiB — and this box runs
    # paid inference. The working set is ~14 MiB, so 128 MiB is ~9x headroom and
    # still a hard stop. Setting it also makes the GC treat that as its "total
    # physical memory", which is what makes the tuning below mean anything.
    mem_limit: 128m
    memswap_limit: 128m          # equal to mem_limit = no swap

    env_file:
      - .env

    environment:
      # ---- GC tuning -------------------------------------------------------
      # These have no MSBuild property, so unlike the rest of the build config
      # they cannot live in bot.cs's #:property directives — the environment is
      # the only way in. Numeric DOTNET_* values are HEX.
      #
      # Measured baseline before these: server=False (Workstation GC already, so
      # nothing to win there), pinned=0, committed=0MiB, ~14 MiB RSS.
      #
      # GCRegionSize=0x100000 (1 MiB): the default SOH region is 4 MiB. The docs
      # recommend 1 MiB specifically "for processes that have very small GC
      # heaps", where it reduces the GC's own native bookkeeping. That is exactly
      # this process.
      - DOTNET_GCRegionSize=100000
      # Trade CPU for footprint; the docs suggest starting between 5 and 7. This
      # bot is idle almost always, and bounded by a ~100ms round trip when it is
      # not, so CPU is the cheap side of that trade.
      - DOTNET_GCConserveMemory=5
      # No background GC thread. Background GC buys shorter pauses, and there is
      # no pause requirement here that a 100ms round trip has not already dwarfed.
      - DOTNET_gcConcurrent=0
      # ----------------------------------------------------------------------

      # Service addresses. Each is on a network this container joins below.
      - GATEWAY_URL=http://higress:80
      - APISERVER_URL=https://apiserver.svc:8443
      - REDIS_HOST=higress-redis
      - PROMETHEUS_URL=http://qwen36-27b-prometheus:9090
      # Alertmanager lives on `edge`, same as this bot and Prometheus. It is on
      # `edge` rather than the metrics backend precisely so that it can reach
      # this container without this container having to join the backend — a
      # bot reachable from the internet must never gain a route to the worker
      # ports. ALERT_WEBHOOK_SECRET comes from .env and must match the
      # credentials_file Alertmanager presents.
      - ALERTMANAGER_URL=http://qwen36-27b-alertmanager:9093
      - KUBECONFIG_PATH=/etc/kube/config
      - CONSUMERS_PATH=/data/consumers.conf
      - AUDIT_PATH=/var/lib/quota-bot/audit.log

    networks:
      # Reaches the gateway (quota admin API) and Prometheus, and is where
      # Caddy finds the bot to forward webhooks to.
      edge:
      # Reaches higress-redis to enumerate and delete ledger entries.
      higressint:
      # Reaches the apiserver to read and write the key-auth object. This is
      # how keys are issued without a Docker socket, root, or write access to
      # the root-owned conf/ tree.
      higress-net:

    volumes:
      # The consumer table, read-write. This is the bot's only credential-bearing
      # mount and the single most sensitive thing it touches.
      #
      # Rewrites truncate in place rather than renaming, so the inode the
      # container holds stays valid — the same trap that bites the Caddyfile.
      - ../higress-standalone/consumers.conf:/data/consumers.conf
      # Append-only record of every access and balance change the bot makes.
      - ./data:/var/lib/quota-bot
      # The apiserver client certificate, read from the kubeconfig the Higress
      # deployment already generates. Mounted rather than copied so there is one
      # place to rotate, not two. World-readable by design in that tree; the key
      # material never leaves the host.
      - ../higress-standalone/compose/volumes/kube/config:/etc/kube/config:ro

    healthcheck:
      test: ["CMD", "/app/bot", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # Cloudflare Tunnel connector.
  #
  # WHY THIS EXISTS, and it is not a preference: Telegram's servers cannot open
  # a connection to this host. Measured 2026-09-03 — Telegram reported
  # "Connection timed out" continuously while its requests never reached Caddy
  # at all (no access-log entry, flat request counter), yet inbound from a US
  # checker and from Let's Encrypt both worked. Outbound is filtered too:
  # 149.154.167.220:443 connects, 91.108.4.1:443 does not. The filtering is
  # upstream of this box.
  #
  # cloudflared dials OUT to Cloudflare's edge, so Telegram delivers to a
  # Cloudflare hostname and the update is pushed down an outbound-initiated
  # connection. The webhook design survives intact — push delivery, secret
  # token, no polling — because nothing has to dial in.
  #
  # --protocol http2 rather than the default QUIC: TCP 7844 to the argotunnel
  # edges is verified reachable here, UDP is not, and a connector that silently
  # falls back is a connector whose failure mode you learn about during an
  # incident.
  # ---------------------------------------------------------------------------
  cloudflared:
    # Pinned 2026-09-04. Was `:latest`, the loosest possible reference. This
    # service is declared but not currently running; pinned anyway so that
    # whenever it is started it is a known build.
    image: cloudflare/cloudflared@sha256:51c9cefcb4569df44e1ad403ab1d3d8065aa8e84339bcfc6aee75502e1140339
    container_name: quota-bot-tunnel
    # Behind a profile so a plain `docker compose up -d` cannot start it with an
    # empty token and crash-loop. Enable once CLOUDFLARE_TUNNEL_TOKEN is set:
    #   COMPOSE_PROFILES=tunnel docker compose up -d
    profiles: [ "tunnel" ]
    cpuset: "48-55"
    restart: unless-stopped
    command: tunnel --no-autoupdate --protocol http2 run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    env_file:
      - .env
    networks:
      # Only needs to reach quota-bot; it has no business on higressint or
      # higress-net, where the unauthenticated apiserver lives.
      edge:
    depends_on:
      - quota-bot
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# -----------------------------------------------------------------------------
# All three networks are owned by other compose projects. Declared external so
# this project can never create or remove them.
# -----------------------------------------------------------------------------
networks:
  edge:
    external: true
  higressint:
    external: true
  higress-net:
    external: true
    name: higress_higress-net
