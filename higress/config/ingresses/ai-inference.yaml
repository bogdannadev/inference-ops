# The one route. Path-based, not model-name-based: we have a single upstream
# and a single model, so the multi-provider x-higress-llm-model routing the
# upstream ai-gateway template builds would be pure overhead.
#
# No `host:` — the route matches any Host, which is what lets it be exercised
# as http://higress:8080/... from inside the `edge` network before any public
# hostname exists.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-inference
  namespace: higress-system
  annotations:
    # <registry-name>.<registry-type>:<port>. The port is mandatory; without it
    # Envoy answers 503 and gateway.log says cluster_not_found. Getting the
    # type wrong here (`.dns` against a `static` registry) was the other half
    # of the August 503.
    higress.io/destination: "qwen-router.dns:8000"

    # Swap the consumer's key for the engine credential.
    #
    # This is a ROUTE-level header rule, so Envoy applies it at the router
    # filter — after the whole wasm chain has run. That ordering is exactly
    # what we want: key-auth still sees the consumer's own key, and only the
    # value that leaves for the upstream is rewritten.
    #
    # The value must reach the WORKERS, not the router: qwen36-27b-router runs
    # with no --api-key at all, while qwen36-27b-r0/r1 run
    # --api-key <the SGLANG_API_KEY value>. The router passes Authorization through.
    #
    # Format is "<Header><whitespace><Value>", one per line.
    higress.io/request-header-control-update: |
      Authorization Bearer ${SGLANG_API_KEY}

    # No x-request-id rule needed: Envoy's HTTP connection manager generates
    # and forwards x-request-id on its own. That is the join key against the
    # engine traces already in Langfuse — the sglang-router drops inbound W3C
    # trace context but does record an inbound request id as
    # attributes.request_id on the root span, and echoes the header back.

    higress.io/ignore-path-case: "false"
spec:
  ingressClassName: higress
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          resource:
            apiGroup: networking.higress.io
            kind: McpBridge
            name: default
