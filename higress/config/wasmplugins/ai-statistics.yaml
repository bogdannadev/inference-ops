# Per-consumer usage metrics. NOT a dependency of ai-quota — despite what the
# docs say, ai-quota extracts token usage itself via tokenusage.GetTokenUsage.
# This plugin exists purely so the numbers reach Prometheus and the access log.
#
# It emits counters named
#   route.<route>.upstream.<cluster>.model.<model>.consumer.<consumer>.metric.<name>
# where <consumer> comes from the same X-Mse-Consumer header key-auth sets
# (main.go:697). Unauthenticated requests bucket as "none".
#
# Streaming is handled properly in 2.0.x: the plugin ships its own SSE framer
# (sse_framer.go) and a processTokenUsageEvent() that reads usage out of
# individual frames, so it never buffers the body.
#
# failStrategy is FAIL_OPEN here, deliberately and in contrast to key-auth and
# ai-quota: losing metrics is not a reason to stop serving inference. Losing
# authentication or quota enforcement is.
apiVersion: extensions.higress.io/v1alpha1
kind: WasmPlugin
metadata:
  name: ai-statistics
  namespace: higress-system
  resourceVersion: "1"
spec:
  url: http://localhost:8002/plugins/ai-statistics/2.0.1/plugin.wasm

  failStrategy: FAIL_OPEN

  phase: UNSPECIFIED_PHASE
  priority: 900

  defaultConfigDisable: true

  matchRules:
    - ingress:
        - ai-chat
        - ai-completions
        - ai-models
      configDisable: false
      config:
        # FALSE, deliberately. `true` enables the builtin attribute set, which
        # writes question / system / answer / reasoning / tool_calls into the
        # gateway access log — i.e. every customer prompt and every model
        # response, verbatim, on disk. Unacceptable for third-party traffic,
        # and at 169k context it is also a log-volume and disk problem.
        #
        # It costs latency too: extracting those fields makes the plugin buffer
        # the request body and the streaming response body (see the comment at
        # main.go:214). Off, nothing is buffered.
        #
        # The per-consumer token counters do NOT come from this setting. They
        # are emitted from tokenusage in the response handler and are gated
        # only by disable_openai_usage (default false), so
        # route.<r>.upstream.<c>.model.<m>.consumer.<n>.metric.{input,output,total}_token
        # keep working. Verified after the change.
        use_default_attributes: false
