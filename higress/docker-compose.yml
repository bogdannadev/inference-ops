# =============================================================================
# Higress — AI gateway (EVALUATION)
#
# Standalone compose project, deliberately separate from the inference stack in
# ../qwen3.6-27b-2-A100. It joins that stack only through the shared external
# `edge` network, the same way the embedder project does. Nothing here can
# recreate, restart or orphan an inference container.
#
# Goal: per-consumer API keys with TOKEN quotas and per-consumer usage
# statistics — the thing Caddy structurally cannot do, because metering tokens
# means parsing the OpenAI response body and buffering a response destroys SSE
# streaming. See README.md for the full rationale and the current state.
#
# Bring up and configure:
#   docker compose up -d
#   ./apply.sh
#
# The public edge is NOT touched by any of this. Live traffic keeps flowing
# through the Caddy in ../qwen3.6-27b-2-A100, which still fronts the router
# directly with its single edge key. Higress is exercised from inside the
# `edge` network until it earns a cutover:
#
#   docker run --rm --network edge curlimages/curl:latest \
#     curl -sS -H "Authorization: Bearer <consumer-key>" \
#     http://higress:8080/v1/models
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # All-in-one: supervisord over apiserver, controller, pilot, envoy, console
  # and the wasm plugin server. Higress's answer to "Istio without Kubernetes".
  #
  # MODE=full keeps the console, which is how the config model gets learned.
  #
  # CONFIG_TEMPLATE is deliberately UNSET. Setting it to `ai-gateway` (what the
  # upstream install.sh does) makes /usr/local/bin/config-template/ai-gateway.sh
  # seed a multi-provider, model-name-routed config we do not want — and on this
  # image it is actively broken: the script hardcodes plugin URLs at version
  # 1.0.0 while only 2.0.1 ships on disk, the plugin server is plain static
  # nginx with no rewrite, and every plugin it writes is failStrategy:FAIL_OPEN.
  # The result answers 200 to everything while metering nothing. Our config is
  # authored by hand in ./config instead.
  #
  # O11Y=off is redundant (base.sh already defaults it off) but kept explicit:
  # the image also bundles Prometheus, Grafana, Loki and Promtail, and the A100
  # node already runs its own Prometheus and Grafana with tuned retention and
  # dashboards. Two Prometheis scraping one stack is not observability.
  # ---------------------------------------------------------------------------
  higress:
    # Digest-pinned. These images are published ONLY to the Aliyun registry —
    # not Docker Hub, not ghcr — and pulls from this host are unreliable (the
    # first attempt died with a connection reset from the token endpoint and
    # the retry succeeded). A digest makes a re-pull verifiable.
    #
    # Do not bump this casually. The plugin versions this digest carries
    # (key-auth 2.0.0, ai-quota 2.0.1, ai-statistics 2.0.1) have been read at
    # the source level; a newer image is an unaudited one.
    image: higress-registry.cn-hangzhou.cr.aliyuncs.com/higress/all-in-one@sha256:930b314be06e4b435617a39ac8dc8f17c9d60a4faf2c96aa7aafe9e85381ad9b
    container_name: higress

    # Cores 48-55 are the observability/edge partition on this host. r0 owns
    # 0-27 and r1 owns 28-47; the gateway must never compete with a replica.
    cpuset: "48-55"

    environment:
      - MODE=full
      - O11Y=off

    ports:
      # Console on loopback only, same pattern as Grafana and Langfuse:
      #   ssh -L 8001:127.0.0.1:8001 <host>
      - "127.0.0.1:8001:8001"

    expose:
      # Gateway. Unpublished — reachable only from the `edge` network, so the
      # evaluation cannot accidentally become a public endpoint.
      - "8080"

    volumes:
      # Kubernetes-style resources, one file per object under /data/<kind>/.
      # The apiserver runs with `--storage file --file-root-dir /data`, and the
      # image's own config templates write YAML straight into this tree before
      # the apiserver starts — so files here ARE the config, not a cache of it.
      - ./data:/data
      # Our committed source of truth, read-only. apply.sh renders it into
      # /data and restarts; nothing here is authored through the console.
      - ./rendered:/rendered:ro

    # Scaffolding, not a service: it must not resurrect itself after a host
    # reboot while it is still under evaluation.
    restart: "no"

    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "2"

    networks:
      - edge
      - higressint

  # ---------------------------------------------------------------------------
  # Quota ledger.
  #
  # A DEDICATED instance, deliberately not the A100 stack's langfuse-redis:
  # sharing would couple quota enforcement to the trace pipeline's uptime and
  # put two unrelated failure domains in one process to save ~10MB of RSS.
  #
  # PERSISTENCE IS LOAD-BEARING — this reverses the original design note, which
  # was written when this was going to be a rate-limit bucket. ai-quota is a
  # ledger. It stores each consumer's remaining token balance at
  # chat_quota:<consumer> and DECRBYs it after every completion. In its source,
  # a missing key is not "unlimited", it is denied:
  #
  #     if response.IsNull() { isDenied = true }   ->  403 "No quota left"
  #
  # so an ephemeral Redis means every restart locks every consumer out until
  # they are re-seeded. appendonly yes makes the balances survive.
  #
  # noeviction for the same reason: evicting a balance key silently denies that
  # consumer. Better to fail writes loudly than to lose a ledger entry.
  #
  # Note the blast radius this creates: ai-quota parses exactly five config
  # keys and has NO fail-open option. A Redis error is indistinguishable from
  # an empty balance in its code, so while Higress fronts a route, Redis being
  # down means 403 for everyone on it. That is why the cutover plan adds a
  # second hostname rather than moving the existing one.
  # ---------------------------------------------------------------------------
  redis:
    image: docker.io/redis:7
    container_name: higress-redis

    cpuset: "48-55"

    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --save ""
      --maxmemory-policy noeviction

    expose:
      - "6379"

    volumes:
      # Named volume, not a bind mount: the container writes as its own uid and
      # a host-side bind mount would land root-owned in the project directory.
      - quota-ledger:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

    restart: "no"

    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "2"

    networks:
      - higressint

networks:
  # Created once, outside any compose project:  docker network create edge
  # Members: the A100 node's Caddy and router, the embedder, and now this.
  edge:
    name: edge
    external: true

  # Private: gateway <-> redis only.
  #
  # The name is letters-only ON PURPOSE. Higress reaches Redis through an
  # McpBridge `dns` registry, and registry/direct/watcher.go validates DNS
  # endpoints against:
  #
  #   ^(?:[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?\.)+[a-zA-Z]{2,63}$
  #
  # The last label must be letters only, so Docker's `<container>.<network>`
  # name resolves as `higress-redis.higressint` (valid) but would have been
  # `higress-redis.higress-internal` (rejected — hyphen in the last label).
  # A rejected endpoint makes generateServiceEntry return nil while the watcher
  # still logs "Registry Watcher is ready", which is a silent no-upstream.
  higressint:
    name: higressint
    driver: bridge

volumes:
  quota-ledger:
    name: higress-quota-ledger
