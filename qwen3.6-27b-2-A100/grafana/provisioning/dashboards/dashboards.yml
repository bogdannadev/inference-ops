# =============================================================================
# Grafana dashboard provisioning — qwen36-27b A100 node
# Location in repo: ./grafana/provisioning/dashboards/dashboards.yml
# Auto-loads every *.json below at Grafana boot.
#
# Organisation (production best practice):
#   foldersFromFilesStructure: true — each subdirectory of this folder maps to
#     a Grafana folder, so dashboards are grouped by concern instead of dumped
#     in one flat list. Current folders:
#       overview/  Overview          — cross-tier SLO summary, the home board
#       sglang/    SGLang Engine     — per-replica engine internals
#       router/    Router Proxy      — dispatch, worker health, circuit breaker
#       gpu/       GPU Hardware      — DCGM telemetry
#       host/      Host Hardware     — node-exporter
#       edge/      Edge Gateway      — Caddy: the tier in front of everything
#       pipeline/  Trace Pipeline    — OTel Collector -> Langfuse ingest health
#       gateway/   AI Gateway        — Higress: per-consumer tokens, quotas, denials
#       usage/     Usage & Quota     — the ledger: balances, burn, days-left, share of node
#
#   allowUiUpdates: false   — the checked-in JSON is the source of truth. UI
#     edits are NOT saved back to these files and are overwritten on the next
#     scan. Edit the JSON in this repo, not the browser.
#   disableDeletion: true   — protect provisioned dashboards from accidental
#     UI deletion.
#   updateIntervalSeconds: 10 — re-scan interval. Matches the Grafana default;
#     stated explicitly so the reload cadence is visible when editing JSON by
#     hand, which is the workflow this repo uses.
# =============================================================================

apiVersion: 1

providers:
  - name: "qwen36-27b inference"
    orgId: 1
    type: file
    disableDeletion: true
    updateIntervalSeconds: 10
    allowUiUpdates: false
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: true
