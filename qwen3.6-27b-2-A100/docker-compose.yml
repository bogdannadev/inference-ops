# =============================================================================
# MODEL: Qwen3.6-27B -> Qwen3.8-27B, 2026-08-15. NO ENGINE CHANGE.
#
# The engine digest below is UNTOUCHED. v0.5.17 is still the newest stable
# release (checked 2026-08-15; v0.5.16 was 07-25, nothing after 08-08), and
# 3.8 needs no new code:
#
#   config.json          byte-identical to 3.6 except `transformers_version`
#   architectures        Qwen3_5ForConditionalGeneration (unchanged) — the
#                        class v0.5.17 already registers, so it just loads
#   weights              1199 tensors / 51.75 GiB / same module tree
#                        (language_model 850, visual 333, mtp 15, lm_head 1).
#                        HF shows 18 shards vs 15 — repacking, same bytes.
#   tokenizer            vocab identical (248044), same merges/normalizer.
#                        Only 7 reserved audio/TTS specials added
#                        (248070-248076). Token IDs are stable.
#
# Same shapes => the memory arithmetic does not move. Expect the SAME boot
# gates as 3.6: max_total_num_tokens 171008, decode bs [1, 2, 3, 4], mamba
# pool 43 slots. A deviation means something OTHER than the weights changed —
# investigate before serving.
#
# REJECTED: lmsysorg/sglang:qwen38-27b-cu129. It is a build of PR #34859 from
# a fork, still OPEN and in merge-conflict; its wheel reports
# 0.0.0.dev0+qwen38.27b.g561c8f3 while its LABEL claims a different commit
# (nightly-dev-cu12-20260814-c4271c3f) inherited from the base image — exactly
# the provenance hole the 2026-08-08 digest pin closed. Its content is
# Hopper/Blackwell: hopper_bf16_gemv, sm120_fp8_gemv, sm100 splitk GEMM, MNNVL
# CuteDSL all-reduce, DeepEP v2. Nothing for SM80. It also swaps cu130 -> cu129
# and a dev FlashInfer under our flashinfer attention backend, which would
# invalidate every A/B baseline in tuning/.
#
# --default-chat-template-kwargs — THE ONLY NEW FLAG. 3.8 ships a reworked
# chat template with two behaviour changes that are silent on a model swap:
#
#   reasoning_effort   NEW. Defaults to `xhigh`, which injects a 209-char
#                      "think carefully, validate key assumptions..." system
#                      instruction into EVERY request. Tiers are low / medium
#                      / xhigh ONLY — `medium` has no branch and so injects
#                      nothing at all (that is how you get 3.6's rendering).
#   preserve_thinking  DEFAULT FLIPPED off -> on. Prior assistant turns now
#                      keep their <think> blocks. `reasoning_content` is an
#                      SGLang extension, not OpenAI schema, so a standard
#                      client replays only `content` and the template wraps
#                      nothing: history fills with EMPTY <think></think>
#                      blocks. Pinned false, which reproduces 3.6 exactly
#                      (verified: identical rendering in 6/6 message shapes,
#                      incl. tools and tool-call round trips).
#
# WHY THE VALUES ARE PINNED HERE RATHER THAN LEFT TO THE CLIENT: the template
# hard-raises on any other tier. SGLang's protocol layer happily accepts the
# full OpenAI list (none/minimal/low/medium/high/xhigh/max, or a float) and
# passes it straight to Jinja, which then raises — so a client sending the
# ordinary OpenAI `reasoning_effort: "high"` gets a 400. Setting it server-side
# disarms that: in serving_chat.py the server default is merged into
# chat_template_kwargs (setdefault, after the per-request key is POPPED at
# _convert_to_internal_request) and then OVERWRITES the top-level field at
# render time, so our value always wins. Note the consequence — for
# reasoning_effort specifically this flag is a LOCK, not a default, despite
# what its --help says. preserve_thinking is unaffected and stays
# client-overridable.
#
# Full analysis, evidence and rollout gates: tuning/docs/UPGRADE_QWEN3.8.md
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Replica 0 — physical GPU 0, NUMA node 0 cores
  # Internal endpoint: http://qwen36-27b-r0:8001
  #
  # Flag-group rationale (applies to both replicas) — VERIFIED 2026-07-28
  # against the live process (/get_server_info) and the boot log, not assumed.
  #
  #   context/tokens : --context-length 169000 (was 160000, raised 2026-07-31b).
  #                    It sits just under the measured 169,792-token KV pool,
  #                    which is memory ALREADY PAID FOR — Phase 1 grew the pool
  #                    to 169,792 but left the flag at 160,000, so ~9,800 tokens
  #                    per replica were bought and never advertised. Raising the
  #                    flag costs zero VRAM: the pool is preallocated at boot
  #                    from --mem-fraction-static and does not move with this
  #                    flag. Page size is 64 and 169,792 = 64 x 2,653, so 169,000
  #                    leaves 792 tokens of slack for the EAGLE draft tokens that
  #                    also occupy pool slots.
  #
  #                    --max-total-tokens REMOVED 2026-07-31b. It was 190000 and
  #                    inert only by coincidence (169,792 < 190,000). It is a
  #                    documented DEBUGGING ceiling, not a capacity knob, and it
  #                    would have silently capped the pool the moment any future
  #                    change pushed it past 190,000. Memory profiling governs
  #                    pool size; there is no reason for a second, weaker ceiling
  #                    that fails quietly. Do not reintroduce it.
  #
  #                    WHY NOT HIGHER (measured 2026-07-31b, corrects an earlier
  #                    assumption): the boot log's "available_gpu_mem = 8.37 GB"
  #                    is NOT spendable — it is sampled BEFORE the CUDA graphs
  #                    (1.55 GiB) and the FlashInfer workspaces + CUDA context
  #                    (~1.2 GiB) are allocated. True free VRAM at steady state
  #                    is ~4.4 GiB (nvidia-smi: 4,469 MiB, both GPUs identical).
  #                    The static budget is fully consumed and closes exactly:
  #                      0.92 x 79.27 GiB = 72.93 GiB budget
  #                      weights 56.58 + mamba 5.46 + KV 11.00 = 73.04 GiB
  #                    That remaining ~4.4 GiB is also the runtime working space
  #                    for chunked prefill, so it cannot all be spent. Each +0.01
  #                    of --mem-fraction-static buys ~12,500 tokens and costs
  #                    ~0.79 GiB of it. The model's native 262,144 would need
  #                    +5.98 GiB of KV at BF16 and is therefore NOT reachable on
  #                    this footprint — see tuning/next-session/CONTEXT_262144.md,
  #                    whose arithmetic assumed the 8.37 GB figure was real.
  #
  #                    Previously it advertised
  #                    184320 while the pool held only 117760, so a request
  #                    in between passed the length check and then failed to
  #                    allocate. A client managing its own context budget was
  #                    managing to a number 63% too large, which defeats the
  #                    context management coding agents already do.
  #                    Measured at --mem-fraction-static 0.90 (2026-07-28):
  #                      max_total_num_tokens = 160768, free VRAM 5.73 GB
  #                    vs 0.85: 112960 tokens, free 9.87 GB. Decode speed is
  #                    IDENTICAL (68.97 vs 68.50 tok/s) — 0.90 buys capacity,
  #                    not throughput. Stress at 2x 117,624-token prompts hit
  #                    78,758/81,920 MiB = 96.1% with zero OOM; the pool is
  #                    preallocated at boot and runtime demand is bounded by
  #                    --chunked-prefill-size and --max-running-requests, so
  #                    that 96% is mostly static, not a live high-water mark.
  #                    NOTE: 160,768 tokens is the pool shared by ALL in-flight
  #                    requests. Two concurrent 160K requests do not fit; the
  #                    scheduler serialises/retracts rather than erroring. The
  #                    practical concurrent ceiling is ~80K each.
  #                    --max-total-tokens 190000 is inert (memory profiling
  #                    wins, and 160768 < 190000). Docs call it a debugging
  #                    ceiling. Left in place; do not tune capacity with it.
  #
  #   over-length    : --allow-auto-truncate stays OFF (default). Truncation is
  #                    SILENT and lossy — the caller is never told part of the
  #                    prompt was dropped, so an agent can lose its system
  #                    prompt or tool definitions and still get a confident
  #                    answer. A hard 400 is also what the cloud APIs this
  #                    team already uses return for an over-long request, so
  #                    the loud failure is the FAMILIAR behaviour, not the
  #                    surprising one. Error text is clear and actionable:
  #                    "Input length (N tokens) exceeds the maximum allowed
  #                     length (M tokens)."
  #
  #   prefill/decode : chunked-prefill and max-prefill aligned at 4096 since
  #                    2026-09-13 (was 16384): DFlash2 leaves less activation
  #                    headroom and 16384-token chunks OOM'd. See the header.
  #                    --max-running-requests 4 (1 -> 2 on 2026-07-28,
  #                    2 -> 4 on 2026-07-31). Four concurrent 36K-token
  #                    requests use 144K of the 160,768-token pool; the Mamba
  #                    state pool costs 4 slots per running request out of 48,
  #                    so 16/48 — KV is the tighter of the two, not Mamba.
  #
  #                    Why 2 was too low: re-reading ladder.py, split_r0/r1 are
  #                    spec_verify_calls deltas counted PER REQUEST, and
  #                    aggregate_tok_s is tokens/wall. With 2 per replica the
  #                    admission cap is 4 across the pair, so every ladder rung
  #                    above 4 ran as WAVES of 4. Modelling wall as
  #                    ceil(c/4) x 3.057s predicts 6.114 / 6.114 / 9.171 s at
  #                    c=6/8/12 vs measured 5.951 / 6.560 / 9.961 — and c=6
  #                    is visibly bimodal (p50 3.232 = one wave, max 5.948 =
  #                    two). The ~240 tok/s "plateau" was never GPU saturation;
  #                    it was c=4 replayed. See benchmarks/TUNING_PLAN.md.
  #
  #                    Headroom check: at c=4, r0 did 123 verify calls in
  #                    3.057 s with 2 concurrent requests = 20.12 BATCHED
  #                    forwards/s. 54 GB of BF16 weights x 20.12 = 1086 GB/s,
  #                    56.1% of A100 HBM peak. Decode GEMMs at batch 2-4 have
  #                    arithmetic intensity ~2-4 FLOP/byte against A100's BF16
  #                    balance point of ~156, so a wider batch divides the same
  #                    forward rate across more streams rather than slowing it.
  #                    Accept length was flat under load (3.23 at c=1 ->
  #                    3.21 at c=6), so batching does not cost speculation.
  #
  #   cuda graph     : --cuda-graph-max-bs-decode is CLAMPED to
  #                    max-running-requests, so it MUST move with it or the
  #                    raise is silently capped. At max-running-requests 1 the
  #                    boot log captured bs=[1] for target-verify, draft-decode
  #                    and draft-extend despite this flag saying 2 — there was
  #                    never any "pre-paid headroom". Live server_args at
  #                    max-running-requests 2 showed decode bs=[1, 2]; after
  #                    this change expect bs=[1, 2, 3, 4]. VERIFY in the boot
  #                    log — if it still reads [1, 2], the clamp did not lift
  #                    and the concurrency raise bought nothing.
  #
  #   queueing       : --max-queued-requests 32 is the ONLY admission control
  #                    in the stack (the router's token bucket was removed —
  #                    see the router block). Without it the worker queue is
  #                    unbounded and overload turns into a silent wait until
  #                    --request-timeout-secs 900 fires. Bounded queue => fast
  #                    503 instead of a 15-minute stall.
  #
  #   mixed-chunk    : REMOVED 2026-07-28. It never took effect — boot log:
  #                    "Mixed chunked prefill is disabled because of using
  #                    eagle speculative decoding." Do not re-add while EAGLE
  #                    is on; it is silently ignored.
  # ---------------------------------------------------------------------------
  qwen36-27b-r0:
    <<: *replica-common
    container_name: qwen36-27b-r0

    # NUMA discipline: r0 owns node-0 cores; 48-55 stay reserved for
    # TEI + observability.
    cpuset: "0-27"

    expose:
      - "8001"

    volumes:
      - ${HF_HOME:-~/.cache/huggingface}:/root/.cache/huggingface
      # v0.5.18 moved every compiled-kernel cache (triton, inductor, flashinfer
      # JIT, deep_gemm, nv ComputeCache) under one dir, SGLANG_CACHE_DIR
      # (~/.cache/sglang). Before this, all of it lived in the container's
      # writable layer and was thrown away on every recreate. One volume per
      # replica — deliberately NOT shared, so a corrupt cache cannot take out
      # both. Does not orphan the image's AOT flashinfer-jit-cache: that ships
      # as a dist-packages PACKAGE, not a ~/.cache directory.
      - sglang_kernel_cache_r0:/root/.cache/sglang
      - ./logs/r0:/app/logs
      - /etc/localtime:/etc/localtime:ro

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]

    # NOTE: `command: >` is a FOLDED SCALAR — a `#` line inside it is literal
    # argv text, not a comment, and compose rejects the file. Keep annotations
    # out here, above the key.
    #
    # REJECTED 2026-07-28, STILL REJECTED 2026-08-08 for a DIFFERENT reason:
    # --enable-gdn-replayssm-spec (RFC #28511 Part B), renamed in v0.5.17 to
    # --enable-linear-replayssm-spec (#33102 generalised GDN -> linear).
    #
    # Original reason (v0.5.16): the build refused it outright —
    #   ValueError: --enable-gdn-replayssm-spec is not yet compatible with
    #   mamba extra_buffer (radix prefix caching); use --disable-radix-cache
    #   or --mamba-radix-cache-strategy no_buffer.
    # Taking it meant surrendering radix prefix caching, measured at 36x on this
    # workload (16K-token prompt: 12.278s cold TTFT -> 0.338s warm). Coding-agent
    # traffic shares a system prompt, so that cache is our single largest lever.
    #
    # That incompatibility is GONE — #32692 and #33102 made replayssm work with
    # extra_buffer.
    #
    # The 2026-08-08 note here then declined it a second time, on the grounds
    # that PR #32219's fused `_replay_metadata` fast path is gated on replayssm
    # being OFF. CORRECTED 2026-08-19: that reasoning conflated two flags.
    # It holds for --enable-linear-replayssm (the DECODE ring) and NOT for
    # --enable-linear-replayssm-spec. The fused path is guarded by
    # `replayssm_write_pos_list is None` (hybrid_linear_attn_backend.py:562),
    # populated from _replayssm_enabled() (:415), which reads ONLY the decode
    # flag (:390 -> mamba_pool.enable_linear_replayssm). Its docstring says the
    # decode-ring machinery "must stay fully dormant for the spec ring". So
    # spec-only keeps the fused replay path.
    #
    # The decode flag stays dead for us regardless: it requires
    # --mamba-radix-cache-strategy no_buffer and we run extra_buffer.
    #
    # --enable-linear-replayssm-spec was TESTED ON r1 AND REVERTED 2026-08-19.
    # Do not re-add it as a bare flag. Full data: tuning/docs/RESULTS.md entry
    # "2026-08-19 - ReplaySSM spec-verify"; retry recipe: TUNING_PLAN.md 5f.
    #
    # It worked mechanically and cost nothing in speed: intermediate_ssm_state_cache
    # 2.11 GB -> 0.00 GB, ring 0.431 GB (net -1.68 GB), throughput +0.5..+1.9%
    # across c=1..12 (all inside the 1.5% noise floor, r0 control did not drift),
    # accept length unchanged. That also settles the paragraph above by
    # measurement: the fused replay path was NOT lost.
    #
    # It was reverted because the freed memory does not become KV. The mamba
    # budget solver (kv_cache_configurator.py:1842) redirects the whole budget
    # into persistent slots once the intermediate factor is dropped: slots went
    # 43 -> 95 (we need 16 at --max-running-requests 4) and it took a further
    # 2 GB out of KV to buy them. max_total_num_tokens fell 171,008 -> 137,600,
    # BELOW the served --context-length 169000 — the same contract break Phase 1
    # hit at mem-fraction 0.90, and worse here because only one replica had it.
    #
    # The retry must pin --max-mamba-cache-size 43 alongside the flag so the
    # freed memory has nowhere to go but KV. Two standing cautions: fp32 SSM
    # dtype is NOT the fix for the drift warning (ssm_state 3.09 -> ~6.2 GB
    # costs more than the 2.11 GB freed), and this flag is not byte-identity
    # gated — the long-context drift gate was never exercised, because a
    # 200-token ladder does not reach it.
    #
    # --enable-session-radix-cache (added 2026-08-08, BOTH replicas).
    # Enabled deliberately WITHOUT a controlled A/B — it is inert today and
    # costs nothing, so it is on and ready rather than pending a test.
    #
    # What it does: makes UnifiedRadixCache order eviction by
    # (is_referenced, session_ref_count, base_priority), so KV belonging to a
    # live session is evicted last. Soft protection, not pinning — referenced
    # KV is still evictable if unreferenced KV runs out. Implemented ONLY by
    # UnifiedRadixCache, which is what we run (boot log: "Init Unified RadixTree
    # with components (FULL, MAMBA)").
    #
    # Why it is inert: it only does anything (a) under real eviction pressure,
    # and (b) when callers pass a stable top-level `session_id`. Neither holds.
    # The node has ~137 non-healthcheck requests ever, and OpenCode sends no
    # session_id (verified null across all 5,475 logged requests). The plumbing
    # exists on our side — `session_id` is carried by /v1/chat/completions
    # (serving_chat.py passes it straight through) and /close_session is a real
    # route taking {"session_id": str} — so a shim between Caddy and the router
    # could start sending it.
    #
    # NOTE it was NOT in the old build: the flag parsed, but the implementation
    # was absent (zero matches for session_ref_count / register_session_ref).
    # v0.5.17 ships mem_cache/unified_cache/session_ref_tracker.py.
    #
    # Blocked upstream of this flag: session affinity needs the router to send a
    # conversation to the SAME replica, and prefix_hash was tested and rejected
    # 2026-08-08 (see the router block). Under round_robin a conversation
    # alternates GPUs, so sessions fragment regardless of eviction order.
    #
    # --stream-response-default-include-usage (added 2026-08-15, BOTH replicas).
    #
    # "Include usage in every streaming response (even when stream_options is
    # not specified)" — server_args.py, default False.
    #
    # Why it is on: OpenAI's protocol omits `usage` from a streaming response
    # unless the CLIENT asks for it with stream_options.include_usage, and
    # coding-agent clients do not ask. Measured through the edge: a plain
    # streaming request produced zero usage chunks; the same request with
    # stream_options produced prompt_tokens=53 / completion_tokens=8. Any
    # gateway that meters or bills by token is therefore blind to streaming
    # traffic — which here is nearly all of it — unless it rewrites request
    # bodies. Flipping the server default fixes it once, for every client and
    # every proxy, instead of teaching each hop to inject the option.
    #
    # Cost: one extra SSE chunk per stream, carrying usage with an empty
    # `choices` array. That is the standard OpenAI shape for it, and clients
    # that ignore usage ignore an empty-choices chunk.
    #
    # This does NOT affect the engine's own trace spans: those carry token
    # counts regardless, because the scheduler knows them whether or not the
    # response says so.
    #
    # --mm-feature-transport cpu is PINNED DELIBERATELY (added 2026-08-08).
    # This model is Qwen3_5ForConditionalGeneration, so SGLang auto-enables the
    # multimodal path even though we only ever serve text. In v0.5.16 the
    # transport auto-resolved to `cpu`; v0.5.17 changed the auto-resolution to
    # `cuda_ipc` for single-node CUDA, which broke the server two ways:
    #   1. cuda_ipc moves feature tensors between the mm-processor process and
    #      the scheduler with pidfd_getfd(2), which needs CAP_SYS_PTRACE. We
    #      only grant SYS_NICE, so Docker's default profile denies it and the
    #      scheduler dies on the very first request -- its own warmup:
    #      "RuntimeError: pidfd_getfd: Operation not permitted".
    #   2. It reserves SGLANG_MM_FEATURE_CACHE_MB (1024 MiB default) of VRAM,
    #      shrinking the KV pool.
    # Pinning it explicitly restores v0.5.16 behaviour without granting a new
    # capability, and stops the value from flipping under us again. The
    # alternative fix (cap_add: SYS_PTRACE) buys a capability we do not need
    # for a code path we never use. Do not remove without re-reading this.
    #
    # Image input (added 2026-09-19, BOTH replicas). Consumers now send photos
    # and screenshots through OpenCode, so the "text only" assumption above no
    # longer holds.
    #
    # --image-processor-backend pil
    #   0.5.19 runs the fast image processor in the TOKENIZER process on the
    #   serving GPU (base_processor.py _fast_image_processor_device ->
    #   cuda:{base_gpu_id}). At --mem-fraction-static 0.94 that GPU sits at
    #   20-40 MiB free, so any large image died with "CUDA out of memory" in
    #   image_processing_qwen2_vl._preprocess -> 500 on both replicas -> the
    #   router's circuit breaker opened -> 503. pil is the only flag-level CPU
    #   route: every non-pil backend (torchvision included) is still sent to
    #   the GPU. Model input is identical to torchvision's (max 1 grey level
    #   on isolated pixels, mean 0). CPU cost: 100-300 ms per image at the cap
    #   below, paid once per image thanks to the preprocess cache.
    #
    # --mm-process-config '{"image":{"size":{...}}}'
    #   Caps every image at 2 MP (longest_edge = max pixels, 32x32 px per
    #   token). The model's own default is 16.7 MP: a 12 MP phone photo was
    #   11,844 tokens, a 5K screenshot 14,400. At the cap: ~2,030 tokens, and
    #   1080p screenshots are untouched. Fine print on large images is lost
    #   (text under ~20 px in a 12 MP photo); the client-side skill in
    #   docs/opencode-skills/image-batches/ crops regions at full resolution
    #   instead. TRAP: {"max_pixels": N} is accepted and SILENTLY IGNORED by
    #   transformers 5.12 -- token counts do not change. Only `size` works.
    #
    # --mm-preprocess-cache-size-mb 2048 (was 512)
    #   pixel_values are fp32, ~47 MiB per 2 MP image, so 512 held ~10 images.
    #   OpenCode resends every image in the history on every turn. Host RAM
    #   only.
    #
    # --limit-mm-data-per-request '{"image":16}'
    #   16 capped images ~ 33k tokens. Above it, the tokenizer refuses the
    #   request with "Image count N exceeds limit 16 per request" before any
    #   image is decoded.
    #
    # Caddy's gateway-site body cap was raised to 4MB alongside this.
    #
    # --mm-processor-worker-num 4 (2026-09-19; the Qwen auto value is 2)
    #   Threads that resize/normalize images, one request each; a request's
    #   images still run one after another. Measured offline with this image's
    #   Qwen2VLImageProcessorPil at the 2 MP cap: 1 -> 2 -> 4 threads =
    #   2.7 -> 5.5 -> 8.9 images/s (12 MP photos), 13.5 -> 25.9 -> 49.3
    #   (1280 px, OpenCode). 4 matches --max-running-requests; the cpuset has
    #   ~19-27 idle cores. Decoding is a separate pool (16 threads, auto).
    #
    # --tokenizer-metrics-allowed-custom-labels consumer (added 2026-09-05,
    # BOTH replicas).
    #
    # Puts the gateway's consumer name on every tokenizer-side metric, which is
    # the only way to answer "what is acme's p95 TTFT". Prometheus was blind to
    # identity before this: all 98 sglang:* families carried engine_type /
    # instance / is_streaming / model / node and nothing about who asked.
    #
    # How it works (serving_base.py::extract_custom_labels, v0.5.19):
    # the request handler reads the header named by
    # --tokenizer-metrics-custom-labels-header (default x-custom-labels),
    # parses it as a JSON object, and keeps ONLY the keys listed here. The
    # values ride on ReqState and are merged into the metric labels in
    # tokenizer_manager.collect_metrics. tokenizer_manager also seeds `consumer`
    # as an empty-string label at startup, so an unlabelled request still lands
    # in a well-formed series (consumer="") rather than a new one.
    #
    # The header is injected by Higress, not by the client:
    #   higress.io/request-header-control-update on ai-chat / ai-completions
    #   x-request-id-labels {"consumer":"%REQ(X-MSE-CONSUMER)%"}
    # Higress renders that annotation into Envoy's request_headers_to_add with
    # OVERWRITE_IF_EXISTS_OR_ADD, which is what makes this safe: a client that
    # sends its own copy has it REPLACED, so the label value can only ever be a
    # consumer the gateway itself authenticated. Without that overwrite the flag
    # would be a cardinality bomb — the allow-list filters label NAMES, never
    # values.
    #
    # --tokenizer-metrics-custom-labels-header IS NOT COSMETIC. Its default is
    # `x-custom-labels`, and that header NEVER ARRIVES: sgl-model-gateway
    # forwards a hardcoded ALLOW-LIST of request headers to workers on the
    # typed-request path that /v1/chat/completions takes —
    # `authorization`, `x-request-id`, `x-correlation-id`, `traceparent`,
    # `tracestate`, `x-smg-routing-key`, and anything prefixed
    # `x-request-id-` (routers/header_utils.rs::should_forward_request_header,
    # which has a unit test asserting exactly that). Everything else is
    # dropped, silently — measured here 2026-09-05: with the default header
    # name, a request carrying it straight to a replica labelled correctly and
    # the same request through the router did not.
    #
    # `x-request-id-labels` rides the one prefix on that list. The router's
    # request-id middleware matches --request-id-headers by EXACT name, so it
    # does not mistake this for a request id.
    #
    # Do NOT read routers/header_utils.rs::apply_request_headers and conclude
    # headers pass through. That function is permissive, and this path does not
    # use it.
    #
    # Known gap, upstream: observe_one_aborted_request does not take custom
    # labels ("TODO: also use custom_labels from the request",
    # tokenizer_manager.py), so aborted requests are still counted globally.
    command: >
      --model-path Qwen/Qwen3.8-27B
      --served-model-name qwen36-27b
      --default-chat-template-kwargs '{"reasoning_effort":"xhigh","preserve_thinking":false}'
      --host 0.0.0.0
      --port 8001
      --mm-preprocess-cache-size-mb 2048
      --image-processor-backend pil
      --mm-process-config '{"image":{"size":{"longest_edge":2097152,"shortest_edge":65536}}}'
      --limit-mm-data-per-request '{"image":16}'
      --mm-processor-worker-num 4
      --trust-remote-code
      --dtype bfloat16
      --tp 1
      --context-length 169000
      --mem-fraction-static 0.94
      --tokenizer-worker-num 1
      --attention-backend flashinfer
      --mm-feature-transport cpu
      --enable-session-radix-cache
      --enable-hierarchical-cache
      --hicache-ratio 8
      --max-mamba-cache-size 43
      --mamba-radix-cache-strategy extra_buffer
      --mamba-ssm-dtype bfloat16
      --mamba-track-interval 64
      --page-size 64
      --chunked-prefill-size 4096
      --prefill-decode-interval 1
      --max-prefill-tokens 4096
      --max-running-requests 4
      --max-queued-requests 32
      --cuda-graph-max-bs-decode 4
      --cuda-graph-max-bs-prefill 2048
      --schedule-policy hrrn
      --reasoning-parser qwen3
      --tool-call-parser qwen3_coder
      --grammar-backend xgrammar
      --enable-fused-qk-norm-rope
      --enable-metrics
      --enable-mfu-metrics
      --enable-cache-report
      --tokenizer-metrics-allowed-custom-labels consumer
      --tokenizer-metrics-custom-labels-header x-request-id-labels
      --stream-response-default-include-usage
      --enable-forward-pass-metrics
      --log-requests
      --log-requests-level 1
      --export-metrics-to-file
      --export-metrics-to-file-dir /app/logs/request-metrics
      --speculative-algorithm DFLASH
      --speculative-draft-model-path incoai/Qwen3.8-27B-DFlash2
      --speculative-draft-model-revision dedf8df68adfb1afeaf7b7480c0a0243108177b4
      --speculative-num-draft-tokens 8
      --speculative-draft-kv-cache-dtype fp8_e4m3
      --watchdog-timeout 1200
      --api-key ${SGLANG_API_KEY}

    healthcheck:
      # /health is a GENERATION probe, not a liveness check — parameters
      # are deliberately loose so a worker mid-prefill does not flap.
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 60s
      timeout: 15s
      retries: 10
      start_period: 2400s

  # ---------------------------------------------------------------------------
  # Replica 1 — physical GPU 1, NUMA node 1 cores
  # Internal endpoint: http://qwen36-27b-r1:8002
  # Starts after r0 so one container populates the shared HF cache.
  # ---------------------------------------------------------------------------
  # PHASE 2 (EAGLE depth) APPLIED TO BOTH REPLICAS 2026-08-01:
  # --speculative-num-steps 5 / --speculative-num-draft-tokens 6 (chain rule
  # draft = steps + 1 at topk 1; was 3/4, the docs' OOM-recovery recipe).
  # Measured on r1 vs ladder_r1_qknorm_post.json (mean of 2 passes):
  #   accept_length 3.2 -> 3.9-4.1; single-stream 69.4 -> 76.8 tok/s (+10.6%);
  #   c=2 +7%, c=4 +7.5%, c=8/12 throughput-neutral but p50 improved
  #   (6.22 -> 5.66-5.90 s at c=8). Deeper drafts pay at low concurrency and
  #   cost nothing at saturation on this workload.
  # Boot-state deltas at 6/5 (BOTH replicas, verified in boot log):
  #   max_total_num_tokens 169792 -> 171008 (pool GREW; mamba pool rebalanced
  #   54 -> 43 slots, intermediate SSM verify cache 1.41 -> 2.11 GB).
  # NOTE the greedy probe is NOT byte-identical across spec depths (one
  # near-tie token flips at char 498; runs are deterministic within a config).
  # Expected: draft depth changes verify GEMM shapes -> ulp-level logit
  # differences. Byte-identity remains the gate only for same-shape changes.
  #
  # --enable-fused-qk-norm-rope ADDED TO BOTH REPLICAS 2026-07-31c. A/B on r1:
  # greedy output byte-identical (sha256 match on reasoning+content), boot
  # gates unchanged (pool 169792, decode bs [1,2,3,4]), ladder delta within
  # clock noise — the S1 profile caps its upside at ~1-2% (elementwise bucket;
  # the GDN path already runs its own fused norm/gate kernel). Kept because it
  # is numerics-preserving here and reduces launches. tuning/docs/RESULTS.md.
  qwen36-27b-r1:
    <<: *replica-common
    container_name: qwen36-27b-r1

    cpuset: "28-47"

    # NO depends_on — REMOVED 2026-07-28. r0 and r1 are interchangeable peers,
    # not layers. `depends_on: qwen36-27b-r0: condition: service_healthy` used
    # to live here and was a single point of failure:
    #
    #   - r1 could not START while r0 was unhealthy, so losing r0 left ZERO
    #     serving replicas instead of one — the opposite of what two are for.
    #   - `docker compose up -d qwen36-27b-r1` silently pulled r0 in and
    #     recreated BOTH at once (double outage, 2026-07-28), then serialised
    #     the boots, turning a ~9 min roll into ~18 min.
    #
    # It also bought less than it looked like: depends_on only orders `up`, and
    # `restart: unless-stopped` bypasses it entirely on a host reboot — so the
    # ordering evaporated exactly when it would have mattered.
    #
    # Parallel boot is safe: separate GPUs, and HiCache pins ~52 GB of host RAM
    # per replica against ~800 GB free. (The old note here read "831 GB free against 128 GB of
    # --hicache-size per replica" and was wrong by ~2x anyway: --hicache-size
    # sizes the KV tier ONLY. The Mamba tier (128.02 GB) and draft tier (8 GB)
    # were allocated on top, for 264 GB per replica, not 128.)
    #
    # STILL roll one replica at a time, so the other keeps serving:
    #     docker compose up -d --no-deps qwen36-27b-r1
    #     # wait for healthy (~9 min), then
    #     docker compose up -d --no-deps qwen36-27b-r0
    #     docker compose restart qwen36-27b-router   # see router block
    # Keep --no-deps: it is still what stops a shared-anchor config change
    # (e.g. the image digest) from recreating both replicas at once.
    # NEVER pass --remove-orphans here: it would DELETE qwen3-emb, grafana,
    # prometheus and dcgm, which are not part of this compose project.

    expose:
      - "8002"

    volumes:
      - ${HF_HOME:-~/.cache/huggingface}:/root/.cache/huggingface
      # v0.5.18 moved every compiled-kernel cache (triton, inductor, flashinfer
      # JIT, deep_gemm, nv ComputeCache) under one dir, SGLANG_CACHE_DIR
      # (~/.cache/sglang). Before this, all of it lived in the container's
      # writable layer and was thrown away on every recreate. One volume per
      # replica — deliberately NOT shared, so a corrupt cache cannot take out
      # both. Does not orphan the image's AOT flashinfer-jit-cache: that ships
      # as a dist-packages PACKAGE, not a ~/.cache directory.
      - sglang_kernel_cache_r1:/root/.cache/sglang
      - ./logs/r1:/app/logs
      - /etc/localtime:/etc/localtime:ro

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["1"]
              capabilities: [gpu]

    command: >
      --model-path Qwen/Qwen3.8-27B
      --served-model-name qwen36-27b
      --default-chat-template-kwargs '{"reasoning_effort":"xhigh","preserve_thinking":false}'
      --host 0.0.0.0
      --port 8002
      --mm-preprocess-cache-size-mb 2048
      --image-processor-backend pil
      --mm-process-config '{"image":{"size":{"longest_edge":2097152,"shortest_edge":65536}}}'
      --limit-mm-data-per-request '{"image":16}'
      --mm-processor-worker-num 4
      --trust-remote-code
      --dtype bfloat16
      --tp 1
      --context-length 169000
      --mem-fraction-static 0.94
      --tokenizer-worker-num 1
      --attention-backend flashinfer
      --mm-feature-transport cpu
      --enable-session-radix-cache
      --enable-hierarchical-cache
      --hicache-ratio 8
      --max-mamba-cache-size 43
      --mamba-radix-cache-strategy extra_buffer
      --mamba-ssm-dtype bfloat16
      --mamba-track-interval 64
      --page-size 64
      --chunked-prefill-size 4096
      --prefill-decode-interval 1
      --max-prefill-tokens 4096
      --max-running-requests 4
      --max-queued-requests 32
      --cuda-graph-max-bs-decode 4
      --cuda-graph-max-bs-prefill 2048
      --schedule-policy hrrn
      --reasoning-parser qwen3
      --tool-call-parser qwen3_coder
      --grammar-backend xgrammar
      --enable-fused-qk-norm-rope
      --enable-metrics
      --enable-mfu-metrics
      --enable-cache-report
      --tokenizer-metrics-allowed-custom-labels consumer
      --tokenizer-metrics-custom-labels-header x-request-id-labels
      --stream-response-default-include-usage
      --enable-forward-pass-metrics
      --log-requests
      --log-requests-level 1
      --export-metrics-to-file
      --export-metrics-to-file-dir /app/logs/request-metrics
      --speculative-algorithm DFLASH
      --speculative-draft-model-path incoai/Qwen3.8-27B-DFlash2
      --speculative-draft-model-revision dedf8df68adfb1afeaf7b7480c0a0243108177b4
      --speculative-num-draft-tokens 8
      --speculative-draft-kv-cache-dtype fp8_e4m3
      --watchdog-timeout 1200
      --api-key ${SGLANG_API_KEY}

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 60s
      timeout: 15s
      retries: 10
      start_period: 2400s

  # ---------------------------------------------------------------------------
  # Router — sole bridge between edge and backend
  # Internal URL: http://qwen36-27b-router:8000
  # Prometheus:   http://qwen36-27b-router:29000 (scraped by overlay)
  #
  # Policy rationale (2026-07-28, measured — see benchmarks/results/):
  #   `cache_aware` was starving r0 completely: 8/8 sequential requests with
  #   fully DISJOINT prefixes all routed to r1, r0_delta=0 every time, while
  #   both workers reported load=0 and is_healthy=true. GPU0 sat at 0% util
  #   during load. Two compounding causes:
  #     1. balance_abs_threshold defaults to 64, but with
  #        --max-running-requests 1 the load delta between workers can never
  #        exceed 1 — the rebalance escape hatch is mathematically unreachable.
  #     2. With one shared system prompt (coding-agent traffic), affinity
  #        routing WANTS to pile the whole team onto whichever replica warmed
  #        first. Cache-affinity is built for many prefixes across many
  #        workers; here it is one prefix across two.
  #   power_of_two on 2 workers == pick-the-less-loaded, so long requests do
  #   not get a second one stacked on them. The shared system prompt caches on
  #   BOTH replicas after first use, so prefix-cache benefit is retained.
  #
  # Rate-limit rationale: --max-concurrent-requests is NOT a concurrency cap.
  #   Per `launch_router --help` it is a TOKEN BUCKET whose refill rate
  #   defaults to the same number, i.e. `2` meant "2 requests per SECOND,
  #   service-wide". Bursts died with 408 + router log
  #   "Queue: request timed out waiting for token". Default is -1 (disabled);
  #   omitted here so backpressure comes from worker queues, not an
  #   arbitrary bucket. Revisit if unbounded queueing shows up under real load.
  # ---------------------------------------------------------------------------
  # Rolling a replica: use ./deploy/roll-replica.sh <r0|r1>. Do NOT
  # `docker compose restart qwen36-27b-router` afterwards — that step is
  # obsolete (measured 2026-07-31b). The router tracks workers by URL and
  # re-adds a returning worker on its own, so the restart was never required;
  # worse, it drops in-flight requests on BOTH replicas. What the restart also
  # never fixed is that a naive roll leaves the router sending traffic to a
  # DEAD worker for ~159 s (health-check-interval 60 s x failure-threshold 3),
  # then wastes ~71 s before re-adding it (interval x success-threshold 2).
  # The script removes both windows via the router's REST API:
  #   GET /workers  |  DELETE /workers/<id>  |  POST /workers {"url": ...}
  #
  # --health-check-interval-secs is left at the 60 s default ON PURPOSE: the
  # worker /health endpoint is a GENERATION probe costing ~1.0 s per call, so
  # tightening it to shrink the lag would spend real GPU time. Draining makes
  # the lag irrelevant instead.
  #
  # REJECTED 2026-08-08: --policy prefix_hash. The motivation was real —
  # round_robin caps prefix-cache reuse at ~50% because two TP=1 replicas share
  # no cache, measured here as 48.2% cache hit rate on 12 requests sharing a
  # ~1200-token system prompt. prefix_hash routes on a hash of the first 256
  # TOKENS, which should pin a conversation to one replica.
  #
  # It does not work on this deployment. Two separate failures:
  #   1. The router must TOKENIZE to hash 256 tokens, and ours had no
  #      tokenizer: "No tokenizer_path or model_path found for model unknown".
  #      Fixable with --model-path + the HF cache mount + HF_TOKEN.
  #   2. Even with the tokenizer loaded, every request 503s with
  #      no_available_workers ("all circuits open or unhealthy") while
  #      GET /workers reports both replicas is_healthy=true. Workers register
  #      as model_id "unknown" (the router cannot infer the served model), and
  #      prefix_hash assigns its policy per model — so requests naming
  #      "qwen36-27b" match no worker.
  # Isolated: round_robin WITH --model-path serves 200s normally, so the
  # tokenizer addition is not the culprit — the policy is.
  # Re-test only after workers register a real model_id; until then this is
  # upstream's problem, not a tuning knob. See tuning/docs/UPGRADE_v0.5.17.md.
  qwen36-27b-router:
    image: *sglang-image
    container_name: qwen36-27b-router

    # Pinned to the edge partition like everything else that is not a replica.
    #
    # This was the ONE unpinned container on the host — cpuset "" — which meant
    # the scheduler was free to place it on 0-27 or 28-47, the cores r0 and r1
    # own. Those replicas are latency-critical and the compose header states
    # nothing may compete with them, so an unpinned process in the middle of the
    # paid request path contradicted the whole partitioning scheme.
    #
    # 48-55 is right for it: the router does prefix hashing and proxying, not
    # inference, and its steady-state footprint is ~69 MiB.
    cpuset: "48-55"

    expose:
      - "8000"
      - "29000"

    stop_grace_period: 30s

    environment:
      - PYTHONUNBUFFERED=1

    entrypoint: python3 -m sglang_router.launch_router

    # NOTE: `command:` below is a folded scalar — every line becomes an
    # argument. Never put a # comment inside it.
    #
    # --control-plane-api-keys (added 2026-09-02) closes the router's admin
    # API. Until then `GET /workers` answered 200 to anything on the `edge`
    # network and `POST /workers` would have registered an arbitrary backend.
    # Format is id:name:role:key with role admin|user; no spaces, because the
    # folded scalar splits on whitespace.
    #
    # This does NOT touch the inference path. --api-key would have: despite
    # the docs page calling it client auth, `--help` on this build says it is
    # "the api key used for the authorization with the worker", i.e. an
    # outbound credential. Client auth stays where it already is — the workers
    # enforce SGLANG_API_KEY, which Caddy (and now Higress) set on the way in.
    # Verified on a throwaway router before this was applied: control plane
    # 401 without the key / 200 with it, while /health, /v1/models and
    # /v1/chat/completions all stayed 200 on the normal credential.
    #
    # --request-id-headers makes the router accept the gateway's x-request-id
    # and echo it back to the client. (It was also the Langfuse join key until
    # tracing was removed on 2026-09-14; gateway and engine rows now join on
    # the response id, gateway chat_id = engine rid.)
    #
    # ADMISSION CONTROL (added 2026-09-04): --max-concurrent-requests,
    # --queue-size, --queue-timeout-secs.
    #
    # All three were unset, and --max-concurrent-requests defaults to -1 —
    # unlimited. The router accepted any amount of concurrency and handed it
    # straight to the workers, which are capped at --max-running-requests 4
    # each. So a burst never failed anywhere: it queued inside the engines,
    # where the only symptom is TTFT climbing for every tenant at once and
    # nothing ever reporting "full".
    #
    #   16  = 2x the engine's real capacity (2 replicas x 4 running). Enough
    #         in flight to keep both replicas and their prefill batches
    #         saturated, without an unbounded backlog forming ahead of them.
    #   64  = bounded queue, so a short burst waits instead of 429ing, but the
    #         backlog itself cannot become the outage.
    #   300 = queue timeout, NOT the 60s default. Requests here legitimately
    #         run tens of seconds (a measured 36k-token prompt takes ~35s), so
    #         60s would reject work that was going to succeed. Still far inside
    #         --request-timeout-secs 900, so the queue gives up long before the
    #         request does.
    #
    # POISON-PILL CONTAINMENT (added 2026-09-21, after the 2026-09-20 incident —
    # docs/INCIDENT-2026-09-20-IMAGE-TOKEN-CASCADE.md). All three were previously
    # unset and running on build defaults.
    #
    # The failure that forced this: one malformed multimodal prompt 500s
    # IDENTICALLY on every replica. The breaker assumes a failure means the
    # WORKER is sick, so it walked the fleet and marked both replicas broken.
    # Blast radius is set by how many failure credits a client can spend:
    #
    #     cb-failure-threshold / attempts-per-request = requests to kill a worker
    #
    #   --retry-max-retries 1
    #         Was the default 5, i.e. 5 attempts per client request, so TWO bad
    #         requests opened a worker and four took the fleet. At 1 attempt it
    #         takes ten. Costs nothing measurable: over the router's first 46 h
    #         and 939 chat requests, all 44 retries it ever performed were this
    #         incident and every one failed — a 0% success rate. Router and
    #         workers share a host bridge (no network to be flaky) and
    #         roll-replica.sh de-registers before a restart, so the transient
    #         failures retries exist for barely occur here. OpenCode also
    #         retries, so this layer was the redundant one.
    #
    #   --cb-failure-threshold 10
    #         Unchanged in value, now PINNED. The docs site and `--help`
    #         disagree on this default (5 vs 10), so it must not be left
    #         implicit. Kept rather than raised because the breaker still earns
    #         its place: the worker /health probe is a 1-token generation with
    #         no image, so it is blind to image-preprocess faults, long-context
    #         faults and host-side exhaustion on ONE replica. Without a breaker
    #         such a worker is never evicted and silently eats half of traffic.
    #
    #   --cb-success-threshold 1
    #         Was 3. This is the recovery deadlock, not the outage: after the
    #         incident r0 sat in half_open for >10 h because closing needs
    #         consecutive successes while cache_aware keeps routing to the WARM
    #         replica, so r0 was never probed. One success now closes it.
    #
    # NOT changed, deliberately: --disable-circuit-breaker. It looks tempting
    # and is a bad trade — it swaps a bounded, loud, self-recovering failure
    # (fleet 503) for an unbounded silent one (a zombie replica serving errors
    # forever). Retries do not cover for it either: under cache_aware they
    # re-select the same worker, proven by the 16 s gap between the two breaker
    # opens on 2026-09-20.
    #
    # This is blast-radius containment, NOT a fix. The root cause is SGLang
    # returning 500 for what is a client error; a 4xx is never retried and never
    # reaches the breaker. See the doc for the upstream issue to track.
    #
    # NOTE the flags below carry no inline comments on purpose: `command: >` is
    # a YAML folded scalar, where a `#` is literal text rather than a comment
    # and compose rejects the result as an invalid command line.
    command: >
      --host 0.0.0.0
      --port 8000
      --policy cache_aware
      --balance-abs-threshold 1
      --worker-urls http://qwen36-27b-r0:8001 http://qwen36-27b-r1:8002
      --request-timeout-secs 900
      --max-concurrent-requests 16
      --queue-size 64
      --queue-timeout-secs 300
      --retry-max-retries 1
      --cb-failure-threshold 10
      --cb-success-threshold 1
      --prometheus-host 0.0.0.0
      --prometheus-port 29000
      --request-id-headers x-request-id x-trace-id x-correlation-id
      --control-plane-api-keys ops:ops:admin:${ROUTER_CONTROL_PLANE_KEY:?set ROUTER_CONTROL_PLANE_KEY in .env}
      --control-plane-audit-enabled

    depends_on:
      qwen36-27b-r0:
        condition: service_healthy
      qwen36-27b-r1:
        condition: service_healthy

    # Required for Caddy's service_healthy condition below. Short
    # start_period: the router only starts once both workers are healthy.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    restart: unless-stopped

    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

    networks:
      - qwen36-27b-backend   # reach workers
      - edge                 # be reachable from Caddy

  # ---------------------------------------------------------------------------
  # Caddy — TLS termination, edge auth (no request-body cap since 2026-08-15)
  # The ONLY service publishing host ports. Edge network only: it can reach
  # the router (and qwen3-emb from the embedding project), never a worker.
  # ---------------------------------------------------------------------------
  caddy:
    # Pinned 2026-09-04. `caddy:2-alpine` floated: it happened to resolve to
    # the current 2.11.4, but nothing guaranteed that, and the edge is the one
    # container whose surprise restart takes every hostname down at once.
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648

    cpuset: "48-55"

    ports:
      - "443:443"
      - "80:80"

    # Metrics site from the Caddyfile. NOT in `ports:` — it stays on the edge
    # docker network, where Prometheus scrapes it. Publishing it would put an
    # unauthenticated endpoint on the host's public interface.
    expose:
      - "2020"

    stop_grace_period: 30s

    environment:
      - EDGE_API_KEY=${EDGE_API_KEY:?set EDGE_API_KEY in .env}
      - SGLANG_API_KEY=${SGLANG_API_KEY:?set SGLANG_API_KEY in .env}
      # Webhook path for the quota-bot site. Kept out of git — see Caddyfile.
      - QUOTA_BOT_WEBHOOK_PATH=${QUOTA_BOT_WEBHOOK_PATH:?set QUOTA_BOT_WEBHOOK_PATH in .env}
      # Retired path, honoured only while the relay is being switched over.
      - QUOTA_BOT_WEBHOOK_PATH_OLD=${QUOTA_BOT_WEBHOOK_PATH_OLD:-}
      # Site addresses and ACME contact. Out of the committed Caddyfile since
      # 2026-09-18 (public repo): the config describes the edge's shape, .env
      # says which names it answers to. `:?` so a missing value stops compose
      # here rather than letting Caddy come up with an empty site address.
      - EDGE_HOST_MODEL=${EDGE_HOST_MODEL:?set EDGE_HOST_MODEL in .env}
      - EDGE_HOST_EMBED=${EDGE_HOST_EMBED:?set EDGE_HOST_EMBED in .env}
      - EDGE_HOST_BOT=${EDGE_HOST_BOT:?set EDGE_HOST_BOT in .env}
      - EDGE_HOST_GATEWAY=${EDGE_HOST_GATEWAY:?set EDGE_HOST_GATEWAY in .env}
      - EDGE_HOST_GRAFANA=${EDGE_HOST_GRAFANA:?set EDGE_HOST_GRAFANA in .env}
      - EDGE_HOST_MCP=${EDGE_HOST_MCP:?set EDGE_HOST_MCP in .env}
      - ACME_CONTACT=${ACME_CONTACT:?set ACME_CONTACT in .env}

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Gitignored allowlists the Caddyfile imports (caddy/allowlists.caddy.example).
      # A directory, so editing the file reaches the container.
      - ./caddy/private:/etc/caddy/private:ro
      - caddy_data:/data
      - caddy_config:/config

    # service_healthy (not bare depends_on): Caddy must not serve 502s
    # during the ~40-minute cold warm-up window.
    depends_on:
      qwen36-27b-router:
        condition: service_healthy

    restart: unless-stopped

    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

    networks:
      - edge

networks:
  # Shared edge network — created ONCE outside any compose project:
  #   docker network create edge
  # Members: this Caddy, this router, and the TEI container from the
  # embedding project (so `qwen3-emb` resolves for Caddy).
  edge:
    name: edge
    external: true

  # Project-owned backend — workers + router (+ metrics overlay) only.
  qwen36-27b-backend:
    name: qwen36-27b-backend
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  sglang_kernel_cache_r0:
  sglang_kernel_cache_r1:
