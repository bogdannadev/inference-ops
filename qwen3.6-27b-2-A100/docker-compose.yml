# =============================================================================
# QWEN3.8-27B BF16 — SGLANG PATTERN A
# 2× TP=1 replicas + cache-aware router + DFlash2 speculative decoding
# + HiCache (host-RAM KV tier) + Caddy edge gateway + segmented networks
#
# NAMES ARE DELIBERATELY STALE. Containers, networks, the router, the Caddy
# upstream and --served-model-name all still read `qwen36-27b` after the
# 2026-08-15 move to Qwen3.8-27B. That is a choice, not an oversight: the name
# has 194 references across compose, Caddyfile, grafana/, prometheus/ and
# benchmarks/, and renaming the services makes a replica-by-replica roll
# impossible (worker-urls and network aliases would have to change under a
# live router). Clients keep asking for model "qwen36-27b" and nothing at the
# edge moved. Rename later as its own coordinated change, if ever.
# `--model-path` is the only thing that identifies the weights now — read it,
# not the container name, when you need to know what is loaded.
#
# Host:
#   2× A100 80GB PCIe (P2P: NS — hence two TP=1 replicas, no TP=2)
#   AMD EPYC 7663, NPS2, SMT off: cores 0-27 NUMA0, 28-55 NUMA1
#   1 TB RAM (HiCache host tier)
#
# Design:
#   - Two independent TP=1 replicas, one per GPU, no inter-GPU comms
#   - Router: cache-aware routing (prefix locality per worker)
#   - Networks: `edge` (external, shared) carries Caddy <-> router;
#     `qwen36-27b-backend` (project-owned) carries router <-> workers.
#     Caddy cannot reach worker ports / ZMQ sockets (CVE-2026-3059/3060
#     lateral-movement hardening).
#   - Only Caddy publishes host ports (80/443)
#
# HiCache + DFlash2 — APPLIED 2026-09-13. Full record, measurements and the
# memory walk that produced these numbers: tuning/docs/HICACHE_DFLASH2.md
#
#   --enable-hierarchical-cache --hicache-ratio 3 (8 since 2026-09-19, below)
#       Host-RAM tier for the radix cache (KV + Mamba states), 3x the device
#       pool, ~52 GB pinned per replica (KV 35.9 + Mamba 10.2 + draft KV 5.6).
#       Re-enabled because the workload
#       changed: long agent sessions (50-140K tokens) interleave and evict each
#       other from the 169K device pool, then recompute on their next turn.
#       Replay of production requests: recomputed prompt tokens 4.0M -> 2.0M
#       per day. Probe: a 45K prompt evicted from the device reloads in
#       1.1-1.8 s instead of a 14.2 s recompute. The July removal (0.43% host
#       hits) was a different workload: one hot system prompt, no eviction.
#       BOOT CHECK: "Tree cache initialized ... hicache_attached=True".
#
#   --speculative-algorithm DFLASH, draft incoai/Qwen3.8-27B-DFlash2 (pinned
#   revision), --speculative-num-draft-tokens 8 (the draft's block size)
#       Replaces EAGLE/MTP 5-step. One 5-layer draft pass per step instead of
#       five MTP passes each streaming the 2.5 GB lm_head. On r1 vs MTP:
#       +38% single-stream, +39% c=4 short, +27% / +43% at ~55K context c=1 /
#       c=4. Correctness gate (thinking on, concurrency 4, objective answers,
#       cross-request leak detection) identical to MTP. Upstream #36548 /
#       #38009 were the reason for that gate; re-run tuning/bench/spec_eval.py
#       on any engine bump.
#
#   The draft costs activation headroom, so three memory flags moved with it:
#   --speculative-draft-kv-cache-dtype fp8_e4m3
#       The draft KV pool is sized to the full target pool and allocated from
#       headroom, not the static budget (2.74 GB at bf16). fp8 halves it. It
#       cannot change output: the target verifies every token.
#   --mem-fraction-static 0.94 (was 0.92)
#       At 0.92 the target pool fell to 143,872 tokens, below --context-length
#       169000; 27 production requests since 2026-09-04 exceeded 143K.
#       0.94 gives 182,528 tokens and 43 Mamba slots (same as before).
#   --chunked-prefill-size / --max-prefill-tokens 4096 (was 16384)
#       The first DFlash2 boot OOM'd in GDN prefill on its first 45K prompt.
#       4096-token chunks fit; cold 45K TTFT unchanged (14.2 s both).
#       Stress: 160K cold prompt + 3x30K decoding, twice, no OOM.
#   BOOT CHECK: max_total_num_tokens >= 169000 (expect 182528).
#
#   2026-09-19 evening — cache retention and stream freeze
#   (tuning/docs/TRIAL_V0520_LEVERS.md, measured on drained r1):
#   --max-mamba-cache-size 43 (pinned; the ratio default gave the same)
#       A prefix hit needs a GDN state at the match point, and that tier (not
#       KV) is what runs out: a 41K agent context holds several state slots
#       (one checkpoint per prefill chunk). 24 slots kept 2 such contexts per
#       replica, 43 keep 4. KV in use: 7-day p99 116-131K of 182,528.
#   --hicache-ratio 8 (was 3)
#       Host GDN states = slots x ratio (129 -> 344). Replay with 120 other
#       requests between an agent's turns: hit ratio 0.16 -> 0.98, 0.7 s per
#       45K turn instead of ~13 s. ~138 GB pinned host RAM per replica (KV 95.7
#       + GDN 27.1 + draft 15.0); boot ~250 s (was ~180 s).
#   --prefill-decode-interval 1
#       One decode round after every prefill chunk. Without it the scheduler
#       runs a long prefill to completion and every other stream on the
#       replica freezes for its duration (67.8 s at 128K); with it the longest
#       gap is 2.6 s, prefill +1.9%.
#   Tried and rejected the same day: fp8 KV (+11-20% cold prefill on SM80,
#   capacity that was not binding; live 16:05-~21:00), chunk 2048 (halves
#   contexts kept), chunk 8192 (freeze 2.6 -> 5.0 s, no capacity gain), SLRU
#   (GDN tier is always LRU), mem 0.93, extra_buffer_lazy.
#   --schedule-policy hrrn (was lpm), operator decision. v0.5.20 #32911:
#       highest response ratio next, aged by prefill tokens processed.
#       Not A/B tested here (7-day queue contention was ~10 min in total).
#
#   ROLLBACK: restore the four EAGLE flags (algorithm EAGLE, num-draft-tokens
#   6, num-steps 5, eagle-topk 1), mem-fraction 0.92, chunked/max prefill 16384;
#   HiCache backs out by deleting its two flags. Roll one replica at a time.
#
# Per-request usage records — APPLIED 2026-09-14.
#   --export-metrics-to-file --export-metrics-to-file-dir /app/logs/request-metrics
#       One JSON line per finished request (hourly files under logs/<replica>/
#       request-metrics/): tokens, cached tokens split GPU/host, timings, finish
#       reason and the consumer label. Vector ships them to ClickHouse
#       engine.requests, which is the EXACT usage record behind every number the
#       bot shows a customer. Prometheus counters are only approximations of it:
#       a consumer's series is created by its first request after a replica
#       start, so increase() loses that request, and increase() extrapolates at
#       window edges (measured 2026-09-13: 11,194 reported for 29,079 real).
#       Prompt text is NOT written: --log-requests-level 1 skips text/input_ids.
#
# HiCache history: REMOVED 2026-07-31 after serving 0.43% of hits for 253 GiB
# RSS per replica (--hicache-size 128 applied per pool, a sizing footgun that
# --hicache-ratio no longer has).
#
# Phase 1 tuning — APPLIED TO BOTH REPLICAS 2026-07-31.
#
#   The A/B that produced this configuration is finished. r0 and r1 are
#   byte-identical again apart from port / GPU / cpuset; that rule is back in
#   force. Full measurements: tuning/docs/RESULTS.md.
#
#   What changed, and why each part is here:
#
#   --max-running-requests 4 (was 2), --cuda-graph-max-bs-decode 4 (was 2)
#       The pair's admission cap was 4, so every concurrency above 4 ran as
#       WAVES of 4 — wall(n) tracked ceil(n/4) x wall(4) and aggregate sat flat
#       at ~250 tok/s from c=2 to c=12. It was never GPU saturation.
#       Measured effect, r1 direct (no router), mean of 2 passes:
#         c=4  128.78 -> 231.81 tok/s  (1.80x)
#         c=8  126.08 -> 241.08 tok/s  (1.91x)
#         c=12 124.25 -> 233.85 tok/s  (1.88x)
#       c=1 and c=2 unchanged, as they must be — they sit below the old cap.
#       The graph flag MUST move with the request cap; it clamps to it, and
#       leaving it at 2 silently caps the benefit.
#
#   HiCache removed (5 flags)
#       Served 0.43% of cache hits for 253 GiB RSS per replica and ~4 min of
#       boot. The device radix tree is a separate mechanism and is untouched.
#
#   --cuda-graph-max-bs-prefill 2048
#       Capturing 74 buckets up to 16384 tokens cost 5.49 GB and 222 s of boot.
#       Cold TTFT on a novel ~42K prompt is IDENTICAL with and without those
#       large buckets: 22.681 s at max_bs 16384 vs 22.717 s at 2048, two seeds
#       each. At that prompt size prefill is compute-bound, so eliminating
#       kernel-launch overhead buys nothing. Now 1.21 GB and 58 s.
#       NOTE: an apparent 12.4 -> 13.9 s TTFT regression was measured first and
#       was WRONG — the baseline container had prior traffic. Always compare
#       cold-to-cold, with text neither replica has seen.
#
#   --mem-fraction-static 0.92 (was 0.90)
#       Raising max-running-requests enlarged the scheduler's per-request
#       working-space reserve, which is subtracted BEFORE the KV pool is sized.
#       max_total_num_tokens fell 160768 -> 151168, BELOW the served
#       --context-length 160000. That was user-visible: a 154,997-token request
#       returned 200 on the old config and 400 on the new one
#       ("exceeds the maximum allowed length (151162 tokens)"). Under
#       round-robin routing that is a coin-flip failure — worse than a
#       consistently lower limit.
#       Trimming the prefill graph did NOT fix it: the pool is sized from a
#       static mem-fraction budget and does not account for actual graph
#       consumption, so the freed 4.28 GB simply went unused. What it did buy
#       was the headroom to raise mem-fraction safely.
#       Result: max_total_num_tokens = 169792 — 9,024 ABOVE the original —
#       with 8.37 GB still free.
#
#   --enable-forward-pass-metrics
#       Per-pass timing into Prometheus, for the next tuning phase.
#
#   Verified unchanged: single-stream decode (68.32 -> 68.56 tok/s), cold TTFT,
#   and greedy output — the determinism probe returns a byte-identical string
#   and an identical 1071-char reasoning trace.
#
#   Boot to healthy is now ~181 s, down from ~345 s and from ~9 min originally.
# <<<
#
# Speculative decoding:
#   DFlash2 since 2026-09-13 (was EAGLE against the bundled MTP head). BOOT
#   CHECK on every start: read the `Memory pool end` lines — the target pool
#   must stay >= --context-length, and `available_gpu_mem` should read ~2.9 GB.
#
# Metrics:
#   Observability tier lives in compose.metrics.yml — SAME project.
#   After first combined `up`, ALWAYS pass both files to compose commands:
#     docker compose -f docker-compose.yml -f compose.metrics.yml <cmd>
#
# Gateway target (for any future external consumer on `edge`):
#   http://qwen36-27b-router:8000
# =============================================================================

# PINNED BY DIGEST. Both replicas + the router must run the SAME engine build;
# a floating tag once silently moved r0 onto a new build mid-session while r1
# stayed on the old one. Digest pinning makes that impossible — `docker compose
# up -d` can no longer change the engine.
#
# 2026-08-08: bumped to v0.5.17-cu130 (sglang 0.5.17, rev 2948168), replacing
# the old dev build 0.0.0.dev1+ga358374ae (= v0.5.16 + 2 days of main). We are
# now on a RELEASE tag rather than the floating :dev-cu13 — the previous digest
# told nobody what was actually in it. Upgrade was output-identical and
# performance-neutral; see tuning/docs/UPGRADE_v0.5.17.md for the measurements
# and for the --mm-feature-transport trap it exposed.
#
# 2026-08-24: bumped to v0.5.18-cu130 (sglang 0.5.18, build commit 71de97b2).
# Provenance verified from the registry config blob before pulling: LABEL
# ai.sglang.build.commit, image.tag and the Actions build URL all agree, CUDA
# 13.0.1 -> 13.0.3, cuDNN 9.13 -> 9.14, NCCL unchanged.
#
# Nothing in the release targets SM80 — `grep -i 'sm80|A100|Ampere'` over the
# release body returns zero hits, and the Qwen3.5 GDN decode fusion (#34421) is
# HIP-only. Taken for bug-fix surface and provenance, not speed.
#
# The four upstream breaking changes that looked dangerous are all inert here,
# each checked against source at the tag — see tuning/docs/UPGRADE_v0.5.18.md:
#   - post-capture reserve 512 -> 1536 MiB (#34996) is behind
#     `if mem_fraction_static is None`, and we pin 0.92 explicitly.
#   - MoE deferred finalize: this model is DENSE (no expert keys in
#     text_config), so fused_moe_triton is never constructed.
#   - unified-cache out-of-window slot freeing: only swa_component overrides
#     free_out_of_window_slots; our components are FULL + MAMBA, no SWA.
#   - SGLANG_AUTO_NUMA_BIND False -> True restores no behaviour: v0.5.17 had no
#     such gate and always bound. Same call site, byte-identical.
#
# v0.5.18 flags evaluated on this deployment (2026-08-24):
#
#   --startup-weight-load-mode overlap   REJECTED — HARD BOOT FAILURE.
#       "ValueError: --startup-weight-load-mode=overlap is not supported:
#        speculative decoding is not supported" (startup_weight_load.py:307).
#       We run EAGLE, so this can never be enabled here. Tried on r1
#       2026-08-24, crashed the scheduler on boot; reverted, r1 recovered.
#       Do not re-add without checking that upstream gate first.
#
#   --mm-preprocess-cache-size-mb 512    APPLIED (2048 since 2026-09-19). The content-addressed
#       multimodal preprocessing cache is OFF by default for our processor
#       (base_processor.py: auto_mm_preprocess_cache_size_mb = 0; only
#       Kimi-K3 defaults it to 256). Host RAM only, no GPU cost, divided
#       across tokenizer workers (we run 1). Helps only when the SAME image
#       bytes are sent more than once — plausible for the OCR path, UNMEASURED
#       here. Drop the flag to revert.
#
#   --speculative-draft-kv-cache-dtype   NOT APPLIED. Choices are only
#       auto/fp8_e5m2/fp8_e4m3/bf16 — there is no int8 option. Moot anyway:
#       the EAGLE draft KV pool is just 0.66 GB (boot log: K 0.33 + V 0.33),
#       so fp8 would free ~0.33 GB while perturbing draft numerics, i.e.
#       accept length, which the EAGLE 5/6 win rests on.
#
#   --enable-int8-mamba-checkpoint       NOT APPLIED, but the real int8 lever
#       for SM80 + this hybrid arch: int8 radix-cached mamba states, ~2x
#       cached-prefix capacity at fixed memory. Compatible with our config
#       (requires enable_hierarchical_cache=False and radix_cache_backend
#       unset — both hold). It is LOSSY, so it changes output on cache hits
#       and needs its own gated roll. Not new in v0.5.18.
#
# KEEP --mm-feature-transport cpu pinned. v0.5.18 adds a third value
# (cuda_vmm) and rewrote the auto-resolution AGAIN; single-node now resolves to
# cpu on its own, which is what we already pin. The explicit pin is what made
# the v0.5.17 cuda_ipc flip a non-event.
#
# To bump: pull the tag, re-read the digest, paste it here, roll ONE replica at
# a time, and re-run benchmarks/run_worker.sh against both. Also diff the
# runtime server_args from /get_server_info between the two builds — `--help`
# does NOT show defaults that are resolved at startup, which is exactly how
# v0.5.17 flipped mm_feature_transport underneath us.
#   docker inspect --format='{{index .RepoDigests 0}}' lmsysorg/sglang:v0.5.20-cu130
#
# v0.5.20 (2026-09-18). Plan and gates: tuning/docs/UPGRADE_v0.5.20.md
#   Platform UNCHANGED from v0.5.19 (CUDA 13.0.3, torch 2.13.0, FlashInfer
#   0.6.18, transformers 5.12.1); only sglang-kernel 0.4.6.post1 -> 0.4.7.
#   The reason to roll: PR #37818. With DFLASH + extra_buffer the 0.5.19
#   verify path never recorded a GDN state checkpoint when accepted tokens
#   crossed a --mamba-track-interval boundary, while the scheduler booked it
#   as recorded, so radix entries could pair KV at one length with linear
#   state from an earlier one.
#   Also upstream now: the client-disconnect abort fix (f478b2bb2d, #35255)
#   that 0.5.19 carried as a bind-mounted backport (a930c99). The patch files
#   and both mounts are gone; do not bring the mounts back on a newer image.
#
#   NOTE while r1 is rolled and r0 is not: this anchor is shared by BOTH
#   replicas AND the router, but roll-replica.sh recreates only the replica
#   named. r0 and the router keep running the old build until something
#   recreates them. That asymmetry IS the A/B window. Do not run a bare
#   `docker compose up -d` during it.
#
# --enable-priority-scheduling was considered and rejected: for this
# workload it only re-scans the queue every step, and it honours a
# client-supplied `priority`, which would let any API client preempt other
# tenants.
x-sglang-image: &sglang-image lmsysorg/sglang@sha256:06e4f2ed21afde4ff513cda65070124e727ba23ccaeff7712b8c40e1097d611f

x-replica-common: &replica-common
  image: *sglang-image

  ipc: host
  shm_size: "32g"

  # SYS_NICE: lets the scheduler set thread affinity/priority sanely on the
  # dual-NUMA topology (both GPUs report NUMA affinity to nodes 0-1).
  cap_add:
    - SYS_NICE

  ulimits:
    memlock: -1
    stack: 67108864

  # Default SIGKILL grace is 10s. Workers need time to drain in-flight
  # generations and finish HiCache write-through before termination.
  stop_grace_period: 120s

  environment:
    - PYTHONUNBUFFERED=1
    - PYTHONWARNINGS=ignore::SyntaxWarning
    - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True

    # Hugging Face auth
    - HF_TOKEN=${HF_TOKEN:?set HF_TOKEN in .env}
    - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:?set HF_TOKEN in .env}

    # SGLang OpenAI-compatible API auth (internal key; Caddy swaps the
    # edge key for this one — clients never see it)
    - SGLANG_API_KEY=${SGLANG_API_KEY:?set SGLANG_API_KEY in .env}

    # Tracing REMOVED 2026-09-14 with Langfuse: no --enable-trace, no OTLP
    # exporter, no SGLANG_TRACE_LEVEL. Per-request facts now come from
    # --export-metrics-to-file records in ClickHouse engine.requests.

  entrypoint: sglang serve

  restart: unless-stopped

  logging:
    driver: "json-file"
    options:
      max-size: "50m"
      max-file: "5"

  networks:
    - qwen36-27b-backend

# NOTE on flag duplication: the two replica command blocks below are
# intentionally identical except for --port. YAML cannot splice an anchor
# into the middle of a command string, so keep them in sync BY HAND — any
# flag change must be applied to both blocks.
