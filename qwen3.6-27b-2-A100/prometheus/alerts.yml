# =============================================================================
# Prometheus alerting rules — qwen36-27b A100 node
# Location in repo: ./prometheus/alerts.yml
# Mounted read-only into the prometheus container by compose.metrics.yml.
#
# Scope: infra / endpoint liveness + GPU hardware health. Application-level
# SLO alerts (TTFT/ITL/E2E latency, KV-pool pressure, radix hit rate) live in
# Grafana Unified Alerting so they share the dashboard thresholds and the
# Grafana notification pipeline.
# =============================================================================

groups:
  - name: endpoints
    rules:
      - alert: PrometheusTargetDown
        expr: up{job!~"prometheus"} == 0
        for: 2m
        labels:
          severity: critical
          node: a100
        annotations:
          summary: "Scrape target {{ $labels.job }}/{{ $labels.instance }} is down"
          description: "Prometheus cannot scrape {{ $labels.instance }} for job {{ $labels.job }} for over 2 minutes."

  - name: gpu
    rules:
      - alert: GpuHighTemperature
        expr: DCGM_FI_DEV_GPU_TEMP > 85
        for: 5m
        labels:
          severity: critical
          node: a100
        annotations:
          summary: "GPU {{ $labels.gpu }} temperature {{ $value }}C"
          description: "GPU {{ $labels.gpu }} has been above 85C for 5 minutes. Check airflow/fan curve."

      # NO GpuMemoryPressure rule — REMOVED 2026-09-04. It fired continuously on
      # both GPUs and always would have.
      #
      # It alerted on framebuffer > 95%, which on this node is the healthy
      # steady state rather than a fault: the replicas run
      # --mem-fraction-static 0.92, so SGLang preallocates its weights and KV
      # pool at startup and holds them for the process lifetime. Measured while
      # removing it: GPU 0 at 98.5%, GPU 1 at 97.6%, both idle-to-normal.
      #
      # Its description ("OOM risk on next request burst") had the causality
      # backwards for a preallocating server. Because the pool is reserved up
      # front, a full framebuffer says nothing about headroom for the next
      # request; running OUT of room shows up as KV pool exhaustion inside that
      # reservation, which Grafana already alerts on ("KV pool utilization
      # > 95%" and "Full token usage > 95%") against sglang:* series that
      # actually move.
      #
      # The GPU-side faults worth paging on are still covered here: XID errors,
      # temperature, and the throttle/remap counters on the DCGM dashboard.
      #
      # It survived unnoticed because nothing delivered alerts. It became
      # visible the moment Alertmanager did, which is the point.

      - alert: GpuXidError
        expr: increase(DCGM_FI_DEV_XID_ERRORS[5m]) > 0
        for: 0m
        labels:
          severity: critical
          node: a100
        annotations:
          summary: "XID error on GPU {{ $labels.gpu }}"
          description: "GPU {{ $labels.gpu }} reported a CUDA XID error in the last 5 minutes."

  - name: host
    rules:
      - alert: HostLowDiskSpace
        expr: node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"} < 0.10
        for: 10m
        labels:
          severity: warning
          node: a100
        annotations:
          summary: "Root filesystem below 10% free"
          description: "Root filesystem has {{ $value | humanizePercentage }} free. Log/Docker growth risk."

      - alert: HostMemoryPressure
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 0.95
        for: 10m
        labels:
          severity: warning
          node: a100
        annotations:
          summary: "Host memory above 95%"
          description: "Host RAM is {{ $value | humanizePercentage }} utilised for 10 minutes."

  # ---------------------------------------------------------------------------
  # Edge (Caddy)
  #
  # Everything here is invisible to the SGLang and router jobs by construction:
  # these requests terminate at the edge and never reach an upstream, so no
  # engine-side metric can report them. A client-side outage that looks like
  # "no traffic" on the engine dashboards shows up in this group as a 401 rate.
  # ---------------------------------------------------------------------------
  - name: edge
    rules:
      - alert: EdgeUpstreamUnhealthy
        expr: caddy_reverse_proxy_upstreams_healthy == 0
        for: 2m
        labels:
          severity: critical
          node: a100
        annotations:
          summary: "Caddy cannot reach upstream {{ $labels.upstream }}"
          description: >-
            Caddy has marked {{ $labels.upstream }} unhealthy for 2 minutes.
            Distinct from the router's own worker health-checks: this fires
            when Caddy cannot reach the router at all, which is exactly the
            case where router metrics stop arriving and cannot report it.

      - alert: EdgeAuthRejectionRate
        expr: sum(rate(caddy_http_request_duration_seconds_count{code="401"}[5m])) > 0.2
        for: 10m
        labels:
          severity: warning
          node: a100
        annotations:
          summary: "Edge rejecting {{ $value | printf \"%.2f\" }} req/s with 401"
          description: >-
            Sustained 401s at the edge: either a client is deployed with a
            stale EDGE_API_KEY, or something is probing the endpoint. Ten
            minutes of tolerance so a single misconfigured client restart does
            not page.

      # EdgeBodyCapRejections removed 2026-08-15 together with the Caddyfile's
      # 8MB `request_body` cap (OCR sends base64 images inline and exceeds it on
      # ordinary requests). Caddy no longer emits 413, so the rule could only
      # ever be silent. Over-length prompts are now caught by SGLang against
      # --context-length 169000, which surfaces as a 4xx from the engine, not
      # from the edge.

      - alert: EdgeServerErrors
        expr: sum(rate(caddy_http_request_duration_seconds_count{code=~"5.."}[5m])) > 0.05
        for: 5m
        labels:
          severity: critical
          node: a100
        annotations:
          summary: "Edge serving 5xx at {{ $value | printf \"%.2f\" }} req/s"
          description: "502/503/504 at Caddy means the router or workers are failing or timing out, seen from the client's side."

      - alert: EdgeConfigReloadFailed
        expr: caddy_config_last_reload_successful == 0
        for: 1m
        labels:
          severity: warning
          node: a100
        annotations:
          summary: "Caddy config reload failed"
          description: >-
            Caddy is still serving its previous configuration; the running
            edge has silently diverged from the Caddyfile in this repo.

  # ---------------------------------------------------------------------------
  # Storage (ClickHouse)
  #
  # Added after an audit found ~1.0 GB of untenanted system log tables and an
  # 830 MB unrotated server log backing 396 KiB of real traces. node-exporter
  # reports host disk in aggregate only, so nothing attributed that growth to
  # ClickHouse until it was looked for deliberately. Retention is now bounded
  # by clickhouse/config.d; these rules catch a regression.
  # ---------------------------------------------------------------------------
  - name: storage
    rules:
      # The exact usage record stopped growing while the engine kept serving:
      # Vector, the exporter files or ClickHouse is broken, and every usage and
      # cost number the bot shows is going stale.
      - alert: EngineUsageRecordsStale
        expr: >-
          (time() - max(engine_usage_last_record_timestamp_seconds{source="engine"}) > 900)
            and on() (sum(increase(sglang:num_requests_total[15m])) > 0)
        for: 10m
        labels:
          severity: warning
          node: a100
        annotations:
          summary: "No engine usage record for {{ $value | humanizeDuration }} while serving"
          description: >-
            engine.requests has stopped receiving rows although the engine is
            finishing requests. Check the Vector engine_request_files source,
            logs/<replica>/request-metrics/ and the ClickHouse sink.

      - alert: EngineUsageScrapeDown
        expr: up{job="engine-usage"} == 0
        for: 10m
        labels:
          severity: warning
          node: a100
        annotations:
          summary: "Exact usage endpoint unreachable"
          description: >-
            Prometheus cannot read /engine_usage_metrics from ClickHouse, so the
            bot's usage and cost screens have no exact data.

      - alert: ClickHouseDiskFilling
        expr: >-
          ClickHouseAsyncMetrics_DiskUsed_default
            / clamp_min(ClickHouseAsyncMetrics_DiskTotal_default
                        + ClickHouseAsyncMetrics_DiskUsed_default, 1) > 0.85
        for: 15m
        labels:
          severity: warning
          node: a100
        annotations:
          summary: "ClickHouse data disk {{ $value | humanizePercentage }} used"
          description: "The usage store is running out of room. Check retention with deploy/apply-clickhouse-retention.sh."

      - alert: ClickHouseSelfObservationDominates
        expr: >-
          ClickHouseAsyncMetrics_TotalBytesOfMergeTreeTablesSystem > 5e9
        for: 30m
        labels:
          severity: warning
          node: a100
        annotations:
          summary: "ClickHouse system tables above 5 GB"
          description: >-
            system.* has outgrown its retention envelope — the failure mode
            this node already hit once, where trace_log and text_log held a
            gigabyte to back a few hundred kilobytes of traces. Confirm the
            TTLs survived with deploy/apply-clickhouse-retention.sh.

      - alert: ClickHouseQueryFailures
        expr: rate(ClickHouseProfileEvents_FailedQuery[5m]) > 0.1
        for: 10m
        labels:
          severity: warning
          node: a100
        annotations:
          summary: "ClickHouse failing {{ $value | printf \"%.2f\" }} queries/s"
          description: "Vector inserts or the engine-usage scrape are failing at the database; usage numbers stop updating."
