# =============================================================================
# Unit tests for the quota rules — `promtool test rules prometheus/rules_test.yml`
#
# Why these exist rather than a manual check: the obvious way to test
# ConsumerQuotaLow is to drain a real consumer's balance on the running gateway
# and wait fifteen minutes. That breaks a paying consumer to test a warning, and
# it cannot exercise ConsumerQuotaExhausted or QuotaLedgerUnreachable at all
# without taking the ledger down.
#
# These drive the same rule file with synthetic series instead, so every branch
# is covered in about a second and stays covered when someone edits the
# expressions later.
#
# Interval is 10m rather than the 30s the rules evaluate at, purely to keep
# the 25-hour series short.
# =============================================================================

rule_files:
  - rules.yml

evaluation_interval: 10m

tests:
  # ---------------------------------------------------------------------------
  - interval: 10m
    name: funded-and-idle, burning-fast, exhausted, and a healthy ledger

    input_series:
      # alice — spending hard, half a day of headroom. Should trip
      # ConsumerQuotaLow.
      #
      # 7,200,000 against 24h spend of 14,400,000 gives days_left of exactly
      # 0.5. Spend is the exact gauge scraped from ClickHouse (job
      # engine-usage), so no increase() extrapolation is involved.
      - series: 'redis_key_value{key="chat_quota:alice",db="db0",job="redis-ledger",instance="qwen36-27b-redis-exporter:9121"}'
        values: '7200000x200'
      # 13.824M input / 576k output: a 24:1 ratio, the shape real agent
      # traffic showed (45.8:1 on the first live consumer).
      - series: 'engine_usage_prompt_tokens{window="24h",consumer="alice",job="engine-usage"}'
        values: '13824000x200'
      - series: 'engine_usage_completion_tokens{window="24h",consumer="alice",job="engine-usage"}'
        values: '576000x200'
      - series: 'gateway_usage_requests{window="7d",consumer="alice",status_class="2xx",job="engine-usage"}'
        values: '2000x200'
      # Traffic that did not pass the gateway: no consumer label. Must not
      # produce a nameless row.
      - series: 'engine_usage_prompt_tokens{window="24h",job="engine-usage"}'
        values: '5000x200'

      # bob — at zero and still being used. Should trip ConsumerQuotaExhausted.
      - series: 'redis_key_value{key="chat_quota:bob",db="db0",job="redis-ledger",instance="qwen36-27b-redis-exporter:9121"}'
        values: '0x200'
      - series: 'gateway_usage_requests{window="7d",consumer="bob",status_class="4xx",job="engine-usage"}'
        values: '5x200'

      # carol — well funded, completely idle. Must appear in days_left (this is
      # the 1:1-match bug that dropped acme and legacy-shared) and must NOT
      # alert.
      - series: 'redis_key_value{key="chat_quota:carol",db="db0",job="redis-ledger",instance="qwen36-27b-redis-exporter:9121"}'
        values: '5000000x200'

      # dave — revoked: usage records linger, no ledger key. Must not alert,
      # because there is no balance to be exhausted.
      - series: 'gateway_usage_requests{window="7d",consumer="dave",status_class="2xx",job="engine-usage"}'
        values: '7x200'

      - series: 'redis_up{job="redis-ledger",instance="qwen36-27b-redis-exporter:9121"}'
        values: '1x200'

    promql_expr_test:
      # Exact spend per consumer, and nothing for unlabeled engine traffic.
      - expr: 'consumer:quota_spend:tokens24h'
        eval_time: 25h
        exp_samples:
          - labels: '{__name__="consumer:quota_spend:tokens24h", ai_consumer="alice"}'
            value: 14400000
      # The join that makes everything else possible: consumer name lifted out
      # of the Redis key and into ai_consumer.
      - expr: 'sum by (ai_consumer) (consumer:quota_balance:tokens)'
        eval_time: 25h
        exp_samples:
          - labels: '{ai_consumer="alice"}'
            value: 7200000
          - labels: '{ai_consumer="bob"}'
            value: 0
          - labels: '{ai_consumer="carol"}'
            value: 5000000

      # carol must be present. Before the `or ... * 0` fix she was absent
      # entirely, which on a dashboard reads as "no quota record".
      #
      # Only the consumers with no spend are asserted by value here; alice is
      # asserted on the property that matters (under a day) further down.
      - expr: 'consumer:quota_days_left{ai_consumer=~"bob|carol"}'
        eval_time: 25h
        exp_samples:
          # __name__ is part of the label set of a RECORDED series and must be
          # written out here. It is absent from the aggregated assertions above
          # only because sum() and `< bool` drop it.
          - labels: '{__name__="consumer:quota_days_left", ai_consumer="bob"}'
            value: 0
          - labels: '{__name__="consumer:quota_days_left", ai_consumer="carol"}'
            value: 5000000

      # The direction split, and the ratio derived from it: 13,824,000 / 576,000
      # = 24. round() strips __name__, hence the bare label set.
      - expr: 'round(consumer:token_ratio:in_per_out24h{ai_consumer="alice"})'
        eval_time: 25h
        exp_samples:
          - labels: '{ai_consumer="alice"}'
            value: 24

      # alice is asserted on the property that actually matters — under one day
      # of headroom — rather than on the exact quotient. `< bool 1` yields 1 or
      # 0, so the assertion is exact even though the value behind it is not.
      - expr: 'consumer:quota_days_left{ai_consumer="alice"} < bool 1'
        eval_time: 25h
        exp_samples:
          - labels: '{ai_consumer="alice"}'
            value: 1

    alert_rule_test:
      - eval_time: 25h
        alertname: ConsumerQuotaLow
        exp_alerts:
          - exp_labels:
              ai_consumer: alice
              severity: warning
              node: a100
            exp_annotations:
              summary: "alice has under a day of quota left"
              description: >-
                At the last 24h burn rate this consumer runs out within a day.
                The burn rate is the exact sum of tokens the engine processed for
                this consumer in the last 24 hours.

      - eval_time: 25h
        alertname: ConsumerQuotaExhausted
        exp_alerts:
          - exp_labels:
              ai_consumer: bob
              severity: warning
              node: a100
            exp_annotations:
              summary: "bob is out of quota (0 tokens)"
              description: >-
                Balance is at or below zero for an active consumer. Every request
                from them now returns 403. Top up with /topup in the bot.

      # The ledger is up, so this must be silent.
      - eval_time: 25h
        alertname: QuotaLedgerUnreachable
        exp_alerts: []

  # ---------------------------------------------------------------------------
  - interval: 10m
    name: ledger unreachable

    input_series:
      - series: 'redis_up{job="redis-ledger",instance="qwen36-27b-redis-exporter:9121"}'
        values: '0x20'

    alert_rule_test:
      - eval_time: 30m
        alertname: QuotaLedgerUnreachable
        exp_alerts:
          - exp_labels:
              severity: critical
              node: a100
              job: redis-ledger
              instance: qwen36-27b-redis-exporter:9121
            exp_annotations:
              summary: "ai-quota ledger unreachable"
              description: >-
                redis_exporter cannot reach higress-redis. ai-quota fails CLOSED, so
                every billable route is returning 403 "No quota left" regardless of
                actual balances. The team's direct router hostname is the escape
                hatch.
