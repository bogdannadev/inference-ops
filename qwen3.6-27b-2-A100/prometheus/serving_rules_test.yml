# =============================================================================
# Unit tests for the `serving` group in rules.yml —
#   promtool test rules prometheus/serving_rules_test.yml
#
# Separate from rules_test.yml because these need the real 15s evaluation
# interval: the quota tests run at 10m, which would step straight over a
# 2-minute `for:`.
#
# The shapes are 2026-09-16's: r1 with a queue while r0 is idle (14:20), both
# replicas queued (a burst: must NOT count as stranded), and a queue that never
# empties (11:11).
# =============================================================================

rule_files:
  - rules.yml

evaluation_interval: 15s

tests:
  # ---------------------------------------------------------------------------
  - interval: 15s
    name: stranded queue fires, a both-sides burst does not

    input_series:
      # 0-5m: r1 queued, r0 idle          -> stranded
      # 5-10m: both queued, both full     -> not stranded
      # 10-15m: nothing queued            -> not stranded
      - series: 'sglang:num_queue_reqs{job="sglang-workers",instance="qwen36-27b-r1:8002"}'
        values: '2x19 2x19 0x20'
      - series: 'sglang:num_running_reqs{job="sglang-workers",instance="qwen36-27b-r1:8002"}'
        values: '1x19 4x19 1x20'
      - series: 'sglang:num_queue_reqs{job="sglang-workers",instance="qwen36-27b-r0:8001"}'
        values: '0x19 1x19 0x20'
      - series: 'sglang:num_running_reqs{job="sglang-workers",instance="qwen36-27b-r0:8001"}'
        values: '0x19 4x19 0x20'

    promql_expr_test:
      - expr: node:engine_queue_stranded:bool
        eval_time: 1m
        exp_samples:
          - labels: 'node:engine_queue_stranded:bool'
            value: 1
      - expr: node:engine_queue_stranded:bool
        eval_time: 7m
        exp_samples:
          - labels: 'node:engine_queue_stranded:bool'
            value: 0
      # Always present, so the bot's minute count has a denominator.
      - expr: node:engine_queue_stranded:bool
        eval_time: 12m
        exp_samples:
          - labels: 'node:engine_queue_stranded:bool'
            value: 0

    alert_rule_test:
      # Not yet: `for: 2m` has not elapsed.
      - eval_time: 1m
        alertname: EngineQueueStrandedOnOneReplica
        exp_alerts: []
      - eval_time: 3m
        alertname: EngineQueueStrandedOnOneReplica
        exp_alerts:
          - exp_labels:
              severity: warning
              node: a100
            exp_annotations:
              summary: "Requests queued on one replica while the other has room"
              description: >-
                For 2 minutes one replica has had a queue while the other had no
                queue and a free slot. This is cache_aware routing keeping a session
                on the replica that holds its prefix: the router balances only on
                its own in-flight request counts, not on KV use or queue length.
                Queued clients may give up (see GatewayClientsLeavingBeforeReply).
                The bot's /errors shows the minutes; tuning/docs/ROUTING.md has the
                options.
      # Both replicas busy is load, not routing.
      - eval_time: 8m
        alertname: EngineQueueStrandedOnOneReplica
        exp_alerts: []

  # ---------------------------------------------------------------------------
  - interval: 15s
    name: a queue that never empties, and one that blinks empty

    input_series:
      # r0: 3 queued for 13 minutes straight.
      - series: 'sglang:num_queue_reqs{job="sglang-workers",instance="qwen36-27b-r0:8001"}'
        values: '3x52'
      # r1: queued, but empty for one sample every 5 minutes.
      - series: 'sglang:num_queue_reqs{job="sglang-workers",instance="qwen36-27b-r1:8002"}'
        values: '2x19 0 2x19 0 2x12'
      - series: 'sglang:num_running_reqs{job="sglang-workers",instance="qwen36-27b-r0:8001"}'
        values: '1x52'
      - series: 'sglang:num_running_reqs{job="sglang-workers",instance="qwen36-27b-r1:8002"}'
        values: '1x52'

    alert_rule_test:
      - eval_time: 9m
        alertname: EngineQueueNotDraining
        exp_alerts: []
      - eval_time: 12m
        alertname: EngineQueueNotDraining
        exp_alerts:
          - exp_labels:
              severity: warning
              node: a100
              job: sglang-workers
              instance: qwen36-27b-r0:8001
            exp_annotations:
              summary: "qwen36-27b-r0:8001 has had a queue for over 10 minutes"
              description: >-
                qwen36-27b-r0:8001 has not had an empty queue for 10 minutes
                (now 3 waiting at the low point). Check whether the
                running requests still have clients: grep the replica log for
                "but the state was deleted in TokenizerManager". /health shows the
                queues.

  # ---------------------------------------------------------------------------
  - interval: 15s
    name: gateway error causes

    input_series:
      # 2026-09-16 11:00 for vkondratyev-demo: 69 left early, 12 timeouts.
      - series: 'gateway_usage_error_requests{window="1h",consumer="vkondratyev-demo",cause="left_before_reply",job="engine-usage"}'
        values: '69x20'
      - series: 'gateway_usage_error_requests{window="1h",consumer="vkondratyev-demo",cause="timeout",job="engine-usage"}'
        values: '12x20'
      # A normal hour: 5 left early, no alert.
      - series: 'gateway_usage_error_requests{window="1h",consumer="danila",cause="left_before_reply",job="engine-usage"}'
        values: '5x20'
      # Only the 1h window alerts; the 24h tail of yesterday must not.
      - series: 'gateway_usage_error_requests{window="24h",consumer="tim",cause="timeout",job="engine-usage"}'
        values: '3x20'
      - series: 'gateway_usage_error_requests{window="1h",consumer="tim",cause="server_error",job="engine-usage"}'
        values: '2x20'

    alert_rule_test:
      - eval_time: 3m
        alertname: GatewayClientsLeavingBeforeReply
        exp_alerts:
          - exp_labels:
              severity: warning
              node: a100
              consumer: vkondratyev-demo
            exp_annotations:
              summary: "vkondratyev-demo: 69 requests abandoned before any reply in the last hour"
              description: >-
                The client closed the connection before the first byte, which on
                this node means it waited in a queue or in a long prefill and gave
                up. Look for EngineQueueStrandedOnOneReplica or
                EngineQueueNotDraining at the same time. /errors vkondratyev-demo
                in the bot lists the requests.
      - eval_time: 3m
        alertname: GatewayTimeouts
        exp_alerts:
          - exp_labels:
              severity: warning
              node: a100
              consumer: vkondratyev-demo
            exp_annotations:
              summary: "vkondratyev-demo: 12 gateway timeouts (504/408) in the last hour"
              description: >-
                The gateway gave up on a request. The stream idle timeout is 900 s
                since 2026-09-16 (was 180 s), equal to the router's
                --request-timeout-secs, so a timeout now means a request produced
                nothing for 15 minutes.
      # Two 5xx is under the threshold of 3.
      - eval_time: 3m
        alertname: GatewayServerErrors
        exp_alerts: []

  # ---------------------------------------------------------------------------
  - interval: 1m
    name: wrong-key bursts per host

    input_series:
      # 300 bad POSTs in an hour on the direct hostname: a real stale-key
      # client, and the only thing this rule is meant to catch.
      - series: 'caddy_http_request_duration_seconds_count{code="401",host="model.example.com",method="POST",server="srv1",handler="subroute"}'
        values: '0+5x70'
      # A path scanner sweeping .env files at the SAME hostname, an order of
      # magnitude louder, all GET. Must NOT fire: it is refused before routing
      # and there is nothing to do about it. This is the 2026-09-21 fix.
      - series: 'caddy_http_request_duration_seconds_count{code="401",host="model.example.com",method="GET",server="srv1",handler="subroute"}'
        values: '0+50x70'
      # A few an hour on the gateway: under the threshold of 5.
      - series: 'caddy_http_request_duration_seconds_count{code="401",host="gateway.example.com",method="POST",server="srv1",handler="subroute"}'
        values: '0+0.05x70'
      # _other is scanners hitting the bare IP; ignored.
      - series: 'caddy_http_request_duration_seconds_count{code="401",host="_other",method="POST",server="srv1",handler="subroute"}'
        values: '0+10x70'
      - series: 'gateway_usage_error_requests{window="1h",consumer="unauthenticated",cause="no_key",job="engine-usage"}'
        values: '60x70'

    alert_rule_test:
      - eval_time: 70m
        alertname: EdgeWrongKeyBurst
        exp_alerts:
          - exp_labels:
              severity: warning
              node: a100
              host: model.example.com
            exp_annotations:
              summary: "model.example.com: 300 wrong-key API calls in the last hour"
              description: >-
                A client is POSTing a bad key at model.example.com. POST-only on
                purpose: GET 401s here are path scanners probing for .env files,
                which are refused before routing and need no action. Tell them
                apart before digging — a scanner fires at BOTH shared-key hostnames
                in the same minute with a low count, a real stale-key client hits
                one hostname and keeps going. Find it with docker logs on the Caddy
                container filtered to this host and status 401; the client_ip is in
                each line. For the gateway hostname, /errors unauthenticated in the
                bot lists them. Caddy logs only to stdout, so recreating the
                container loses the evidence — look before rolling anything.
      - eval_time: 70m
        alertname: GatewayWrongKeyBurst
        exp_alerts:
          - exp_labels:
              severity: warning
              node: a100
            exp_annotations:
              summary: "Gateway: 60 requests with a bad or missing key in the last hour"
              description: >-
                Per-key gateway hostname. /errors unauthenticated in the bot lists
                the requests with the client address.

  # ---------------------------------------------------------------------------
  # Router circuit breakers (2026-09-21). smg_worker_cb_state: 0 closed,
  # 1 open, 2 half_open. The per-worker rules are bare comparisons, so the
  # alert carries every label the series had.
  - interval: 1m
    name: one worker's breaker open

    input_series:
      - series: 'smg_worker_cb_state{worker="http://r0:8001",job="sglang-router"}'
        values: '1x40'
      - series: 'smg_worker_cb_state{worker="http://r1:8002",job="sglang-router"}'
        values: '0x40'

    alert_rule_test:
      # Under `for: 2m` nothing has fired yet.
      - eval_time: 1m
        alertname: RouterWorkerCircuitOpen
        exp_alerts: []
      - eval_time: 10m
        alertname: RouterWorkerCircuitOpen
        exp_alerts:
          - exp_labels:
              severity: warning
              node: a100
              worker: "http://r0:8001"
              job: sglang-router
            exp_annotations:
              summary: "http://r0:8001: circuit breaker open, taking no traffic"
              description: >-
                This worker is excluded from routing, so the node is serving on
                what is left. Ten failures in a 120 s window open a breaker.
                Engine logs for that replica say whether it is really failing.
      # One of two workers open is not a service outage.
      - eval_time: 10m
        alertname: RouterAllCircuitsOpen
        exp_alerts: []
      # Open is not half-open.
      - eval_time: 40m
        alertname: RouterWorkerCircuitHalfOpen
        exp_alerts: []

  # ---------------------------------------------------------------------------
  - interval: 1m
    name: every breaker open is an outage

    input_series:
      - series: 'smg_worker_cb_state{worker="http://r0:8001",job="sglang-router"}'
        values: '1x40'
      - series: 'smg_worker_cb_state{worker="http://r1:8002",job="sglang-router"}'
        values: '1x40'

    alert_rule_test:
      - eval_time: 10m
        alertname: RouterAllCircuitsOpen
        exp_alerts:
          - exp_labels:
              severity: critical
              node: a100
            exp_annotations:
              summary: "Router: every worker's circuit breaker is open — serving is down"
              description: >-
                The router has no worker it will send to and is answering 503
                no_available_workers. Check whether the workers are actually sick
                (docker logs on each engine) before restarting anything: a request
                that fails identically on every replica opens every breaker while
                the engines are healthy and idle. Breakers half-open 60 s after the
                last failure and close on the first success, so this clears itself
                once the failing client stops.

  # ---------------------------------------------------------------------------
  # The 2026-09-20 aftermath: r0 stranded in half_open because cache_aware
  # sent it nothing to probe with. Must stay quiet for the first half hour.
  - interval: 1m
    name: breaker stuck half-open

    input_series:
      - series: 'smg_worker_cb_state{worker="http://r0:8001",job="sglang-router"}'
        values: '2x60'
      - series: 'smg_worker_cb_state{worker="http://r1:8002",job="sglang-router"}'
        values: '0x60'

    alert_rule_test:
      - eval_time: 20m
        alertname: RouterWorkerCircuitHalfOpen
        exp_alerts: []
      - eval_time: 35m
        alertname: RouterWorkerCircuitHalfOpen
        exp_alerts:
          - exp_labels:
              severity: warning
              node: a100
              worker: "http://r0:8001"
              job: sglang-router
            exp_annotations:
              summary: "http://r0:8001: circuit breaker stuck half-open for 30m"
              description: >-
                Half-open is a normal state for seconds, not half an hour. It
                admits probes only and closes on the first success, so being stuck
                here means the policy is not sending this worker any traffic to
                probe with — cache_aware prefers whichever replica is warm, which
                is exactly how r0 stayed out for 10 h on 2026-09-20. Re-register it
                to reset: GET /workers, DELETE /workers/<id>, POST /workers (this
                is what deploy/roll-replica.sh does). Do not restart the router;
                that drops in-flight requests on every replica.
      # Half-open is not open.
      - eval_time: 35m
        alertname: RouterWorkerCircuitOpen
        exp_alerts: []
