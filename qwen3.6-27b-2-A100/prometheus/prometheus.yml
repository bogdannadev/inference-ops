# =============================================================================
# Prometheus scrape config — qwen36-27b A100 node
# Location in repo: ./prometheus/prometheus.yml
# Mounted read-only into the prometheus container by compose.metrics.yml
# =============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s

  # Explicit rather than inherited. The default is also 10s, but two jobs below
  # run a 5s scrape_interval, and a timeout longer than the interval is a
  # config error in Prometheus. It currently survives only because Prometheus
  # silently clamps the timeout down to the interval — stating it here means
  # the next person to lower an interval sees the relationship instead of
  # relying on that clamp.
  scrape_timeout: 10s

  # Stamped onto every series leaving this server (federation, remote-write,
  # Alertmanager). This node runs one Prometheus today, but alerts already
  # carry a hand-written `node: a100` label per rule; external_labels is the
  # mechanism that keeps that identity correct if a second node ever ships
  # metrics to a shared target, without editing every rule again.
  external_labels:
    node: a100
    stack: qwen36-27b

# Prometheus-native alerting rules (infra-level: endpoint up, GPU health).
# Grafana owns the app-level SLO alerts (latency, KV pool, radix hit rate).
rule_files:
  - /etc/prometheus/alerts.yml
  # Recording rules for per-consumer usage, plus the quota alerts that depend on
  # them. Split out so alerts.yml stays readable as the operational contract.
  - /etc/prometheus/rules.yml

# -----------------------------------------------------------------------------
# Alert DELIVERY. Added 2026-09-04, and its absence was the most consequential
# gap in this file.
#
# Until now every rule below evaluated correctly and notified nobody: there was
# no alerting block, no Alertmanager, and the Grafana SLO rules were
# evaluation-only with no contact point. A Langfuse ingest outage ran ~14 hours
# with TraceExportFailing firing the whole time. Evaluation is not monitoring.
#
# Alertmanager is on `edge` rather than the backend because it has to reach
# quota-bot, which lives there; see the service comment in
# docker-compose.metrics.yml for why the bot must NOT be moved to the backend
# instead. Prometheus already spans both networks, so it reaches this either way.
#
# Delivery is push-with-retry from here: an Alertmanager that is down or
# restarting costs the notifications for that window and nothing else. No rule
# evaluation depends on it.
# -----------------------------------------------------------------------------
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - qwen36-27b-alertmanager:9093

scrape_configs:
  # ---------------------------------------------------------------------------
  # SGLang workers — engine-level metrics (--enable-metrics / --enable-mfu-metrics)
  #
  # NOTE: verify whether --api-key gates /metrics on your build. If it does,
  # uncomment the authorization block and keep the key OUT of this file
  # (credentials_file, mounted from a secret, not the plain credential).
  # ---------------------------------------------------------------------------
  - job_name: sglang-workers
    metrics_path: /metrics
    # 5s, not the 15s global. A benchmark rung runs 3-10 s; at 15s a whole
    # rung can fall between two scrapes. This is still too coarse for
    # per-rung attribution — tuning/bench/capture.py polls /metrics directly
    # for that. 5s is for dashboards and for spotting drift across a run.
    scrape_interval: 5s
    static_configs:
      - targets:
          - qwen36-27b-r0:8001
          - qwen36-27b-r1:8002
        labels:
          node: a100
          model: qwen36-27b
    # authorization:
    #   type: Bearer
    #   credentials_file: /etc/prometheus/sglang_api_key

  # ---------------------------------------------------------------------------
  # sgl-router — queueing / routing / per-worker dispatch metrics
  # (router flag pair: --prometheus-host 0.0.0.0 --prometheus-port 29000)
  # ---------------------------------------------------------------------------
  - job_name: sglang-router
    static_configs:
      - targets:
          - qwen36-27b-router:29000
        labels:
          node: a100

  # ---------------------------------------------------------------------------
  # DCGM — per-GPU hardware telemetry
  # ---------------------------------------------------------------------------
  - job_name: dcgm
    # 5s to match the workers, so GPU-side and engine-side series line up on
    # the same timeline. The exporter itself samples at 1000ms
    # (--collect-interval in docker-compose.metrics.yml), so a 5s scrape
    # reports the most recent 1s sample rather than a 5s average — enough to
    # catch a clock drop or a power cap during a run.
    scrape_interval: 5s
    static_configs:
      - targets:
          - dcgm-exporter:9400
        labels:
          node: a100

  # ---------------------------------------------------------------------------
  # Node Exporter — host hardware (CPU/RAM/disk/network/load)
  # ---------------------------------------------------------------------------
  - job_name: node
    scrape_interval: 15s
    static_configs:
      - targets:
          - qwen36-27b-node-exporter:9100
        labels:
          node: a100

  # ---------------------------------------------------------------------------
  # Caddy — the edge itself
  #
  # The only job that sees requests which never reach SGLang: TLS handshake
  # failures and 401s from a wrong edge key terminate at Caddy, so they are
  # invisible everywhere else in this file. (There is no longer a body cap —
  # removed 2026-08-15 for OCR image payloads — so 413s no longer appear here.)
  # A client-side outage that looks like "no traffic" on the engine dashboards
  # shows up here as a 401 rate.
  #
  # Reached over the `edge` network (Prometheus is attached to both). Requires
  # `servers { metrics }` in the Caddyfile global options — without it this
  # target is up but serves only process and config gauges.
  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # Higress AI gateway — the PAID edge (gateway.example.org).
  #
  # Port 15020 is pilot-agent's MERGED metrics endpoint, which is what the
  # Higress console documents. It is a strict superset of Envoy's own :15090 —
  # same 654 Envoy families plus ~48 `istio_agent_*` ones, including
  # istio_agent_wasm_remote_fetch_count and istio_agent_wasm_cache_entries,
  # which are worth watching on this stack: a non-zero remote fetch would mean
  # a plugin is reaching for the flaky Aliyun registry instead of the bundled
  # copy on the local plugin-server.
  #
  # NOT the admin API on 15000, which binds 127.0.0.1 only and must stay that
  # way — it can rewrite Envoy's whole config.
  #
  # The valuable series here are the ai-statistics counters. Envoy's stat-tag
  # extraction has already turned the dotted wasm metric names into labels:
  #
  #   route_upstream_model_consumer_metric_total_token{
  #       ai_route="ai-chat", ai_cluster="outbound|8000||qwen-router.dns",
  #       ai_model="qwen3.8-27b", ai_consumer="acme"}
  #
  # Verified against the ledger: one request reporting 54/16/70 moved the
  # metric by exactly 54/16/70 and the Redis balance by 70. Counters here and
  # billing agree.
  #
  # NOT scraped from here: each consumer's REMAINING quota. That lives in
  # higress-redis, which speaks RESP, not HTTP. A redis_exporter would be
  # needed; see the gateway dashboard notes.
  - job_name: higress
    scrape_interval: 15s
    metrics_path: /stats/prometheus
    static_configs:
      - targets:
          - higress:15020
        labels:
          node: a100

  # ---------------------------------------------------------------------------
  # Higress CONTROL plane. The `higress` job above scrapes the gateway — the
  # data plane — and that is the half that looks healthy during a control-plane
  # failure. A wedged controller or a rejected xDS push leaves Envoy serving
  # its last-known-good config indefinitely: requests still succeed, latency is
  # normal, and the route you just applied simply never arrives.
  #
  # Reachable only on higress_higress-net, which Prometheus joins for this.
  # ---------------------------------------------------------------------------

  # NO apiserver job, deliberately — REMOVED 2026-09-04 after being permanently
  # red for a day. It is kept out for the same reason the controller has never
  # had one: a target that is always down teaches people to ignore red.
  #
  # History: this job worked while the apiserver answered anonymously. Adding
  # `--auth-enabled` on 2026-09-03 closed that hole (an anonymous GET of the
  # wasmplugins collection returned every consumer's plaintext credential), and
  # every scrape has returned 403 since. The comment that used to live here
  # still described the endpoint as anonymous, which the fix had made false the
  # day before.
  #
  # Why it was not simply re-armed with a certificate. Measured 2026-09-04:
  #
  #   anonymous                                -> 403
  #   client.crt (CN=higress, O=system:masters) -> 200
  #   a CA-signed cert with any other identity  -> 403, on /metrics too
  #
  # The apiserver authorizes, it does not merely authenticate, and it serves no
  # rbac.authorization.k8s.io API group — so there is no way to mint a
  # read-only or metrics-only credential. The only cert that can scrape this is
  # the shared cluster-admin one, which can also read every consumer's API key
  # out of the key-auth object and rewrite all gateway config.
  #
  # Seven series is not worth putting that credential inside Prometheus, which
  # is also attached to `edge`. The question this job was supposed to answer —
  # "did my config change actually reach the gateway" — is answered better by
  # the pilot_xds_* series below, because that is the hop that matters. Config
  # write failures also surface directly: quota-bot reports them to Telegram,
  # and apply.sh blocks until every object is verified.
  #
  # Reopen only if apiserver-side metrics become genuinely necessary, and treat
  # "Prometheus holds a cluster-admin credential" as the cost being accepted.

  # NO controller job, deliberately. The Higress controller exposes no
  # Prometheus endpoint in this build: `higress serve --help` has no metrics
  # flag, 8888 returns 404 for every metrics path, and 8889 answers 200 with
  # the literal string "Lookit my cool website over HTTPS!" on ANY path — a
  # placeholder that Prometheus scrapes happily and then fails to parse
  # ("strconv.ParseFloat: parsing \"my\""). A permanently-down target is worse
  # than no target: it teaches people to ignore red.
  #
  # The controller is not unobserved, though. It feeds pilot, so a wedged or
  # rejecting controller shows up in the pilot_xds_* series below — which is
  # the signal that actually matters, since that is what reaches Envoy.

  # Istio pilot: xDS push latency and rejections, plus citadel_* certificate
  # expiry gauges. The cert expiry series are the ones worth an alert — they
  # fail silently and then all at once.
  - job_name: higress-pilot
    scrape_interval: 30s
    static_configs:
      - targets:
          - pilot.svc:15014
        labels:
          node: a100

  - job_name: caddy
    scrape_interval: 15s
    static_configs:
      - targets:
          - caddy:2020
        labels:
          node: a100

  # ---------------------------------------------------------------------------
  # OpenTelemetry Collector — trace pipeline self-telemetry
  #
  # Watch `otelcol_exporter_send_failed_spans` and `otelcol_exporter_queue_size`
  # here: a Langfuse outage or a stale LANGFUSE_OTEL_AUTH shows up as failed
  # spans and a filling queue long before anyone notices the UI is empty.
  # Dropped spans are also the signal that the batch settings need widening.
  # ---------------------------------------------------------------------------
  - job_name: otel-collector
    scrape_interval: 15s
    static_configs:
      - targets:
          - otel-collector:8888
        labels:
          node: a100

  # ---------------------------------------------------------------------------
  # ClickHouse — Langfuse's trace store, and the largest disk consumer on the
  # node by a wide margin.
  #
  # Added after an audit found 1.0 GB of untenanted system log tables plus an
  # 830 MB unrotated server log backing 396 KiB of actual traces. Nothing
  # attributed that growth to ClickHouse: node-exporter reports host disk in
  # aggregate only. Retention is now bounded by clickhouse/config.d, and this
  # job is what makes a regression visible before it is measured in gigabytes.
  #
  # Series worth knowing:
  #   ClickHouseAsyncMetrics_DiskUsed_default   — bytes on the data disk
  #   ClickHouseAsyncMetrics_NumberOfTables     — table-count drift
  #   ClickHouseMetrics_Query / _Merge          — live query and merge load
  #   ClickHouseProfileEvents_FailedQuery       — cumulative failure counter
  #
  # Requires <prometheus> in clickhouse/config.d/prometheus.xml; the stock
  # image ships that section commented out and exposes nothing.
  # ---------------------------------------------------------------------------
  - job_name: clickhouse
    scrape_interval: 30s
    # ClickHouse renders its whole async-metric set on every scrape, which is
    # the slowest exposition in this file and the least time-sensitive. Disk
    # and part counts move over hours, not seconds.
    static_configs:
      - targets:
          - qwen36-27b-langfuse-clickhouse:9363
        labels:
          node: a100

  # ---------------------------------------------------------------------------
  # redis_exporter — the ai-quota LEDGER, i.e. the billing record.
  #
  # This is the one source on the node that is durable and exact. Everything
  # else here is a rate: the Envoy ai-statistics counters reset when the gateway
  # restarts, so `increase()` over a window that spans a restart undercounts,
  # and an invoice must never be built from them.
  #
  # The series that matter:
  #   redis_key_value{key="chat_quota:<consumer>"}  remaining tokens
  #   redis_up                                      is the ledger reachable
  #
  # redis_key_value is emitted only for keys whose value parses as a number,
  # which is exactly what ai-quota stores. The consumer name is inside the key,
  # so the recording rules in alerts.yml lift it into an `ai_consumer` label to
  # make it joinable with the gateway counters.
  #
  # Note the failure mode this closes: ai-quota answers 403 "No quota left"
  # identically for never-seeded, exhausted, and Redis-down. redis_up plus a
  # balance gauge tells those three apart without shelling into the box.
  # ---------------------------------------------------------------------------
  - job_name: redis-ledger
    scrape_interval: 30s
    static_configs:
      - targets:
          - qwen36-27b-redis-exporter:9121
        labels:
          node: a100

  # ---------------------------------------------------------------------------
  # Vector — per-consumer aggregates derived from the access log.
  #
  # These exist because ai-statistics cannot produce them: its seven counters
  # carry no status code and no latency histogram, so "which consumer is getting
  # 422s" and "what is p95 for this consumer" were unanswerable from Prometheus.
  # The per-request rows in ClickHouse can answer both, but quota-bot cannot
  # reach ClickHouse — it lives on `edge`, the trace store is backend-only, and
  # putting an internet-reachable bot on the backend would hand it a route to
  # the worker ports. So the aggregates come to where the bot already looks.
  #
  #   gateway_requests_total{consumer,route,status_class}
  #   gateway_tokens_total{consumer,model}
  #   gateway_request_duration_ms{consumer,route,quantile}
  #
  # Same contract as every other counter here: process-lifetime, resets when
  # Vector restarts. Rates and distributions only. The ClickHouse table is the
  # durable per-request record and the Redis ledger is still what bills.
  # ---------------------------------------------------------------------------
  - job_name: vector
    scrape_interval: 30s
    static_configs:
      - targets:
          - qwen36-27b-vector:9598
        labels:
          node: a100

  # ---------------------------------------------------------------------------
  # Alertmanager — the delivery path itself.
  #
  # Worth scraping for exactly one reason: alertmanager_notifications_failed_total.
  # A webhook the bot is rejecting (wrong bearer, bot down, endpoint renamed)
  # otherwise looks identical to a quiet system — alerts fire, Alertmanager
  # accepts them, and nothing arrives. That failure mode is how this stack got
  # into a 14-hour silent outage in the first place, one layer up.
  #
  # Also: alertmanager_notification_latency_seconds and
  # alertmanager_alerts{state="active"} for a sanity check against
  # `curl /api/v1/alerts` on this server.
  # ---------------------------------------------------------------------------
  - job_name: alertmanager
    scrape_interval: 30s
    static_configs:
      - targets:
          - qwen36-27b-alertmanager:9093
        labels:
          node: a100

  # ---------------------------------------------------------------------------
  # Prometheus self-scrape
  # ---------------------------------------------------------------------------
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
        labels:
          # Every other job carries this; without it the self-scrape series
          # drop out of any dashboard variable or query filtered on `node`.
          node: a100
