# =============================================================================
# Recording rules — per-consumer usage
# Location in repo: ./prometheus/rules.yml
#
# Separate from alerts.yml on purpose: that file is alerting rules and is read
# as the operational contract. These are derived series that dashboards, the
# quota-bot and the alerts below all share, so that "days left" means the same
# arithmetic everywhere instead of being re-derived in three places that drift.
#
# The `level:metric:operation` naming is the Prometheus convention for recorded
# series and marks them as derived rather than scraped.
# =============================================================================

groups:
  - name: usage
    # 30s, not the 15s default. Every input here moves on the scale of minutes
    # (the ledger is scraped at 30s, and a 24h increase does not change quickly),
    # so a faster evaluation would only cost CPU.
    interval: 30s
    rules:
      # -----------------------------------------------------------------------
      # The ledger, made joinable.
      #
      # redis_exporter emits the consumer name INSIDE the key label
      # (`chat_quota:danila`), while every gateway metric carries it as
      # `ai_consumer`. Without this rewrite the two cannot be combined at all —
      # no `on(...)` clause can match a label against a substring of another.
      #
      # This is the reason the whole per-user story hangs together: after this
      # rule, the durable balance and the (resettable) gateway counters share a
      # label and can be divided by one another.
      # -----------------------------------------------------------------------
      - record: consumer:quota_balance:tokens
        expr: |
          label_replace(
            redis_key_value{key=~"chat_quota:.+"},
            "ai_consumer", "$1", "key", "chat_quota:(.+)"
          )

      # -----------------------------------------------------------------------
      # Spend over the last day, exact.
      #
      # Since 2026-09-14 these read the engine's per-request records
      # (engine.requests, summed in ClickHouse and scraped as gauges by job
      # `engine-usage`), not Envoy counters. increase() over the counters lost
      # the first request after every restart and extrapolated to the window
      # edges; these are plain sums over the requests SGLang finished in the
      # last 24h. Aborted requests are excluded, as the ledger charged them
      # nothing. The engine says `consumer`; the ledger side says ai_consumer.
      #
      # The ledger cannot tell input from output — ai-quota deducts both 1:1 —
      # but they are not the same cost: an input token on an agent re-sending
      # its context is usually a prefix-cache hit.
      # -----------------------------------------------------------------------
      - record: consumer:quota_spend:input24h
        expr: |
          sum by (ai_consumer) (
            label_replace(engine_usage_prompt_tokens{window="24h",consumer!=""}, "ai_consumer", "$1", "consumer", "(.+)")
          )

      - record: consumer:quota_spend:output24h
        expr: |
          sum by (ai_consumer) (
            label_replace(engine_usage_completion_tokens{window="24h",consumer!=""}, "ai_consumer", "$1", "consumer", "(.+)")
          )

      - record: consumer:quota_spend:tokens24h
        expr: |
          consumer:quota_spend:input24h + consumer:quota_spend:output24h

      # Input tokens charged per output token produced. A consumer near 1 is
      # doing generative work; one in the tens is paying mostly to re-send
      # context. clamp_min keeps a consumer who produced no output from
      # rendering as +Inf, which reads as breakage rather than as "no output".
      - record: consumer:token_ratio:in_per_out24h
        expr: |
          consumer:quota_spend:input24h
            / clamp_min(consumer:quota_spend:output24h, 1)

      # -----------------------------------------------------------------------
      # Days of headroom at the current burn rate.
      #
      # Both sides are aggregated to `ai_consumer` alone so the division has a
      # clean 1:1 match — the raw balance still carries db/key/instance/job from
      # the exporter, which would otherwise make this a many-to-one join.
      #
      # clamp_min on the denominator keeps an idle consumer from producing
      # +Inf, which renders as "No data" on a panel and reads as breakage.
      # An idle consumer instead gets a very large finite number, which is true.
      #
      # The `or ... * 0` is not decoration. Division is a 1:1 label match, so a
      # consumer with a balance but NO spend series at all — anyone who sent
      # nothing in 24h — has nothing to match against and drops out of the
      # result entirely. Measured before this was added: acme and legacy-shared,
      # both funded and idle, were simply absent from the series, which on a
      # dashboard is indistinguishable from having no quota record at all.
      #
      # The `or` supplies an explicit zero-spend row for exactly those
      # consumers, taken from the balance series so the label set matches.
      # -----------------------------------------------------------------------
      - record: consumer:quota_days_left
        expr: |
          sum by (ai_consumer) (consumer:quota_balance:tokens)
            / clamp_min(
                sum by (ai_consumer) (consumer:quota_spend:tokens24h)
                  or (sum by (ai_consumer) (consumer:quota_balance:tokens) * 0),
                1
              )

      # -----------------------------------------------------------------------
      # Share of the node's tokens, per consumer, last hour, exact.
      #
      # The denominator is every request the engine finished, including traffic
      # on the direct (unmetered) hostname, which carries no consumer label. A
      # consumer's share therefore says "of everything this node did", and the
      # shares need not sum to 1.
      # -----------------------------------------------------------------------
      - record: consumer:token_share:ratio1h
        expr: |
          sum by (ai_consumer) (
            label_replace(
              engine_usage_prompt_tokens{window="1h",consumer!=""} + engine_usage_completion_tokens{window="1h",consumer!=""},
              "ai_consumer", "$1", "consumer", "(.+)")
          )
            / scalar(clamp_min(
                sum(engine_usage_prompt_tokens{window="1h"}) + sum(engine_usage_completion_tokens{window="1h"}), 1))

  - name: quota
    rules:
      # -----------------------------------------------------------------------
      # The ledger being unreachable is a HARD outage of every billable route.
      #
      # ai-quota has no fail-open: if it cannot read Redis, it denies. So this
      # is not a monitoring gap, it is the paid hostname being down, and it is
      # indistinguishable to a customer from "you have run out".
      # -----------------------------------------------------------------------
      - alert: QuotaLedgerUnreachable
        expr: redis_up == 0
        for: 2m
        labels:
          severity: critical
          node: a100
        annotations:
          summary: "ai-quota ledger unreachable"
          description: >-
            redis_exporter cannot reach higress-redis. ai-quota fails CLOSED, so
            every billable route is returning 403 "No quota left" regardless of
            actual balances. The team's direct router hostname is the escape
            hatch.

      # -----------------------------------------------------------------------
      # Exhausted, and gated on the consumer being real.
      #
      # Activity = any gateway request in 7 days, 403s included: an exhausted
      # consumer never reaches the engine, so engine records cannot show it.
      #
      # The activity guard matters: a seeded-but-parked consumer sitting at 0 is
      # not an incident, and would otherwise fire forever — the exact failure
      # that made GpuMemoryPressure and the apiserver job worthless.
      #
      # Overdraft is included by using <= 0 rather than == 0: ai-quota gates on
      # > 0 and decrements AFTER the response, so a consumer with one token left
      # can spend a whole request and go negative.
      # -----------------------------------------------------------------------
      - alert: ConsumerQuotaExhausted
        expr: |
          sum by (ai_consumer) (consumer:quota_balance:tokens) <= 0
          and on(ai_consumer)
          sum by (ai_consumer) (
            label_replace(gateway_usage_requests{window="7d",consumer!="unauthenticated"},
                          "ai_consumer", "$1", "consumer", "(.+)")
          ) > 0
        for: 5m
        labels:
          severity: warning
          node: a100
        annotations:
          summary: "{{ $labels.ai_consumer }} is out of quota ({{ $value | humanize }} tokens)"
          description: >-
            Balance is at or below zero for an active consumer. Every request
            from them now returns 403. Top up with /topup in the bot.

      # -----------------------------------------------------------------------
      # Less than a day of headroom at the current rate — the point of having a
      # burn rate at all is to arrive before the wall, not at it.
      # -----------------------------------------------------------------------
      - alert: ConsumerQuotaLow
        expr: |
          consumer:quota_days_left < 1
          and on(ai_consumer) consumer:quota_spend:tokens24h > 0
          and on(ai_consumer) sum by (ai_consumer) (consumer:quota_balance:tokens) > 0
        for: 15m
        labels:
          severity: warning
          node: a100
        annotations:
          summary: "{{ $labels.ai_consumer }} has under a day of quota left"
          description: >-
            At the last 24h burn rate this consumer runs out within a day.
            The burn rate is the exact sum of tokens the engine processed for
            this consumer in the last 24 hours.

  # ---------------------------------------------------------------------------
  # Serving health — the two failures of 2026-09-16, made visible (2026-09-17).
  #
  # 11:11-11:58: both replicas held 3-7 queued requests behind one request whose
  # client had already left (docs: orphaned-requests; fixed in 40bbd57).
  # 14:20-14:28: r1 held a 61K+32K-token request plus 1-2 queued turns of the
  # same session while r0 sat idle. cache_aware pins a session to the replica
  # holding its prefix and only rebalances when the router's in-flight counts
  # differ by MORE than --balance-abs-threshold (2), so a gap of 2 never moved
  # anything. Four clients gave up after 155-240 s. tuning/docs/ROUTING.md has
  # the measurement (76 min in the week before, 54 of them with the other
  # replica fully idle).
  #
  # 15s, the default: the engine gauges are scraped every 5s and these
  # episodes are minutes long, so a coarser interval would blur the minute
  # count the bot reports.
  # ---------------------------------------------------------------------------
  - name: serving
    interval: 15s
    rules:
      # 1 while at least one replica has a queue and another replica has no
      # queue and a free running slot; 0 otherwise (always present, so
      # sum_over_time(...[24h]) * 15 / 60 is "minutes stranded" in the bot).
      #
      # "Free slot" is num_running_reqs < 4, i.e. --max-running-requests in
      # docker-compose.yml, which the engine does not export. KEEP IN STEP.
      # It says nothing about KV room, so a stranded minute is "routing could
      # have tried the other replica", not proof the request would have fit.
      - record: node:engine_queue_stranded:bool
        expr: |
          clamp_max(
            count(sglang:num_queue_reqs{job="sglang-workers"} > 0)
            and on()
            count(
              (sglang:num_queue_reqs{job="sglang-workers"} == 0)
              and on(instance)
              (sglang:num_running_reqs{job="sglang-workers"} < 4)
            ),
            1)
          or on() vector(0)

      - alert: EngineQueueStrandedOnOneReplica
        expr: node:engine_queue_stranded:bool == 1
        for: 2m
        labels:
          severity: warning
          node: a100
        annotations:
          summary: "Requests queued on one replica while the other has room"
          description: >-
            For 2 minutes one replica has had a queue while the other had no
            queue and a free slot. This is cache_aware routing keeping a session
            on the replica that holds its prefix: the router balances only on
            its own in-flight request counts, not on KV use or queue length.
            Queued clients may give up (see GatewayClientsLeavingBeforeReply).
            The bot's /errors shows the minutes; tuning/docs/ROUTING.md has the
            options.

      # A queue that has not emptied once in 10 minutes. Under a genuine burst
      # both replicas are full and it drains within minutes; on 2026-09-16 it
      # did not drain for 5-20 minutes because the running request was an
      # orphan. The 1m min_over_time sees every 5s scrape between two 15s
      # evaluations, so one momentary empty sample resets `for`. (A 10m
      # min_over_time with a short `for` fires a minute after a restart: the
      # range holds only the samples that exist.)
      - alert: EngineQueueNotDraining
        expr: min_over_time(sglang:num_queue_reqs{job="sglang-workers"}[1m]) > 0
        for: 10m
        labels:
          severity: warning
          node: a100
        annotations:
          summary: "{{ $labels.instance }} has had a queue for over 10 minutes"
          description: >-
            {{ $labels.instance }} has not had an empty queue for 10 minutes
            (now {{ $value }} waiting at the low point). Check whether the
            running requests still have clients: grep the replica log for
            "but the state was deleted in TokenizerManager". /health shows the
            queues.

      # The gateway gauges below are exact counts over the LAST HOUR, refreshed
      # every minute (job engine-usage). An alert therefore stays firing for up
      # to an hour after the last bad request; that is the price of counting
      # from the access log rather than from resettable counters.
      #
      # Threshold 8: the week before 2026-09-17 had 0-5 such requests in a
      # normal hour and 8, 16 and 69 in the three bad ones.
      - alert: GatewayClientsLeavingBeforeReply
        expr: |
          sum by (consumer) (gateway_usage_error_requests{window="1h",cause="left_before_reply"}) >= 8
        for: 2m
        labels:
          severity: warning
          node: a100
        annotations:
          summary: "{{ $labels.consumer }}: {{ $value }} requests abandoned before any reply in the last hour"
          description: >-
            The client closed the connection before the first byte, which on
            this node means it waited in a queue or in a long prefill and gave
            up. Look for EngineQueueStrandedOnOneReplica or
            EngineQueueNotDraining at the same time. /errors {{ $labels.consumer }}
            in the bot lists the requests.

      - alert: GatewayTimeouts
        expr: |
          sum by (consumer) (gateway_usage_error_requests{window="1h",cause="timeout"}) > 0
        for: 1m
        labels:
          severity: warning
          node: a100
        annotations:
          summary: "{{ $labels.consumer }}: {{ $value }} gateway timeouts (504/408) in the last hour"
          description: >-
            The gateway gave up on a request. The stream idle timeout is 900 s
            since 2026-09-16 (was 180 s), equal to the router's
            --request-timeout-secs, so a timeout now means a request produced
            nothing for 15 minutes.

      - alert: GatewayServerErrors
        expr: |
          sum by (consumer) (gateway_usage_error_requests{window="1h",cause="server_error"}) >= 3
        for: 1m
        labels:
          severity: warning
          node: a100
        annotations:
          summary: "{{ $labels.consumer }}: {{ $value }} server errors (5xx) in the last hour"
          description: >-
            502/503 or another 5xx from the gateway, router or engine. /errors
            {{ $labels.consumer }} lists them with request ids for /trace.

      # -----------------------------------------------------------------------
      # Router circuit breakers (2026-09-21, after the 2026-09-20 incident:
      # docs/INCIDENT-2026-09-20-IMAGE-TOKEN-CASCADE.md).
      #
      # Nothing watched these, which is the only reason a replica sat out of
      # rotation from 19:36 until the next morning with no one noticing. The
      # breaker is per worker; smg_worker_cb_state is 0 closed, 1 open,
      # 2 half_open. A worker whose breaker is open gets NO traffic, and on a
      # two-replica node that is half the capacity gone.
      #
      # These say nothing about worker health: a breaker opens on failures the
      # router saw, which may be the worker's fault or the request's. A
      # deterministic 500 (a malformed prompt) trips every replica in turn
      # while all of them are perfectly healthy.
      # -----------------------------------------------------------------------
      - alert: RouterAllCircuitsOpen
        expr: |
          count(smg_worker_cb_state == 1) == count(smg_worker_cb_state)
        for: 1m
        labels:
          severity: critical
          node: a100
        annotations:
          summary: "Router: every worker's circuit breaker is open — serving is down"
          description: >-
            The router has no worker it will send to and is answering 503
            no_available_workers. Check whether the workers are actually sick
            (docker logs on each engine) before restarting anything: a request
            that fails identically on every replica opens every breaker while
            the engines are healthy and idle. Breakers half-open 60 s after the
            last failure and close on the first success, so this clears itself
            once the failing client stops.
      - alert: RouterWorkerCircuitOpen
        expr: |
          smg_worker_cb_state == 1
        for: 2m
        labels:
          severity: warning
          node: a100
        annotations:
          summary: "{{ $labels.worker }}: circuit breaker open, taking no traffic"
          description: >-
            This worker is excluded from routing, so the node is serving on
            what is left. Ten failures in a 120 s window open a breaker.
            Engine logs for that replica say whether it is really failing.
      - alert: RouterWorkerCircuitHalfOpen
        expr: |
          smg_worker_cb_state == 2
        for: 30m
        labels:
          severity: warning
          node: a100
        annotations:
          summary: "{{ $labels.worker }}: circuit breaker stuck half-open for 30m"
          description: >-
            Half-open is a normal state for seconds, not half an hour. It
            admits probes only and closes on the first success, so being stuck
            here means the policy is not sending this worker any traffic to
            probe with — cache_aware prefers whichever replica is warm, which
            is exactly how r0 stayed out for 10 h on 2026-09-20. Re-register it
            to reset: GET /workers, DELETE /workers/<id>, POST /workers (this
            is what deploy/roll-replica.sh does). Do not restart the router;
            that drops in-flight requests on every replica.

  # ---------------------------------------------------------------------------
  # Unauthenticated traffic (2026-09-17).
  #
  # Both shared-key hostnames take bursts of ~280 wrong-key requests an hour,
  # at the same hours (7 days to 2026-09-17: 12 bursts on the model hostname,
  # 9 on the embedder's; a normal hour has 0-14). The existing
  # EdgeAuthRejectionRate needs 0.2/s for 10 minutes and never saw them.
  # Caddy now access-logs both sites, so `docker logs` on Caddy names the
  # source; the gateway's own 401s carry client_ip in gateway.requests and the
  # bot's `/errors unauthenticated` lists them.
  #
  # ANSWERED 2026-09-21, and the rule was wrong. The access log showed the
  # bursts are commodity path scanning: one source sweeping ~274 distinct
  # secret-file paths (.env and friends) with GET, at both hostnames, with
  # rotating user agents. Every request is refused in ~80us and nothing is
  # reachable. They are counted as "wrong key" only because the site's auth
  # gate runs BEFORE the path gate, so a probe of an unknown path never gets
  # as far as the 404 and is recorded as a 401.
  #
  # The metric has no path label (code/handler/host/instance/job/method/node/
  # server), so the rule cannot tell a scanner from a client. `method` can:
  # the scanner GETs, and every API a real client calls on these hostnames is
  # a POST. Over the 17 days to 2026-09-21 the unfiltered rule crossed its
  # threshold on 11 days; filtered to POST, on 1 — the one real stale-key
  # client (306 bad POSTs in an hour on the model hostname, 2026-09-18 08:20
  # UTC), which had been indistinguishable from the noise.
  #
  # Threshold is 5, not 100, deliberately: a stale-key cron or a mis-configured
  # client may only manage a handful an hour, and at 100 it would never be
  # seen. The cost is that low-volume scanner POSTs still get through — 8
  # episodes on 3 of those 17 days. They are easy to recognise; see the alert
  # description.
  #
  # NOT covered, on purpose: a stale-key client that only calls /v1/models,
  # which is a GET. It burns no capacity, so it is not worth the noise.
  # ---------------------------------------------------------------------------
  - name: edge-auth
    rules:
      - alert: EdgeWrongKeyBurst
        expr: |
          sum by (host) (increase(caddy_http_request_duration_seconds_count{code="401",host!="_other",method="POST"}[1h])) > 5
        for: 5m
        labels:
          severity: warning
          node: a100
        annotations:
          summary: "{{ $labels.host }}: {{ $value | printf \"%.0f\" }} wrong-key API calls in the last hour"
          description: >-
            A client is POSTing a bad key at {{ $labels.host }}. POST-only on
            purpose: GET 401s here are path scanners probing for .env files,
            which are refused before routing and need no action. Tell them
            apart before digging — a scanner fires at BOTH shared-key hostnames
            in the same minute with a low count, a real stale-key client hits
            one hostname and keeps going. Find it with docker logs on the Caddy
            container filtered to this host and status 401; the client_ip is in
            each line. For the gateway hostname, /errors unauthenticated in the
            bot lists them. Caddy logs only to stdout, so recreating the
            container loses the evidence — look before rolling anything.

      - alert: GatewayWrongKeyBurst
        expr: |
          sum(gateway_usage_error_requests{window="1h",consumer="unauthenticated",cause="no_key"}) > 50
        for: 2m
        labels:
          severity: warning
          node: a100
        annotations:
          summary: "Gateway: {{ $value }} requests with a bad or missing key in the last hour"
          description: >-
            Per-key gateway hostname. /errors unauthenticated in the bot lists
            the requests with the client address.
