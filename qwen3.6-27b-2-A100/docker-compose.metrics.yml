# =============================================================================
# OBSERVABILITY OVERLAY — qwen36-27b A100 node
# Prometheus + Grafana + NVIDIA DCGM Exporter
#
# Usage — ALWAYS both files, one compose project:
#   docker compose -f docker-compose.yml -f compose.metrics.yml up -d
#
# Rationale:
#   - Same project as the inference tier. This removes the known hazard of
#     observability containers living in a separate compose project and
#     being deleted by `--remove-orphans` from the other side.
#   - If a standalone dcgm-exporter / prometheus already runs on this host
#     from another project, retire it first and let this overlay own it.
#
# Access model:
#   - No externally published ports. Prometheus and Grafana bind to
#     127.0.0.1 on the host only. Reach them over an SSH tunnel:
#       ssh -L 3000:127.0.0.1:3000 -L 9090:127.0.0.1:9090 <host>
#
# Network:
#   - Written against the segmented layout (qwen36-27b-backend).
#   - If you have NOT applied the network split yet, replace every
#     `qwen36-27b-backend` below with `qwen36-27b-a100-network`.
#
# Image pinning:
#   - All three images are pinned tag@digest. The digests are the ones that
#     were running when they were pinned, so this freezes a known-good state
#     rather than adopting whatever `latest` resolves to on the next `up`.
#     Docker resolves by digest and treats the tag as documentation.
#   - To move one forward deliberately:
#       docker pull <image:newtag>
#       docker inspect --format='{{index .RepoDigests 0}}' <image:newtag>
#     then update BOTH halves here.
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Prometheus — scrapes both SGLang workers, the router, and DCGM.
  # Scrape config lives in ./prometheus/prometheus.yml
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v3.13.1@sha256:3c42b892cf723fa54d2f262c37a0e1f80aa8c8ddb1da7b9b0df9455a35a7f893
    container_name: qwen36-27b-prometheus

    # Observability CPU load is in the noise; park it on the NUMA-node-1
    # tail cores (shared with TEI) and keep worker cores 0-47 clean.
    cpuset: "48-55"

    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
      # Second retention bound, on size. `retention.time` alone is open-ended
      # in bytes: a cardinality mistake — a new label with unbounded values —
      # fills the disk long before 30 days elapse. Whichever limit trips first
      # wins. 20 GiB is generous against the current ~5k series.
      - --storage.tsdb.retention.size=20GB
      - --web.listen-address=0.0.0.0:9090
      # Lets `curl -X POST http://127.0.0.1:9090/-/reload` apply scrape and
      # rule changes in place. Without it, editing prometheus.yml means either
      # SIGHUP via docker or recreating the container, and recreating is what
      # people reach for — losing the WAL-backed head block for no reason.
      # Safe here: the listener is loopback-bound and the admin API (which can
      # delete series) stays off.
      - --web.enable-lifecycle

    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    # The DIRECTORY is mounted, not the two files individually — and that
    # distinction is load-bearing, not cosmetic.
    #
    # A single-file bind mount resolves to an inode at container start. Most
    # editors (and sed -i, and any write-to-temp-then-rename) replace the file
    # rather than truncating it, which leaves the container bound to the old,
    # now-unlinked inode. The host file changes; the container never sees it.
    #
    # That failure is silent and actively misleading: `curl -X POST /-/reload`
    # returns 200 and prometheus_config_last_reload_successful stays 1, because
    # Prometheus really did reload — the stale file it can see. Hit here while
    # adding the edge/tracing/storage rule groups: promtool validated 17 rules
    # on the host while the container kept evaluating the original 6.
    #
    # Mounting the directory removes the class of bug entirely: lookups go
    # through the live directory entry, so renames are picked up.
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus

    # Loopback bind only — not reachable from outside the host.
    ports:
      - "127.0.0.1:9090:9090"

    restart: unless-stopped

    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

    # Prometheus joins `edge` in ADDITION to the backend network, purely to
    # scrape Caddy's :2020 metrics site. Caddy cannot be pulled onto the
    # backend network instead: that would let the internet-facing proxy reach
    # the worker ports and ZMQ sockets, which is exactly the lateral-movement
    # path the network split was created to close (see docs/ARCHITECTURE.md).
    #
    # This direction is the safe one. Scrapes are outbound from Prometheus,
    # and the edge members it becomes reachable to — Caddy and the TEI
    # embedder — are both fixed-upstream proxies with no fetch primitive an
    # attacker could aim at :9090.
    networks:
      - qwen36-27b-backend
      - edge

  # ---------------------------------------------------------------------------
  # Node Exporter — host-level hardware telemetry on :9100
  # (CPU, RAM, swap, disk space, disk I/O, network I/O, load, file descriptors)
  # Runs on the loopback + backend network only; Prometheus scrapes it there.
  # ---------------------------------------------------------------------------
  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: qwen36-27b-node-exporter

    cpuset: "48-55"

    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host
      # Ignore bind-mount noise; keep only real filesystems in disk panels.
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|run)(/|$)
      - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tmpfs|tracefs)$

    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro,rslave

    expose:
      - "9100"

    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9100/metrics || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    restart: unless-stopped

    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

    networks:
      - qwen36-27b-backend

  # ---------------------------------------------------------------------------
  # NVIDIA DCGM Exporter — per-GPU telemetry on :9400
  # (utilisation, memory, SM clocks, throttling, XID errors, NVLink/PCIe)
  # ---------------------------------------------------------------------------
  dcgm-exporter:
    # NOTE: this digest is a February 2022 image. NVIDIA stopped publishing
    # `latest` on NGC, so the tag has been frozen there for years — which is
    # also why the bundled dcp-metrics-included.csv predates SM_ACTIVE and
    # SM_OCCUPANCY and why the custom counter file below exists. Pinning the
    # digest at least makes that explicit instead of implying it is current.
    # Moving to a real versioned NGC tag (X.Y.Z-A.B.C-ubuntu22.04) is a
    # worthwhile upgrade, but it changes GPU profiling behaviour under
    # SYS_ADMIN on a live serving node, so it belongs in its own change.
    image: nvcr.io/nvidia/k8s/dcgm-exporter@sha256:a1d913783fd185d78ed8b725334f75adc86eb594afe82961a73aa63c5d0ef423
    container_name: qwen36-27b-dcgm

    cpuset: "48-55"

    # SYS_ADMIN is required for the DCP/profiling metric groups
    # (e.g. SM occupancy, tensor-core activity). Drop it if you only
    # need the basic utilisation/memory/power set.
    cap_add:
      - SYS_ADMIN

    # -------------------------------------------------------------------
    # Custom counter set, added 2026-07-31 for the kernel-tuning campaign.
    #
    # Until now this exporter ran on the image default counter file, which
    # exposes ONLY DCGM_FI_DEV_* fields — 19 of them, none from the DCP
    # profiling group. That means the stack could report power, clocks and
    # framebuffer, but could NOT report SM occupancy, memory-interface
    # activity, or tensor-pipe activity: precisely the three things the
    # tuning work needs. DCGM_FI_DEV_GPU_UTIL is sample-based and reads
    # ~100% under any load, so it answers nothing.
    #
    # The image's bundled dcp-metrics-included.csv is also insufficient —
    # it is dated Feb 2022 and omits SM_ACTIVE (1002) and SM_OCCUPANCY
    # (1003). Hence the custom file. See its header for the CUPTI/nsys
    # counter-contention warning, which matters before any profiling run.
    # -------------------------------------------------------------------
    volumes:
      - ./tuning/prometheus/dcgm-counters.csv:/etc/dcgm-exporter/tuning-counters.csv:ro

    command:
      - -f
      - /etc/dcgm-exporter/tuning-counters.csv
      # Collection interval in ms. Default 30000 is far coarser than a
      # benchmark rung (3-10 s) and would return one sample per run, or
      # none. 1000 ms costs nothing measurable on a 108-SM part.
      - --collect-interval
      - "1000"

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0", "1"]   # both A100s
              capabilities: [gpu]

    # Internal-only; Prometheus scrapes it over the Docker network.
    expose:
      - "9400"

    restart: unless-stopped

    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

    networks:
      - qwen36-27b-backend

  # ---------------------------------------------------------------------------
  # Grafana — dashboards; datasource auto-provisioned from
  # ./grafana/provisioning/datasources/datasources.yml
  #
  # Add to .env:
  #   GRAFANA_ADMIN_USER=...
  #   GRAFANA_ADMIN_PASSWORD=...
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana-oss:13.0.2@sha256:5dad0df181cb644a14e13617b913b261a54f7d4fd4510721dba420929f35bea2
    container_name: qwen36-27b-grafana

    cpuset: "48-55"

    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:?set GRAFANA_ADMIN_USER in .env}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      - GF_USERS_ALLOW_SIGN_UP=false
      # ---- production hardening -------------------------------------------------
      - GF_USERS_ALLOW_ORG_CREATE=false
      - GF_USERS_AUTO_ASSIGN_ORG=true
      - GF_USERS_AUTO_ASSIGN_ORG_ROLE=Viewer
      # STAYS FALSE, and this is load-bearing now. Anonymous viewing was
      # considered while Grafana was loopback-only; with the public hostname
      # below it would publish per-consumer token usage — customer names and
      # what they spend — to anyone who found the URL. Login required.
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_AUTH_BASIC_ENABLED=true
      - GF_AUTH_DISABLE_LOGIN_FORM=false
      - GF_SECURITY_DISABLE_GRAVATAR=true
      # Grafana is published over HTTPS (see the Caddyfile), so the session
      # cookie can and must be Secure.
      #
      # CONSEQUENCE: logging in over the old http://localhost:3000 tunnel no
      # longer works — a browser will not send a Secure cookie over plain HTTP.
      # Use the public hostname. The loopback port stays published because
      # curl/API access with basic auth is unaffected.
      - GF_SECURITY_COOKIE_SECURE=true
      # none + Secure is what lets the Higress console iframe a dashboard from
      # a different origin. Only valid because Grafana is HTTPS; browsers
      # reject SameSite=None without Secure.
      - GF_SECURITY_COOKIE_SAMESITE=none
      # Drops `X-Frame-Options: deny`, which was verified on the wire to be
      # exactly what Firefox refused when framing a dashboard.
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_SERVER_ENFORCE_DOMAIN=false
      # Must match the public URL, or Grafana builds redirects, share links and
      # alert notification URLs pointing at localhost.
      - GF_SERVER_ROOT_URL=https://qw38-27b-grafana.duckdns.org
      - GF_SERVER_READ_TIMEOUT=60
      - GF_SERVER_WRITE_TIMEOUT=60
      - GF_SNAPSHOTS_EXTERNAL_ENABLED=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES=false
      - GF_ALERTING_ENABLED=true
      - GF_UNIFIED_ALERTING_ENABLED=true
      - GF_UNIFIED_ALERTING_DEFAULT_EVALUATION_INTERVAL=15s
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/provisioning/dashboards/overview/qwen36-27b-overview.json
      - GF_LOG_LEVEL=info
      - GF_LOG_MODE=console
      - GF_USERS_DEFAULT_THEME=dark

    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/provisioning/alerting:/etc/grafana/provisioning/alerting:ro
      - ./grafana/provisioning/plugins:/etc/grafana/provisioning/plugins:ro

    # Loopback bind only — SSH tunnel access.
    ports:
      - "127.0.0.1:3000:3000"

    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

    # service_healthy, not the bare list form. Grafana provisions its alert
    # rules against the Prometheus datasource at boot; if Prometheus is merely
    # *started* and not yet serving, those rules land in an error state that
    # persists until someone notices and reloads them.
    depends_on:
      prometheus:
        condition: service_healthy

    restart: unless-stopped

    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

    networks:
      # backend: reach Prometheus and ClickHouse.
      # edge: so Caddy can proxy the public HTTPS site for
      #   qw38-27b-grafana.duckdns.org. Caddy lives on `edge` only — it must
      #   never be able to reach a worker — so the service being fronted has to
      #   come to it, not the reverse.
      - qwen36-27b-backend
      - edge

networks:
  # Declared here so the Prometheus service above can attach to it. Created
  # once outside compose (`docker network create edge`) and shared with the
  # embedder project, hence external.
  edge:
    name: edge
    external: true

volumes:
  prometheus_data:
  grafana_data:
