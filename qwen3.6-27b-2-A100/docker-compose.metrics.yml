# =============================================================================
# OBSERVABILITY OVERLAY — qwen36-27b A100 node
# Prometheus + Grafana + NVIDIA DCGM Exporter
#
# Usage — ALWAYS both files, one compose project:
#   docker compose -f docker-compose.yml -f compose.metrics.yml up -d
#
# Rationale:
#   - Same project as the inference tier. This removes the known hazard of
#     observability containers living in a separate compose project and
#     being deleted by `--remove-orphans` from the other side.
#   - If a standalone dcgm-exporter / prometheus already runs on this host
#     from another project, retire it first and let this overlay own it.
#
# Access model:
#   - No externally published ports. Prometheus and Grafana bind to
#     127.0.0.1 on the host only. Reach them over an SSH tunnel:
#       ssh -L 3000:127.0.0.1:3000 -L 9090:127.0.0.1:9090 <host>
#
# Network:
#   - Written against the segmented layout (qwen36-27b-backend).
#   - If you have NOT applied the network split yet, replace every
#     `qwen36-27b-backend` below with `qwen36-27b-a100-network`.
#
# Image pinning:
#   - All three images are pinned tag@digest. The digests are the ones that
#     were running when they were pinned, so this freezes a known-good state
#     rather than adopting whatever `latest` resolves to on the next `up`.
#     Docker resolves by digest and treats the tag as documentation.
#   - To move one forward deliberately:
#       docker pull <image:newtag>
#       docker inspect --format='{{index .RepoDigests 0}}' <image:newtag>
#     then update BOTH halves here.
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Prometheus — scrapes both SGLang workers, the router, and DCGM.
  # Scrape config lives in ./prometheus/prometheus.yml
  # ---------------------------------------------------------------------------
  prometheus:
    # v3.13.1 -> v3.14.0 on 2026-09-04. Carries the sanitize-html bump for
    # CVE-2026-44990 (stored XSS via a disallowed `xmp` element). Exposure here
    # was low — the UI binds 127.0.0.1 and is reached over an SSH tunnel — but
    # the fix is free and the TSDB is untouched by the upgrade.
    image: prom/prometheus:v3.14.0@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0
    container_name: qwen36-27b-prometheus

    # Observability CPU load is in the noise; park it on the NUMA-node-1
    # tail cores (shared with TEI) and keep worker cores 0-47 clean.
    cpuset: "48-55"

    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
      # Second retention bound, on size. `retention.time` alone is open-ended
      # in bytes: a cardinality mistake — a new label with unbounded values —
      # fills the disk long before 30 days elapse. Whichever limit trips first
      # wins. 20 GiB is generous against the current ~5k series.
      - --storage.tsdb.retention.size=20GB
      - --web.listen-address=0.0.0.0:9090
      # Lets `curl -X POST http://127.0.0.1:9090/-/reload` apply scrape and
      # rule changes in place. Without it, editing prometheus.yml means either
      # SIGHUP via docker or recreating the container, and recreating is what
      # people reach for — losing the WAL-backed head block for no reason.
      # Safe here: the listener is loopback-bound and the admin API (which can
      # delete series) stays off.
      - --web.enable-lifecycle

    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    # The DIRECTORY is mounted, not the two files individually — and that
    # distinction is load-bearing, not cosmetic.
    #
    # A single-file bind mount resolves to an inode at container start. Most
    # editors (and sed -i, and any write-to-temp-then-rename) replace the file
    # rather than truncating it, which leaves the container bound to the old,
    # now-unlinked inode. The host file changes; the container never sees it.
    #
    # That failure is silent and actively misleading: `curl -X POST /-/reload`
    # returns 200 and prometheus_config_last_reload_successful stays 1, because
    # Prometheus really did reload — the stale file it can see. Hit here while
    # adding the edge/tracing/storage rule groups: promtool validated 17 rules
    # on the host while the container kept evaluating the original 6.
    #
    # Mounting the directory removes the class of bug entirely: lookups go
    # through the live directory entry, so renames are picked up.
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus

    # Loopback bind only — not reachable from outside the host.
    ports:
      - "127.0.0.1:9090:9090"

    restart: unless-stopped

    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

    # Prometheus joins `edge` in ADDITION to the backend network, purely to
    # scrape Caddy's :2020 metrics site. Caddy cannot be pulled onto the
    # backend network instead: that would let the internet-facing proxy reach
    # the worker ports and ZMQ sockets, which is exactly the lateral-movement
    # path the network split was created to close (see docs/ARCHITECTURE.md).
    #
    # This direction is the safe one. Scrapes are outbound from Prometheus,
    # and the edge members it becomes reachable to — Caddy and the TEI
    # embedder — are both fixed-upstream proxies with no fetch primitive an
    # attacker could aim at :9090.
    networks:
      - qwen36-27b-backend
      - edge
      # higress-net: the Higress control plane (apiserver, pilot) is reachable
      # only here — the gateway is on `edge`, but the components that decide
      # what the gateway does are not. Without this, the entire control plane
      # is unmonitored: config-push latency, xDS rejections and apiserver
      # request errors are exactly the failures that make the data plane serve
      # stale or missing routes while every gateway metric still looks fine.
      #
      # Prometheus joins them rather than exposing them on `edge`, because
      # `edge` carries Caddy, an internet-facing process. Widening the control
      # plane's reach to the network with the public front door would be the
      # wrong direction.
      #
      # (An earlier version of this comment said the apiserver accepts
      # unauthenticated requests. That stopped being true on 2026-09-03 when
      # --auth-enabled landed, and the apiserver job was removed on 2026-09-04
      # because it can only be scraped with a cluster-admin certificate. pilot
      # is still scraped from here and is the job that matters.)
      - higress-net

      # higressint: higress-redis and the redis-exporter that reads the quota
      # ledger. Same direction again — the exporter stays single-homed and
      # Prometheus reaches in.
      - higressint

  # ---------------------------------------------------------------------------
  # Node Exporter — host-level hardware telemetry on :9100
  # (CPU, RAM, swap, disk space, disk I/O, network I/O, load, file descriptors)
  # Runs on the loopback + backend network only; Prometheus scrapes it there.
  # ---------------------------------------------------------------------------
  node-exporter:
    # Digest added 2026-09-04. v1.12.1 is current; the tag alone still allowed
    # a rebuild to move under us.
    image: prom/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    container_name: qwen36-27b-node-exporter

    cpuset: "48-55"

    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host
      # Ignore bind-mount noise; keep only real filesystems in disk panels.
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|run)(/|$)
      - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tmpfs|tracefs)$

    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro,rslave

    expose:
      - "9100"

    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9100/metrics || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    restart: unless-stopped

    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

    networks:
      - qwen36-27b-backend

  # ---------------------------------------------------------------------------
  # NVIDIA DCGM Exporter — per-GPU telemetry on :9400
  # (utilisation, memory, SM clocks, throttling, XID errors, NVLink/PCIe)
  # ---------------------------------------------------------------------------
  dcgm-exporter:
    # NOTE: this digest is a February 2022 image. NVIDIA stopped publishing
    # `latest` on NGC, so the tag has been frozen there for years — which is
    # also why the bundled dcp-metrics-included.csv predates SM_ACTIVE and
    # SM_OCCUPANCY and why the custom counter file below exists. Pinning the
    # digest at least makes that explicit instead of implying it is current.
    # Moving to a real versioned NGC tag (X.Y.Z-A.B.C-ubuntu22.04) is a
    # worthwhile upgrade, but it changes GPU profiling behaviour under
    # SYS_ADMIN on a live serving node, so it belongs in its own change.
    image: nvcr.io/nvidia/k8s/dcgm-exporter@sha256:a1d913783fd185d78ed8b725334f75adc86eb594afe82961a73aa63c5d0ef423
    container_name: qwen36-27b-dcgm

    cpuset: "48-55"

    # SYS_ADMIN is required for the DCP/profiling metric groups
    # (e.g. SM occupancy, tensor-core activity). Drop it if you only
    # need the basic utilisation/memory/power set.
    cap_add:
      - SYS_ADMIN

    # -------------------------------------------------------------------
    # Custom counter set, added 2026-07-31 for the kernel-tuning campaign.
    #
    # Until now this exporter ran on the image default counter file, which
    # exposes ONLY DCGM_FI_DEV_* fields — 19 of them, none from the DCP
    # profiling group. That means the stack could report power, clocks and
    # framebuffer, but could NOT report SM occupancy, memory-interface
    # activity, or tensor-pipe activity: precisely the three things the
    # tuning work needs. DCGM_FI_DEV_GPU_UTIL is sample-based and reads
    # ~100% under any load, so it answers nothing.
    #
    # The image's bundled dcp-metrics-included.csv is also insufficient —
    # it is dated Feb 2022 and omits SM_ACTIVE (1002) and SM_OCCUPANCY
    # (1003). Hence the custom file. See its header for the CUPTI/nsys
    # counter-contention warning, which matters before any profiling run.
    # -------------------------------------------------------------------
    volumes:
      - ./tuning/prometheus/dcgm-counters.csv:/etc/dcgm-exporter/tuning-counters.csv:ro

    command:
      - -f
      - /etc/dcgm-exporter/tuning-counters.csv
      # Collection interval in ms. Default 30000 is far coarser than a
      # benchmark rung (3-10 s) and would return one sample per run, or
      # none. 1000 ms costs nothing measurable on a 108-SM part.
      - --collect-interval
      - "1000"

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0", "1"]   # both A100s
              capabilities: [gpu]

    # Internal-only; Prometheus scrapes it over the Docker network.
    expose:
      - "9400"

    restart: unless-stopped

    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

    networks:
      - qwen36-27b-backend

  # ---------------------------------------------------------------------------
  # Grafana — dashboards; datasource auto-provisioned from
  # ./grafana/provisioning/datasources/datasources.yml
  #
  # Add to .env:
  #   GRAFANA_ADMIN_USER=...
  #   GRAFANA_ADMIN_PASSWORD=...
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana-oss:13.0.2@sha256:5dad0df181cb644a14e13617b913b261a54f7d4fd4510721dba420929f35bea2
    container_name: qwen36-27b-grafana

    cpuset: "48-55"

    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:?set GRAFANA_ADMIN_USER in .env}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      - GF_USERS_ALLOW_SIGN_UP=false
      # ---- production hardening -------------------------------------------------
      - GF_USERS_ALLOW_ORG_CREATE=false
      - GF_USERS_AUTO_ASSIGN_ORG=true
      - GF_USERS_AUTO_ASSIGN_ORG_ROLE=Viewer
      # STAYS FALSE, and this is load-bearing now. Anonymous viewing was
      # considered while Grafana was loopback-only; with the public hostname
      # below it would publish per-consumer token usage — customer names and
      # what they spend — to anyone who found the URL. Login required.
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_AUTH_BASIC_ENABLED=true
      - GF_AUTH_DISABLE_LOGIN_FORM=false
      - GF_SECURITY_DISABLE_GRAVATAR=true
      # Grafana is published over HTTPS (see the Caddyfile), so the session
      # cookie can and must be Secure.
      #
      # CONSEQUENCE: logging in over the old http://localhost:3000 tunnel no
      # longer works — a browser will not send a Secure cookie over plain HTTP.
      # Use the public hostname. The loopback port stays published because
      # curl/API access with basic auth is unaffected.
      - GF_SECURITY_COOKIE_SECURE=true
      # none + Secure is what lets the Higress console iframe a dashboard from
      # a different origin. Only valid because Grafana is HTTPS; browsers
      # reject SameSite=None without Secure.
      - GF_SECURITY_COOKIE_SAMESITE=none
      # Drops `X-Frame-Options: deny`, which was verified on the wire to be
      # exactly what Firefox refused when framing a dashboard.
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_SERVER_ENFORCE_DOMAIN=false
      # Must match the public URL, or Grafana builds redirects, share links and
      # alert notification URLs pointing at localhost.
      - GF_SERVER_ROOT_URL=https://qw38-27b-grafana.duckdns.org
      - GF_SERVER_READ_TIMEOUT=60
      - GF_SERVER_WRITE_TIMEOUT=60
      - GF_SNAPSHOTS_EXTERNAL_ENABLED=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES=false
      - GF_ALERTING_ENABLED=true
      - GF_UNIFIED_ALERTING_ENABLED=true
      - GF_UNIFIED_ALERTING_DEFAULT_EVALUATION_INTERVAL=15s
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/provisioning/dashboards/overview/qwen36-27b-overview.json
      - GF_LOG_LEVEL=info
      - GF_LOG_MODE=console
      - GF_USERS_DEFAULT_THEME=dark

    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/provisioning/alerting:/etc/grafana/provisioning/alerting:ro
      - ./grafana/provisioning/plugins:/etc/grafana/provisioning/plugins:ro

    # Loopback bind only — SSH tunnel access.
    ports:
      - "127.0.0.1:3000:3000"

    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

    # service_healthy, not the bare list form. Grafana provisions its alert
    # rules against the Prometheus datasource at boot; if Prometheus is merely
    # *started* and not yet serving, those rules land in an error state that
    # persists until someone notices and reloads them.
    depends_on:
      prometheus:
        condition: service_healthy

    restart: unless-stopped

    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

    networks:
      # backend: reach Prometheus and ClickHouse.
      # edge: so Caddy can proxy the public HTTPS site for
      #   qw38-27b-grafana.duckdns.org. Caddy lives on `edge` only — it must
      #   never be able to reach a worker — so the service being fronted has to
      #   come to it, not the reverse.
      - qwen36-27b-backend
      - edge

  # ---------------------------------------------------------------------------
  # Vector — the gateway access log into the ClickHouse fact table.
  #
  # This is Stage B of the metrics plan: the piece that makes per-request usage
  # durable and attributable. The gateway already writes one JSON line per
  # request carrying consumer, request_id, model, tokens, status and duration;
  # nothing read it. Vector tails that file into gateway.requests.
  #
  # Why it cannot hurt serving: it reads a file the gateway has already finished
  # writing, holds no route to the workers, and if it stops the only consequence
  # is that the table stops growing. The gateway never waits on it.
  #
  # The log directory is mounted READ-ONLY. Rotation is logrotate's job (see
  # higress-standalone/logrotate.conf), driven from the user crontab, with
  # Envoy's /reopen_logs as the postrotate hook.
  # ---------------------------------------------------------------------------
  vector:
    image: timberio/vector:0.58.0-alpine@sha256:5dcf67db0ee378caa87f3395cb9484ebe3e97bb0334d119f2ac33116e00c5773
    container_name: qwen36-27b-vector

    cpuset: "48-55"

    environment:
      # The clickhouse user, not a dedicated one. That instance's admin user
      # lacks ACCESS MANAGEMENT, so minting a least-privilege INSERT-only user
      # needs an XML users.d file and a ClickHouse restart. Worth doing; not
      # worth a restart of the trace store today.
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:?set LANGFUSE_CLICKHOUSE_PASSWORD in .env}

    volumes:
      - ./vector:/etc/vector:ro
      # The gateway's log, owned by the higress compose project. Read-only:
      # Vector must never be able to truncate or delete the source of record.
      - ../higress-standalone/compose/volumes/gateway/log:/var/log/proxy:ro
      # Checkpoints AND the disk buffer. Must be a named volume, not tmpfs: a
      # checkpoint that does not survive a restart means re-reading the whole
      # file, and a buffer that does not survive means losing whatever was
      # queued during a ClickHouse outage.
      - vector_data:/var/lib/vector

    command:
      - --config=/etc/vector/vector.yaml

    # Documentation, not a requirement — Prometheus reaches this over the
    # backend network. 9598 is the per-consumer aggregate exporter; 8686 is
    # Vector's own GraphQL API, used by the healthcheck.
    expose:
      - "9598"
      - "8686"

    # NOT `vector top` — that is an interactive TUI and exits 74 with
    # "Terminal must be a teletype (TTY) to display a Vector dashboard" when
    # run by a healthcheck. It reported this container unhealthy for an hour
    # while it was ingesting perfectly, which is the same shape of mistake as
    # probing a distroless image with wget.
    #
    # The API's own /health returns {"ok":true} and the alpine image has
    # busybox wget, so this is a real probe.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8686/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    # Resilience, not ordering. ClickHouse being down is a buffered delay, not a
    # failure, so there is nothing to gate on.
    restart: unless-stopped

    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

    networks:
      - qwen36-27b-backend

  # ---------------------------------------------------------------------------
  # redis_exporter — puts the ai-quota LEDGER on a dashboard.
  #
  # The ledger is the billing record: ai-quota DECRBYs `chat_quota:<consumer>`
  # after each completion, and it is durable (appendonly) across restarts. The
  # Envoy ai-statistics counters are not — they are process-lifetime and reset
  # whenever the gateway restarts, which is why ./stats.sh prints both side by
  # side and labels which is which.
  #
  # Until now the ledger was reachable only through stats.sh and the bot, so
  # nothing could alert on it. ai-quota returns an identical 403 "No quota left"
  # for three different states — never seeded, exhausted, and Redis down — and a
  # balance gauge is what separates them at a glance.
  #
  # NETWORK: `higressint` only, where higress-redis lives. Prometheus joins that
  # network to scrape rather than this exporter joining Prometheus's — the same
  # direction used for the Caddy and Higress jobs, and for the same reason: the
  # component with the route to Redis stays put, and the scraper reaches in.
  #
  # --check-keys, not --check-single-keys: consumers are created and revoked
  # through the bot, so the key set changes and a glob is required. It costs a
  # SCAN per scrape, which upstream warns about for very large keyspaces; there
  # are four keys here.
  # ---------------------------------------------------------------------------
  redis-exporter:
    image: oliver006/redis_exporter:v1.90.0@sha256:a129504e65b87c54f79bc92f1afc403475e8ff646a3d7512de469904ceddf986
    container_name: qwen36-27b-redis-exporter

    cpuset: "48-55"

    command:
      - --redis.addr=redis://higress-redis:6379
      - --check-keys=chat_quota:*

    # No password: higress-redis runs without requirepass and is reachable only
    # on `higressint`. If that changes, use --redis.password-file rather than
    # putting a credential in this file.

    # No healthcheck, deliberately — the same reason as otel-collector below.
    # The image is built FROM scratch: no shell, no wget, so CMD-SHELL cannot
    # run and CMD has nothing to exec. (Tried it: the container ran fine while
    # reporting `unhealthy`, with "exec: wget: executable file not found".)
    #
    # `up{job="redis-ledger"}` is the equivalent signal and is already covered
    # by PrometheusTargetDown. It is also the better one here: the exporter
    # being alive while Redis is unreachable is the interesting case, and that
    # shows up as redis_up 0, which has its own alert.

    # Resilience, not ordering: if Redis is down this exporter stays up and
    # reports redis_up 0, which is the signal we want. It must never exit
    # because its target is unavailable.
    restart: unless-stopped

    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

    networks:
      - higressint

  # ---------------------------------------------------------------------------
  # Alertmanager — the delivery path that did not exist until 2026-09-04.
  #
  # Before this, Prometheus evaluated 17 rules and Grafana 7 more, and NOTHING
  # was ever notified: no `alerting:` block, no Alertmanager, no Grafana contact
  # point. A 14-hour Langfuse ingest outage passed unnoticed with the correct
  # alert firing throughout. Rules that fire into a UI nobody has open are not
  # monitoring.
  #
  # NETWORK: `edge` only, deliberately, and this is the whole reason it is not
  # on the backend with the rest of the metrics tier. Alertmanager has exactly
  # two conversations — Prometheus talks to it, it talks to quota-bot — and the
  # bot is on `edge`/`higress-net`/`higressint`, never the backend. Putting the
  # bot on the backend instead would hand an internet-reachable service a route
  # to the worker ports and ZMQ sockets, which is precisely the lateral-movement
  # path the network split closes. So Alertmanager comes to the bot. It ends up
  # with strictly less reach than Prometheus, which spans both networks.
  #
  # No host port. The web UI (silences, the alert list) is reachable over the
  # SSH tunnel through Prometheus's own network only if you add one; day-to-day
  # the surface is the Telegram group and `/alerts` in the bot.
  # ---------------------------------------------------------------------------
  alertmanager:
    image: quay.io/prometheus/alertmanager:v0.34.0@sha256:690c7b525f4367aa91f73e2f91c632206d32e97c6384bdbf2fb7a861b420340d
    container_name: qwen36-27b-alertmanager

    cpuset: "48-55"

    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      # Alertmanager builds silence and notification URLs from this. It has no
      # public site; this only has to be a stable, resolvable identity.
      - --web.external-url=http://qwen36-27b-alertmanager:9093

    # NOTE: there is no --web.enable-lifecycle here. That is a PROMETHEUS flag;
    # Alertmanager rejects it and crash-loops with "unknown long flag". A config
    # reload is `POST /-/reload` (or SIGHUP), which Alertmanager serves by
    # default with no flag at all.

    volumes:
      # DIRECTORY mount, not a file — see the header of alertmanager.yml for
      # the inode trap this avoids. The gitignored `webhook_secret` lands in
      # the same directory and is read via credentials_file.
      #
      # webhook_secret must be world-readable (644): this image runs as
      # `nobody`, so a 600 file owned by the operator is unreadable and the
      # container fails at config load. It is gitignored and lives on a
      # single-operator host.
      - ./alertmanager:/etc/alertmanager:ro
      - alertmanager_data:/alertmanager

    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:9093/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    # Resilience, not ordering: Alertmanager has no dependency worth gating on.
    # Prometheus retries delivery on its own, so an Alertmanager that starts
    # late loses nothing but the notifications for that window, and one that
    # starts early simply waits.
    restart: unless-stopped

    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

    networks:
      - edge

networks:
  # Declared here so the Prometheus service above can attach to it. Created
  # once outside compose (`docker network create edge`) and shared with the
  # embedder project, hence external.
  edge:
    name: edge
    external: true

  # Owned by the higress compose project; Prometheus is only ever a guest here.
  higress-net:
    name: higress_higress-net
    external: true

  # Carries higress-redis — the ai-quota ledger — and nothing else of ours.
  # Unowned external: the compose project that created it no longer exists, so
  # it is declared, never created, here. If it is ever removed, this stack and
  # the gateway both fail to start.
  higressint:
    name: higressint
    external: true

volumes:
  prometheus_data:
  grafana_data:
  # Vector's file checkpoints and its on-disk sink buffer.
  vector_data:
  # Notification log and silences. Persisted so a restart does not re-notify
  # everything currently firing, and does not silently drop active silences.
  alertmanager_data:
