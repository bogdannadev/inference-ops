# =============================================================================
# LANGFUSE OVERLAY — LLM application observability
# Postgres + Redis + ClickHouse + MinIO + Langfuse Web + Langfuse Worker
#                  + OpenTelemetry Collector (SGLang gRPC -> Langfuse HTTP)
#
# Usage — all three files, one compose project:
#   docker compose -f docker-compose.yml `
#                  -f docker-compose.metrics.yml `
#                  -f docker-compose.langfuse.yml up -d
#
# Access: SSH tunnel only. No published host ports beyond 127.0.0.1.
#   ssh -L 3001:127.0.0.1:3001 `
#       -L 3030:127.0.0.1:3030 `
#       -L 9092:127.0.0.1:9092 `
#       -L 9093:127.0.0.1:9093 <host>
#
# Port rationale (avoids conflicts with metrics overlay):
#   3000 -> Grafana          3001 -> Langfuse Web
#   9090 -> Prometheus       9092 -> MinIO API
#   9091 -> (free)           9093 -> MinIO Console
#
# Secrets: all LANGFUSE_* vars read from .env with :? fail-fast.
# Generate before first run:
#   LANGFUSE_POSTGRES_PASSWORD=$(openssl rand -base64 32)
#   LANGFUSE_CLICKHOUSE_PASSWORD=$(openssl rand -base64 32)
#   LANGFUSE_REDIS_PASSWORD=$(openssl rand -base64 32)
#   LANGFUSE_MINIO_PASSWORD=$(openssl rand -base64 32)
#   LANGFUSE_SALT=$(openssl rand -base64 32)
#   LANGFUSE_ENCRYPTION_KEY=$(openssl rand -hex 32)
#   LANGFUSE_NEXTAUTH_SECRET=$(openssl rand -base64 32)
#   LANGFUSE_INIT_USER_PASSWORD=$(openssl rand -base64 32)
#
# Timezone: Postgres and ClickHouse MUST run UTC. Non-UTC breaks queries.
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Postgres — OLTP: users, projects, API keys, prompts, scores metadata
  # ---------------------------------------------------------------------------
  langfuse-postgres:
    # Pinned 2026-09-04. `:17` floats across patch releases; harmless in
    # itself, but a Postgres container that silently changes version under a
    # live data directory is not a risk worth carrying for free. 18.6 exists and
    # is a MAJOR upgrade — it needs pg_upgrade, not an image swap.
    image: docker.io/postgres:17.10@sha256:7958605b474b3d264a969cb3a123d6aa00ad1e1fe9da8a69984dabb704d93317
    container_name: qwen36-27b-langfuse-postgres

    cpuset: "48-55"

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${LANGFUSE_POSTGRES_PASSWORD:?set LANGFUSE_POSTGRES_PASSWORD in .env}
      POSTGRES_DB: postgres
      TZ: UTC
      PGTZ: UTC

    volumes:
      - ./langfuse-data/postgres:/var/lib/postgresql/data

    ports:
      - "127.0.0.1:5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10

    restart: unless-stopped

    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

    networks:
      - qwen36-27b-backend

  # ---------------------------------------------------------------------------
  # Redis — cache + BullMQ async queue
  # ---------------------------------------------------------------------------
  langfuse-redis:
    # Pinned 2026-09-04. Queues only, so less precious than the higress ledger
    # — pinned to the same version for consistency across the host.
    image: docker.io/redis:7.4.10@sha256:e9b2e45ecd47fbb69b877cf8d045d5cccaaaed52524b6e098b4abe8212994f73
    container_name: qwen36-27b-langfuse-redis

    cpuset: "48-55"

    command: >
      --requirepass ${LANGFUSE_REDIS_PASSWORD:?set LANGFUSE_REDIS_PASSWORD in .env}
      --maxmemory-policy noeviction

    volumes:
      - ./langfuse-data/redis:/data

    ports:
      - "127.0.0.1:6379:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 10s
      retries: 10

    restart: unless-stopped

    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

    networks:
      - qwen36-27b-backend

  # ---------------------------------------------------------------------------
  # ClickHouse — OLAP: traces, observations, scores (high-volume analytics)
  # ---------------------------------------------------------------------------
  langfuse-clickhouse:
    # Pinned 2026-09-04 to the exact build. `25.12` floats within the series,
    # and this container holds every trace. 26.x exists; moving there is gated
    # on the Langfuse compatibility matrix, not on it being newer.
    image: docker.io/clickhouse/clickhouse-server:25.12.11.4@sha256:8a790dd3468db22b1d4e7b18a176f378ff5ff6053b9c48dd4ea1fa71a24c5ba6
    container_name: qwen36-27b-langfuse-clickhouse

    cpuset: "48-55"

    user: "101:101"

    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:?set LANGFUSE_CLICKHOUSE_PASSWORD in .env}
      TZ: UTC

    volumes:
      - ./langfuse-data/clickhouse:/var/lib/clickhouse
      - ./langfuse-data/clickhouse-logs:/var/log/clickhouse-server

      # Overrides are mounted FILE BY FILE, never as a directory.
      #
      # The image ships /etc/clickhouse-server/config.d/docker_related_config.xml,
      # which is what sets `listen_host` to the wildcards. Bind-mounting our own
      # directory onto config.d masks it, ClickHouse falls back to listening on
      # 127.0.0.1 inside its own namespace, and langfuse-web/worker lose the
      # database with a connection error that points nowhere near this file.
      - ./clickhouse/config.d/logging.xml:/etc/clickhouse-server/config.d/logging.xml:ro
      - ./clickhouse/config.d/system-log-ttl.xml:/etc/clickhouse-server/config.d/system-log-ttl.xml:ro
      - ./clickhouse/config.d/prometheus.xml:/etc/clickhouse-server/config.d/prometheus.xml:ro

    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"

    # Prometheus exposition, enabled by config.d/prometheus.xml. Internal only —
    # `expose`, not `ports`, so it exists on qwen36-27b-backend and nowhere else.
    expose:
      - "9363"

    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 1s

    restart: unless-stopped

    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

    networks:
      - qwen36-27b-backend

  # ---------------------------------------------------------------------------
  # MinIO — S3-compatible blob storage: raw events, multi-modal media
  # Auto-creates the `langfuse` bucket on boot.
  # ---------------------------------------------------------------------------
  langfuse-minio:
    # Pinned 2026-09-04. This was declared with NO TAG AT ALL, i.e. `:latest`
    # — the loosest reference on the host, on the container holding trace blobs.
    # Chainguard rebuilds continuously, so this moved on every pull.
    image: cgr.dev/chainguard/minio@sha256:66d17146a8c0c4ab97ec8e0b0ae03390be0311644032830d67d580359bde5764
    container_name: qwen36-27b-langfuse-minio

    cpuset: "48-55"

    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'

    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: ${LANGFUSE_MINIO_PASSWORD:?set LANGFUSE_MINIO_PASSWORD in .env}

    volumes:
      - ./langfuse-data/minio:/data

    ports:
      - "127.0.0.1:9092:9000"
      - "127.0.0.1:9093:9001"

    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 1s
      timeout: 5s
      retries: 5
      start_period: 1s

    restart: unless-stopped

    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

    networks:
      - qwen36-27b-backend

  # ---------------------------------------------------------------------------
  # Langfuse Web — UI + ingestion API
  # Receives traces from clients, writes events to S3, persists refs to Redis.
  # ---------------------------------------------------------------------------
  langfuse-web:
    # Pinned to the version ACTUALLY RUNNING, 2026-09-04. The `:4` tag is a
    # major-version float and had drifted a long way: this container was on
    # 4.5.0 while `:4` resolved to 4.28.1 — 23 minor versions, with forward-only
    # schema migrations between them.
    #
    # That is not theoretical. langfuse-web was recreated earlier the same day
    # to fix a bind bug; it reused the cached local image, but on a host where
    # the image had been pruned that recreate would have pulled 4.28.1 and run
    # every migration in between, unattended, mid-incident.
    #
    # Upgrading is now a deliberate decision with a rollback plan, not a side
    # effect of `up -d`.
    image: docker.io/langfuse/langfuse:4.5.0@sha256:d6ae613e435a1fbb7cc47e0648bedb71da9079e48ea2b59516714bd20a75384d
    container_name: qwen36-27b-langfuse-web

    cpuset: "48-55"

    depends_on:
      langfuse-postgres:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-minio:
        condition: service_healthy

    environment:
      # Bind address. NOT cosmetic, and not the same thing as NEXTAUTH_URL.
      #
      # The Next.js standalone server reads `process.env.HOSTNAME || '0.0.0.0'`
      # (/app/web/server.js:9) and binds that ONE address. Docker sets HOSTNAME
      # to the container id, which its embedded DNS resolves to a single
      # interface — so on a multi-homed container the server listens on one
      # network and refuses connections on the other.
      #
      # That is exactly what happened when this service joined `edge` to be
      # published: it bound the edge address, Caddy kept working, and the
      # otel-collector — backend-only — got ECONNREFUSED on every span export
      # for 13 hours while the queue filled and dropped. Verified in the
      # container: one LISTEN socket, on the edge address only.
      #
      # 0.0.0.0 binds every interface, which is what a container on two
      # networks needs. The healthcheck below still works: $$HOSTNAME then
      # expands to 0.0.0.0, which is a valid connect target on Linux.
      HOSTNAME: "0.0.0.0"

      # Auth
      #
      # NEXTAUTH_URL must be the address users actually reach, because NextAuth
      # builds its sign-in and callback URLs from it. Left at localhost while
      # served on a public hostname, the login round-trip redirects the browser
      # to localhost:3001 and authentication simply fails — the page loads, the
      # form submits, and nothing happens.
      NEXTAUTH_URL: ${LANGFUSE_PUBLIC_URL:-http://localhost:3001}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:?set LANGFUSE_NEXTAUTH_SECRET in .env}

      # Signup is OPEN by default in Langfuse. That is fine on loopback, and not
      # fine on a public hostname: anyone who finds the URL can register an
      # account. Closed here, so the only accounts are the initialised admin and
      # whoever it invites.
      AUTH_DISABLE_SIGNUP: ${LANGFUSE_DISABLE_SIGNUP:-true}

      # Database
      DATABASE_URL: postgresql://postgres:${LANGFUSE_POSTGRES_PASSWORD}@langfuse-postgres:5432/postgres

      # Encryption
      SALT: ${LANGFUSE_SALT:?set LANGFUSE_SALT in .env}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:?set LANGFUSE_ENCRYPTION_KEY in .env}

      # Telemetry — off for self-hosted
      TELEMETRY_ENABLED: "false"

      # ClickHouse
      CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
      CLICKHOUSE_URL: http://langfuse-clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:?set LANGFUSE_CLICKHOUSE_PASSWORD in .env}
      CLICKHOUSE_CLUSTER_ENABLED: "false"

      # S3 — event upload
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_PASSWORD:?set LANGFUSE_MINIO_PASSWORD in .env}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/

      # S3 — media upload
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_PASSWORD:?set LANGFUSE_MINIO_PASSWORD in .env}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/

      # Redis
      REDIS_HOST: langfuse-redis
      REDIS_PORT: "6379"
      REDIS_AUTH: ${LANGFUSE_REDIS_PASSWORD:?set LANGFUSE_REDIS_PASSWORD in .env}

      # LLM gateway upstream allowlist (SSRF guard) — docker-internal router
      LANGFUSE_LLM_CONNECTION_WHITELISTED_HOST: ${LANGFUSE_LLM_CONNECTION_WHITELISTED_HOST:-}

      # Headless initialization — creates first org, project, user
      LANGFUSE_INIT_ORG_NAME: ${LANGFUSE_INIT_ORG_NAME:-Default}
      LANGFUSE_INIT_PROJECT_NAME: ${LANGFUSE_INIT_PROJECT_NAME:-qwen36-27b}
      # Seeds the project key pair — FIRST BOOT ONLY. An already-initialised
      # Langfuse keeps the keys its project was created with and ignores these
      # entirely, so they are optional rather than fail-fast: making them
      # required would break every compose command on an existing install in
      # exchange for nothing.
      #
      # Sourced from the canonical SDK variable names, which is what the
      # Langfuse UI hands you and therefore what anyone will actually set.
      # The credential the collector authenticates with at runtime is
      # LANGFUSE_OTEL_AUTH, derived from this same pair by init-langfuse.sh.
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:-admin@example.com}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_INIT_USER_NAME:-admin}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:?set LANGFUSE_INIT_USER_PASSWORD in .env}

    ports:
      - "127.0.0.1:3001:3000"

    # The four infra services below this tier all had healthchecks; the two
    # application services did not, so `docker compose ps` reported them
    # `running` whether or not they could serve. /api/public/ready is the
    # readiness probe (checks DB + ClickHouse + Redis reachability), not the
    # liveness one — a web container that is up but cannot reach ClickHouse is
    # exactly the state worth surfacing here.
    #
    # wget, not curl: the image has wget only (verified in the image, not
    # assumed). start_period covers Prisma migrations on first boot.
    #
    # $$HOSTNAME, not localhost. Historically this mattered because Docker set
    # HOSTNAME to the container id and the server bound only that interface, so
    # a 127.0.0.1 probe was refused against a perfectly healthy service. We now
    # set HOSTNAME=0.0.0.0 explicitly (see the environment block above), so the
    # probe resolves to 0.0.0.0:3000 and localhost would also work — but the
    # form is kept because it stays correct either way, including if the
    # explicit bind is ever removed. The doubled $$ escapes compose
    # interpolation so the shell expands it.
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://$$HOSTNAME:3000/api/public/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s

    restart: unless-stopped

    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

    # Both networks, exactly as Grafana does, and for the same reason: Caddy
    # lives on `edge` and cannot reach `qwen36-27b-backend`, while this service
    # needs postgres, clickhouse, redis and minio which are backend-only.
    #
    # This does NOT weaken the segmentation the compose header describes. That
    # boundary exists so Caddy cannot reach WORKER ports and ZMQ sockets, and
    # the workers stay backend-only. Putting a UI on `edge` is what `edge` is
    # for — it is the same shape as grafana and the router.
    networks:
      - qwen36-27b-backend
      - edge

  # ---------------------------------------------------------------------------
  # Langfuse Worker — async event processing
  # Picks up events from S3, ingests into ClickHouse.
  # ---------------------------------------------------------------------------
  langfuse-worker:
    # Same float, same drift, same pin. Worker and web MUST move together —
    # they share the ClickHouse and Postgres schema.
    image: docker.io/langfuse/langfuse-worker:4.5.0@sha256:a3656ff75471b7835f70b56f4425990f6b1430b8253f92b40bb907e950ad1b8a
    container_name: qwen36-27b-langfuse-worker

    cpuset: "48-55"

    depends_on:
      langfuse-postgres:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-minio:
        condition: service_healthy

    environment:
      # Auth
      NEXTAUTH_URL: http://localhost:3001

      # Database
      DATABASE_URL: postgresql://postgres:${LANGFUSE_POSTGRES_PASSWORD}@langfuse-postgres:5432/postgres

      # Encryption
      SALT: ${LANGFUSE_SALT:?set LANGFUSE_SALT in .env}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:?set LANGFUSE_ENCRYPTION_KEY in .env}

      # Telemetry
      TELEMETRY_ENABLED: "false"

      # ClickHouse
      CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
      CLICKHOUSE_URL: http://langfuse-clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:?set LANGFUSE_CLICKHOUSE_PASSWORD in .env}
      CLICKHOUSE_CLUSTER_ENABLED: "false"

      # S3 — event upload
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_PASSWORD:?set LANGFUSE_MINIO_PASSWORD in .env}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/

      # S3 — media upload
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_PASSWORD:?set LANGFUSE_MINIO_PASSWORD in .env}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/

      # Redis
      REDIS_HOST: langfuse-redis
      REDIS_PORT: "6379"
      REDIS_AUTH: ${LANGFUSE_REDIS_PASSWORD:?set LANGFUSE_REDIS_PASSWORD in .env}

      # LLM gateway upstream allowlist (SSRF guard) — docker-internal router
      LANGFUSE_LLM_CONNECTION_WHITELISTED_HOST: ${LANGFUSE_LLM_CONNECTION_WHITELISTED_HOST:-}

    ports:
      - "127.0.0.1:3030:3030"

    # The worker is where trace ingestion actually happens: spans that reach
    # langfuse-web but never appear in the UI are almost always a stalled
    # worker. Without a healthcheck that failure mode is invisible until
    # someone opens the UI and finds it empty.
    # $$HOSTNAME rather than localhost — same binding behaviour as the web
    # container; see the note there.
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://$$HOSTNAME:3030/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s

    restart: unless-stopped

    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

    networks:
      - qwen36-27b-backend

  # ---------------------------------------------------------------------------
  # OpenTelemetry Collector — protocol bridge, SGLang gRPC -> Langfuse HTTP
  #
  # Lives in THIS overlay, not the metrics overlay, because its only exporter
  # targets langfuse-web: it cannot do useful work without Langfuse, while
  # Langfuse is perfectly useful without it. Overlays split on lifecycle.
  #
  # Consequence to know: the workers and router in docker-compose.yml point
  # their --otlp-traces-endpoint at this service.
  #
  # An earlier note here claimed SGLang raises on exporter INITIALISATION
  # failure, making it unsupported to bring the inference tier up without this
  # overlay. That is WRONG, and it was wrong in a way that discouraged testing
  # boot order. Measured against the pinned engine image 2026-09-04:
  #
  #   process_tracing_init('http://this-host-does-not-exist:4317', ...)
  #     -> returns successfully in 0.01s
  #
  # get_otlp_span_exporter builds a GRPCSpanExporter whose channel is lazy; no
  # connection is attempted until the first export. process_tracing_init raises
  # only on a malformed endpoint, an unsupported protocol, or a missing
  # opentelemetry package — never on an unreachable one. Replica startup does
  # not depend on this container, which is why boot ordering is handled by
  # making services resilient rather than by sequencing them.
  # ---------------------------------------------------------------------------
  otel-collector:
    # 0.158.0 -> 0.160.0 on 2026-09-04. Stateless bridge; a restart drops only
    # what is in the send queue, which was 0 at the time.
    image: otel/opentelemetry-collector:0.160.0@sha256:e495787f07dbe432ce763ebaf5bc3d113850e9eee2250ade7a3da6a882d0d69a
    container_name: qwen36-27b-otel-collector

    cpuset: "48-55"

    command:
      - --config=/etc/otelcol/config.yaml

    depends_on:
      langfuse-web:
        condition: service_started

    environment:
      # Basic base64(project_public_key:project_secret_key). Project keys are
      # created by the headless init below; see docs/LANGFUSE.md.
      LANGFUSE_OTEL_AUTH: ${LANGFUSE_OTEL_AUTH:?set LANGFUSE_OTEL_AUTH in .env}

    volumes:
      - ./otel/collector.yaml:/etc/otelcol/config.yaml:ro

    # No published host ports. Traces arrive over the backend network; the
    # :8888 self-telemetry endpoint is scraped by Prometheus on that network.
    expose:
      - "4317"
      - "4318"
      - "8888"

    networks:
      - qwen36-27b-backend
      # higressint, added 2026-09-04 for Stage C: the Higress gateway pushes
      # its own spans here, and the two containers had NO network in common —
      # the gateway is on edge/higress-net/higressint, this was backend-only.
      #
      # higressint rather than `edge`, deliberately. Both would work. `edge`
      # carries Caddy, the internet-facing process, and an OTLP receiver there
      # would take spans from anything reaching that network. higressint holds
      # the ledger redis, the gateway and the control plane — no public front
      # door — so it is the narrower of the two.
      #
      # NOT the reverse (gateway onto the backend): that hands an
      # internet-facing proxy a route to the worker ports and ZMQ sockets,
      # which is the whole reason the split exists.
      - higressint

    # No healthcheck, deliberately. The core collector image is distroless —
    # no shell, no wget — so CMD-SHELL cannot run, and the `health_check`
    # extension that would answer an HTTP probe lives in the contrib
    # distribution, not this one. Liveness is covered instead by the Prometheus
    # job on :8888: `up{job="otel-collector"}` is the same signal, and
    # otelcol_exporter_send_failed_spans catches the more interesting failure
    # where the process is alive but nothing is reaching Langfuse.
    restart: unless-stopped

    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

networks:
  # References the existing backend network from docker-compose.yml.
  # Do NOT set external: true — compose will create it if it doesn't exist,
  # but it already exists from the main stack.
  qwen36-27b-backend:
    name: qwen36-27b-backend
    external: false

  # Owned by the higress deployment — and unowned in the sense that the compose
  # project which created it no longer exists. Declared, never created, here.
  # If it is ever removed, this stack and the gateway both fail to start.
  higressint:
    name: higressint
    external: true
