# Unit tests for the transforms in vector.yaml. Not loaded by the running
# Vector (its command names vector.yaml only); run them before a restart:
#
#   docker run --rm --cpuset-cpus 48-55 -v "$PWD/vector:/etc/vector:ro" \
#     --entrypoint vector timberio/vector:0.58.0-alpine \
#     test /etc/vector/vector.yaml /etc/vector/vector_test.yaml
#
tests:
  - name: cut stream is flagged unbilled
    inputs:
      - insert_at: gateway_metric_fields
        type: log
        log_fields: { consumer: "alice", route: "ai-chat", status: 200, duration_ms: 4112, total_tokens: 0, response_flags: "DC", model: "" }
    outputs:
      - extract_from: gateway_metric_fields
        conditions:
          - type: vrl
            source: 'assert_eq!(.unbilled_cut, 1) && assert_eq!(.unbilled_cut_s, 4.112)'
  - name: normal request emits zero
    inputs:
      - insert_at: gateway_metric_fields
        type: log
        log_fields: { consumer: "alice", route: "ai-chat", status: 200, duration_ms: 1000, total_tokens: 81, response_flags: "-", model: "m" }
    outputs:
      - extract_from: gateway_metric_fields
        conditions:
          - type: vrl
            source: 'assert_eq!(.unbilled_cut, 0) && assert_eq!(.unbilled_cut_s, 0.0)'
  - name: combined flags and upstream protocol error count
    inputs:
      - insert_at: gateway_metric_fields
        type: log
        log_fields: { consumer: "bob", route: "ai-completions", status: 0, duration_ms: 900468, total_tokens: 0, response_flags: "UC,UPE", model: "" }
    outputs:
      - extract_from: gateway_metric_fields
        conditions:
          - type: vrl
            source: 'assert_eq!(.unbilled_cut, 1)'
  - name: free model listing and admin quota call are not billable
    inputs:
      - insert_at: gateway_metric_fields
        type: log
        log_fields: { consumer: "alice", route: "ai-models", status: 200, duration_ms: 3, total_tokens: 0, response_flags: "DC", model: "" }
    outputs:
      - extract_from: gateway_metric_fields
        conditions:
          - type: vrl
            source: 'assert_eq!(.unbilled_cut, 0)'
  - name: zero-token rejection without a cut flag is not a cut
    inputs:
      - insert_at: gateway_metric_fields
        type: log
        log_fields: { consumer: "alice", route: "ai-chat", status: 403, duration_ms: 2, total_tokens: 0, response_flags: "-", model: "" }
    outputs:
      - extract_from: gateway_metric_fields
        conditions:
          - type: vrl
            source: 'assert_eq!(.unbilled_cut, 0)'
  - name: counters are emitted
    inputs:
      - insert_at: gateway_metric_fields
        type: log
        log_fields: { consumer: "alice", route: "ai-chat", status: 200, duration_ms: 4112, total_tokens: 0, input_tokens: 0, output_tokens: 0, response_flags: "DC", model: "" }
    outputs:
      - extract_from: gateway_metrics
        conditions:
          - type: vrl
            source: '.name != "unbilled_requests_total" || (.tags.consumer == "alice" && .counter.value == 1.0)'
  - name: a models request keeps all its metrics
    inputs:
      - insert_at: gateway_metric_fields
        type: log
        log_fields: { consumer: "alice", route: "ai-models", status: 200, duration_ms: 3, total_tokens: 0, input_tokens: 0, output_tokens: 0, response_flags: "-", model: "" }
    outputs:
      - extract_from: gateway_metrics
        conditions:
          - type: vrl
            source: '.name != "requests_total" || .counter.value == 1.0'
