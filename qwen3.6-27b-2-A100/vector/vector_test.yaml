# Unit tests for the transforms in vector.yaml. Not loaded by the running
# Vector (its command names vector.yaml only); run them before a restart:
#
#   docker run --rm --cpuset-cpus 48-55 -v "$PWD/vector:/etc/vector:ro" \
#     --entrypoint vector timberio/vector:0.58.0-alpine \
#     test /etc/vector/vector.yaml /etc/vector/vector_test.yaml
#
tests:
  - name: engine record becomes an engine.requests row
    inputs:
      - insert_at: engine_rows
        type: log
        log_fields:
          file: "/var/log/sglang/r1/sglang-request-metrics-20260914_01.log"
          message: '{"request_parameters": "{\"rid\": \"abc123\", \"stream\": true, \"custom_labels\": {\"consumer\": \"alice\"}}", "id": "abc123", "finish_reason": {"type": "stop", "matched": 248046}, "prompt_tokens": 9693, "completion_tokens": 30, "reasoning_tokens": 36, "cached_tokens": 9664, "cached_tokens_details": {"device": 9600, "host": 64}, "queue_time": 0.002, "api_server_dispatch_finish_ts": 1789327385.625, "forward_entry_time": 1789327385.75, "prefill_finished_time": 1789327386.25, "request_received_ts": 1789327385.5, "request_finished_ts": 1789327387.5, "e2e_latency": 2.0, "num_retractions": 0}'
    outputs:
      - extract_from: engine_rows
        conditions:
          - type: vrl
            source: |
              assert_eq!(.consumer, "alice") &&
              assert_eq!(.replica, "r1") &&
              assert_eq!(.rid, "abc123") &&
              assert_eq!(.is_streaming, true) &&
              assert_eq!(.prompt_tokens, 9693) &&
              assert_eq!(.completion_tokens, 30) &&
              assert_eq!(.cached_device, 9600) &&
              assert_eq!(.cached_host, 64) &&
              assert_eq!(.ttft_s, 0.627) &&
              assert_eq!(.prefill_s, 0.5) &&
              assert_eq!(.decode_s, 1.373) &&
              assert_eq!(.finish_type, "stop") &&
              assert_eq!(.finished_at, "2026-09-13 19:23:07.500") &&
              assert_eq!(.source, "engine")
  - name: engine record without consumer or cache details keeps totals
    inputs:
      - insert_at: engine_rows
        type: log
        log_fields:
          file: "/var/log/sglang/r0/sglang-request-metrics-20260914_01.log"
          message: '{"request_parameters": "{\"rid\": \"x\", \"stream\": false}", "id": "x", "finish_reason": {"type": "abort"}, "prompt_tokens": 100, "completion_tokens": 3, "cached_tokens": 64, "cached_tokens_details": null, "request_received_ts": 1789327385.5, "request_finished_ts": 1789327386.5, "e2e_latency": 1.0}'
    outputs:
      - extract_from: engine_rows
        conditions:
          - type: vrl
            source: |
              assert_eq!(.consumer, "") &&
              assert_eq!(.replica, "r0") &&
              assert_eq!(.cached_device, 64) &&
              assert_eq!(.cached_host, 0) &&
              assert_eq!(.ttft_s, null) &&
              assert_eq!(.queue_s, null) &&
              assert_eq!(.reasoning_tokens, null) &&
              assert_eq!(.finish_type, "abort")
  # Shape of SGLang's scheduler-side abort (_handle_abort_req, v0.5.19):
  # no prompt, cache or finish timestamp fields, only completion_tokens, the
  # e2e latency and the response-sent time stamped on the way out.
  - name: aborted engine record keeps consumer and leaves cache unknown
    inputs:
      - insert_at: engine_rows
        type: log
        log_fields:
          file: "/var/log/sglang/r1/sglang-request-metrics-20260914_01.log"
          message: '{"request_parameters": "{\"rid\": \"ab1\", \"stream\": true, \"custom_labels\": {\"consumer\": \"alice\"}}", "id": "ab1", "finish_reason": {"type": "abort", "message": "client disconnected"}, "weight_version": "default", "e2e_latency": 3.2, "completion_tokens": 12, "response_sent_to_client_ts": 1789327390.25}'
    outputs:
      - extract_from: engine_rows
        conditions:
          - type: vrl
            source: |
              assert_eq!(.consumer, "alice") &&
              assert_eq!(.finish_type, "abort") &&
              assert_eq!(.prompt_tokens, 0) &&
              assert_eq!(.completion_tokens, 12) &&
              assert_eq!(.cached_tokens, null) &&
              assert_eq!(.cached_device, null) &&
              assert_eq!(.cached_host, null) &&
              assert_eq!(.e2e_s, 3.2) &&
              assert_eq!(.finished_at, "2026-09-13 19:23:10.250") &&
              assert_eq!(.received_at, "2026-09-13 19:23:10.250")
  # The scheduler's clock 1.03 s ahead of the tokenizer's, as measured on r0
  # on 2026-09-15: timings must not change.
  - name: scheduler clock skew does not leak into timings
    inputs:
      - insert_at: engine_rows
        type: log
        log_fields:
          file: "/var/log/sglang/r0/sglang-request-metrics-20260915_13.log"
          message: '{"request_parameters": "{\"rid\": \"sk1\", \"stream\": false, \"custom_labels\": {\"consumer\": \"alice\"}}", "id": "sk1", "finish_reason": {"type": "length"}, "prompt_tokens": 13, "completion_tokens": 4, "cached_tokens": 0, "cached_tokens_details": {"device": 0, "host": 0}, "queue_time": 0.001, "api_server_dispatch_finish_ts": 1789327385.625, "forward_entry_time": 1789327386.656, "prefill_finished_time": 1789327386.726, "request_received_ts": 1789327385.5, "request_finished_ts": 1789327385.75, "e2e_latency": 0.25}'
    outputs:
      - extract_from: engine_rows
        conditions:
          - type: vrl
            source: |
              assert_eq!(.prefill_s, 0.07) &&
              assert_eq!(.ttft_s, 0.196) &&
              assert_eq!(.decode_s, 0.054) &&
              assert_eq!(.e2e_s, 0.25)

  - name: gateway access line becomes a gateway.requests row with the client IP
    inputs:
      - insert_at: gateway_rows
        type: log
        log_fields:
          message: '{"ai_log":"{\"api\":\"-\",\"chat_id\":\"4927448c\",\"chat_round\":1,\"input_token\":1389,\"llm_service_duration\":34797,\"model\":\"qwen3.8-27b\",\"output_token\":4000,\"response_type\":\"normal\",\"total_token\":5389}","authority":"higress","consumer":"quota-admin","duration":"34798","request_id":"e2644f8e-4c9d-4cff-a346-6b484f410116","response_code":"200","response_flags":"-","route_name":"ai-chat","start_time":"2026-09-17T07:08:32.850Z","upstream_cluster":"outbound|8000||qwen-router.dns","user_agent":"-","x_forwarded_for":"198.51.100.23,172.18.0.6"}'
    outputs:
      - extract_from: gateway_rows
        conditions:
          - type: vrl
            source: |
              assert_eq!(.consumer, "quota-admin") &&
              assert_eq!(.client_ip, "198.51.100.23") &&
              assert_eq!(.status, 200) &&
              assert_eq!(.total_tokens, 5389) &&
              assert_eq!(.chat_id, "4927448c") &&
              assert_eq!(.ts, "2026-09-17 07:08:32.850")

  - name: unauthenticated line keeps an empty consumer and its client IP
    inputs:
      - insert_at: gateway_rows
        type: log
        log_fields:
          message: '{"ai_log":"-","consumer":"-","duration":"0","request_id":"541a93d1","response_code":"401","response_flags":"-","route_name":"ai-models","start_time":"2026-09-17T08:40:09.605Z","user_agent":"curl/8.5.0","x_forwarded_for":"203.0.113.9"}'
    outputs:
      - extract_from: gateway_rows
        conditions:
          - type: vrl
            source: |
              assert_eq!(.consumer, "") &&
              assert_eq!(.client_ip, "203.0.113.9") &&
              assert_eq!(.status, 401)
