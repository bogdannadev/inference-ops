# =============================================================================
# OpenTelemetry Collector — SGLang trace pipeline
# Location in repo: ./otel/collector.yaml
# Mounted read-only into the otel-collector container by compose.langfuse.yml
#
# Why this process exists at all:
#   SGLang's span exporter defaults to OTLP/gRPC (srt/observability/trace.py,
#   OTEL_EXPORTER_OTLP_TRACES_PROTOCOL defaults to "grpc"). Langfuse accepts
#   OTLP over HTTP only — HTTP/protobuf or HTTP/JSON — and explicitly does not
#   support gRPC. The collector is the protocol bridge; without it the two ends
#   cannot talk. It is not an optional convenience.
#
# It also earns its keep as a buffer. SGLang's exporter is in-process on the
# tokenizer and scheduler threads, so a Langfuse restart would otherwise push
# backpressure into the inference tier. The sending_queue absorbs that.
# =============================================================================

receivers:
  # gRPC is what the SGLang engine and the router both use by default.
  # HTTP stays open so a client SDK or the embedder can ship to the same
  # collector later without adding another moving part.
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Hard ceiling before the Go heap can grow into the inference tier's RAM.
  # Must be FIRST in the pipeline so it rejects at the front door rather than
  # after batching has already allocated.
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128

  # STAGE D — one identity for all three signals.
  #
  # Prometheus stamps `node` and `stack` onto every series via
  # `global.external_labels`. Spans arrive from three different SDKs (the
  # sglang engine, the smg router, and Envoy in the gateway) and none of them
  # knows what node it is on, so until now a span could not be attributed to
  # this deployment at all -- only to a service name.
  #
  # Stamping here rather than in each emitter is deliberate: it is one place,
  # it cannot drift between the three, and it applies to anything that ships
  # to this collector later without touching that component's config.
  #
  # `upsert` not `insert`: if a future emitter sets these itself, its value
  # wins and we do not silently overwrite a genuine second node's identity.
  #
  # NOTE deliberately NOT setting deployment.environment. Langfuse maps that
  # onto its first-class `environment` field, which today reads `default` for
  # every span. Changing it partitions the Langfuse UI -- historical spans stay
  # in `default` while new ones move -- for no gain on a single-node stack.
  # Flip it when a second node ships, not before.
  resource/identity:
    attributes:
      - key: node
        value: a100
        action: upsert
      - key: stack
        value: qwen36-27b
        action: upsert

  # DROP decode_loop. Measured 2026-09-05: it is 76.9% of all spans
  # (203,404 of 264k in 24h, ~33 per request -- one span per decode iteration)
  # and it actively CORRUPTS the only aggregate Langfuse offers.
  #
  # Langfuse reads `attributes.decode_ct` off these spans as token usage. Over
  # 24h that summed to 98,198,709 against a billing-grade fact-table total of
  # 345,195 -- the Metrics API reported 101,091,611 tokens, ~293x reality, and
  # a `totalCost` derived from it. Anyone reading Langfuse for usage was
  # reading a number three orders of magnitude wrong.
  #
  # Dropping it here rather than lowering SGLANG_TRACE_LEVEL keeps every
  # request-level span we actually use for latency forensics -- request_process,
  # prefill_waiting, prefill_forward, decode_forward, tokenize -- and loses only
  # the per-decode-iteration slice, which no dashboard or runbook reads.
  #
  # KILL SWITCH: delete this processor and its entry in the pipeline below, then
  # restart the collector. The engine keeps emitting them; nothing upstream
  # changes. `curl "http://qwen36-27b-r0:8001/set_trace_level?level=N"` is the
  # other end of the same dial and needs no restart at all.
  filter/drop_decode_loop:
    error_mode: ignore
    traces:
      span:
        - 'name == "decode_loop"'

  # Langfuse ingestion is one REST call per batch; batching is what stops that
  # becoming one HTTP round-trip per span. 5s matches the tolerance here —
  # these spans are for post-hoc latency forensics, not live alerting.
  batch:
    timeout: 5s
    send_batch_size: 512
    send_batch_max_size: 1024

exporters:
  # `otlp_http`, not the older `otlphttp` alias — the alias still resolves but
  # logs a deprecation warning on every start.
  otlp_http/langfuse:
    # Base path only — the collector appends /v1/traces itself.
    endpoint: http://langfuse-web:3000/api/public/otel

    headers:
      # Basic base64(public_key:secret_key) for the Langfuse PROJECT, not the
      # admin user:
      #   printf '%s:%s' "$PUBLIC_KEY" "$SECRET_KEY" | base64 -w0
      Authorization: "Basic ${env:LANGFUSE_OTEL_AUTH}"
      # Required by Langfuse v4 for real-time ingestion; without it the batch
      # is accepted but handled on the legacy path.
      x-langfuse-ingestion-version: "4"

    # Survive a Langfuse/ClickHouse restart without losing the window.
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 60s
      max_elapsed_time: 300s

    sending_queue:
      enabled: true
      queue_size: 1000

service:
  telemetry:
    metrics:
      # `service.telemetry.metrics.address` is ignored as of collector v0.123;
      # `readers` replaced it. The default binds 127.0.0.1, which Prometheus
      # cannot reach from its own container — hence the explicit 0.0.0.0.
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888

  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource/identity, filter/drop_decode_loop, batch]
      exporters: [otlp_http/langfuse]
